name: course-audio
run-name: course-audio · ${{ inputs.list }} · ${{ inputs.dry_run == 'true' && 'DRY RUN' || 'REAL' }}

# Job B (media pipeline) — BATCH transcode (Q3, bulk-02). Reads a CSV queue of
# Drive file ids, transcodes each recording into a normalised 64 kbps mono MP3
# on Cloudflare R2, and appends ONE DRAFT line per file to
# data/media-manifest.json.
#
# - input `list`        : path to the queue CSV (default data/audio-queue.csv),
#                         one drive_file_id per line (header `drive_file_id` ok).
# - input `limit`       : max files this run (default 5).
# - input `max_minutes` : stop starting new files once this wall-clock budget is
#                         spent, leaving the rest for the next run (default 300).
# - input `concurrency` : parallel transcodes (default 2).
#
# Ids already in data/media-manifest.json are SKIPPED. The manifest is committed
# AFTER EACH FILE (scripts/ci/save-manifest.sh via SAVE_CMD) and again at the end
# (also on cancellation), so a cancel, timeout or runner loss never leaves an R2
# object without its entry.
#
# ffprobe decides the real type (some videos are named .mp3); for a video only
# the audio TRACK is streamed from the Drive URL with the WIF access token as an
# Authorization header. Keys are immutable (never overwritten).
#
# Auth: Workload Identity Federation (no keys). Manual only.

on:
  workflow_call:
    inputs:
      list:
        type: string
        required: true
      limit:
        type: string
        default: "5"
      max_minutes:
        type: string
        default: "300"
      concurrency:
        type: string
        default: "2"
      force_ids:
        type: string
        default: ""
      dry_run:
        type: string
        default: "false"
  workflow_dispatch:
    inputs:
      list:
        description: "Path to the queue CSV of drive_file_ids, INCLUDING the folder (e.g. data/audio-queue.pilot.csv)"
        required: true
        default: "data/audio-queue.csv"
      limit:
        description: "Max files to process this run"
        required: true
        default: "5"
      max_minutes:
        description: "Wall-clock budget: stop starting new files after this many minutes"
        required: true
        default: "300"
      concurrency:
        description: "Parallel transcodes"
        required: true
        default: "2"
      force_ids:
        description: "Comma-separated drive_file_ids to RE-MEASURE (no re-upload), even if already in the manifest"
        required: false
        default: ""
      dry_run:
        description: "Measure + log G/depth/busy/expected result only — no upload, no manifest write"
        required: false
        default: "false"

permissions:
  contents: write # the job commits the DRAFT manifest entries to main
  id-token: write # Workload Identity Federation

concurrency:
  # One in-flight run PER QUEUE (the `list` input), so two different course
  # queues can transcode at the same time; a second run of the SAME queue waits.
  group: course-audio-${{ inputs.list }}
  cancel-in-progress: false

jobs:
  transcode:
    runs-on: ubuntu-latest
    timeout-minutes: 340 # under GitHub's 360-min hard cap; max_minutes stops sooner
    env:
      QUEUE: ${{ inputs.list }}
      LIMIT: ${{ inputs.limit }}
      MAX_MINUTES: ${{ inputs.max_minutes }}
      JOBS: ${{ inputs.concurrency }}
      FORCE_IDS: ${{ inputs.force_ids }}
      MANIFEST: data/media-manifest.json
    steps:
      - name: Check out the repo
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version

      - name: Install ffmpeg (ffprobe + ffmpeg)
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Authenticate to Google Cloud (Workload Identity Federation)
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/drive

      - name: Set up rclone
        uses: AnimMouse/setup-rclone@v1

      - name: Configure rclone R2 remote (course-media token)
        env:
          # The course-media token (scoped to course-media ONLY).
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
        run: |
          # Endpoint is built from the account id secret (no R2_ENDPOINT var).
          if [ -z "${R2_ACCOUNT_ID}" ]; then
            echo "::error title=R2_ACCOUNT_ID missing::Set the repository secret R2_ACCOUNT_ID (the Cloudflare account id); the R2 S3 endpoint is built from it."
            exit 1
          fi
          mkdir -p "$HOME/.config/rclone"
          cat > "$HOME/.config/rclone/rclone.conf" <<EOF
          [r2]
          type = s3
          provider = Cloudflare
          access_key_id = ${R2_ACCESS_KEY_ID}
          secret_access_key = ${R2_SECRET_ACCESS_KEY}
          endpoint = https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com
          no_check_bucket = true
          EOF
          # Log the target so a wrong bucket/endpoint is visible (no secrets):
          # the account id is masked to its last 4 chars, keys are never printed.
          echo "rclone remote r2 → bucket course-media, endpoint https://***${R2_ACCOUNT_ID: -4}.r2.cloudflarestorage.com"
          # Prove the remote actually reaches the course-media bucket now, before
          # any transcode, so a credential/bucket error fails fast and loud.
          if rclone lsd "r2:course-media" >/dev/null 2>&1; then
            echo "rclone: course-media bucket reachable"
          else
            echo "::error title=R2 bucket unreachable::rclone could not list r2:course-media — check R2_ACCOUNT_ID/keys and that the token is scoped to course-media."
            exit 1
          fi

      - name: Plan the run (skip ids already in the manifest, cap at limit)
        id: plan
        run: |
          set -euo pipefail
          node scripts/media/queue-plan.mjs "$QUEUE" "$MANIFEST" "$LIMIT" "$FORCE_IDS" > plan.json
          # The forced set drives per-id FORCE=1 in the batch loop (re-measure).
          node -e 'require("fs").writeFileSync("force-ids.txt",(require("./plan.json").force||[]).join("\n"))'
          # shellcheck disable=SC2016  # the single-quoted bodies below are Node (-e) code, not shell
          node -e 'const p=require("./plan.json");console.log(`toProcess ${p.toProcess.length}, skipped ${p.skipped.length}, remaining ${p.remaining.length}`)'
          node -e 'const p=require("./plan.json");require("fs").writeFileSync("to-process.txt",p.toProcess.join("\n"))'
          # Seed the summary with the skipped ids up front.
          node -e 'const p=require("./plan.json");const fs=require("fs");fs.writeFileSync("results.ndjson",p.skipped.map(id=>JSON.stringify({id,status:"skipped",reason:"already in manifest"})).join("\n")+(p.skipped.length?"\n":""))'
          # Emit the plan count as a step output the later steps' if: can see
          # (hashFiles can't — it only sees files present at checkout).
          N=$(node -e 'console.log(require("./plan.json").toProcess.length)')
          printf 'to_process=%s\n' "$N" >> "$GITHUB_OUTPUT"
          if [ "$N" -eq 0 ]; then echo "nothing to transcode this run."; fi

      - name: Transcode the batch (concurrency, time budget, immutable R2)
        if: ${{ steps.plan.outputs.to_process != '0' }}
        env:
          ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
          DRY_RUN: ${{ inputs.dry_run == 'true' && '1' || '0' }}
          # Commit the manifest after EACH file (empty in a dry run = no commits),
          # so a cancel / timeout cannot leave an R2 object without its entry.
          SAVE_CMD: ${{ inputs.dry_run == 'true' && '' || 'bash scripts/ci/save-manifest.sh' }}
          # Drive tokens expire after ~60 min. transcode-one re-mints a fresh
          # access token before each file and once on a 401 via this command
          # (the WIF credentials file is already on disk from the auth step).
          REFRESH_TOKEN_CMD: "gcloud auth print-access-token --scopes=https://www.googleapis.com/auth/drive"
        run: |
          set -uo pipefail
          chmod +x scripts/media/transcode-one.sh scripts/media/batch-run.sh
          # Sequential, logged, deterministic. Each id's exit code decides
          # done/failed; the old backgrounded loop silently dispatched nothing.
          scripts/media/batch-run.sh to-process.txt

      - name: Append DRAFT manifest entries for everything that finished
        if: ${{ always() }}
        run: |
          set -uo pipefail
          # entry-*.json files are written by transcode-one.sh for each success.
          shopt -s nullglob
          for e in entry-*.json; do
            node scripts/media/append-manifest.mjs "$MANIFEST" "$e" || true
          done
          echo "manifest now has $(node -e 'const fs=require("fs");console.log(fs.existsSync(process.env.MANIFEST)?JSON.parse(fs.readFileSync(process.env.MANIFEST,"utf8")).length:0)') entries"

      - name: Fail on R2 objects without a manifest entry
        if: ${{ always() }}
        run: |
          set -uo pipefail
          if [ -s results.orphan.ndjson ]; then
            ids=$(node -e 'console.log(require("fs").readFileSync("results.orphan.ndjson","utf8").split(/\r?\n/).filter(Boolean).map(l=>JSON.parse(l).id).join(", "))')
            echo "::error title=R2 object without manifest entry::R2 object without manifest entry - needs coordinator: ${ids}"
            exit 1
          fi
      - name: Fail if work was planned but nothing finished
        if: ${{ always() }}
        run: |
          set -uo pipefail
          planned='${{ steps.plan.outputs.to_process }}'
          [ -n "$planned" ] || planned=0
          if [ "$planned" = "0" ]; then echo "nothing was planned — ok"; exit 0; fi
          done=$( [ -f results.done.ndjson ] && grep -c . results.done.ndjson || echo 0 )
          orphan=$( [ -f results.orphan.ndjson ] && grep -c . results.orphan.ndjson || echo 0 )
          failed=$( [ -f results.failed.ndjson ] && grep -c . results.failed.ndjson || echo 0 )
          echo "planned ${planned}, done ${done}, failed ${failed}"
          if [ "$done" -eq 0 ] && [ "$failed" -eq 0 ] && [ "$orphan" -eq 0 ]; then
            echo "::error title=Nothing processed::${planned} file(s) were planned but none finished (done+failed=0)."
            exit 1
          fi

      - name: Write + print the run summary table
        if: ${{ always() }}
        run: |
          set -uo pipefail
          node -e 'const fs=require("fs");const lines=(fs.existsSync("results.ndjson")?fs.readFileSync("results.ndjson","utf8"):"").split(/\r?\n/).filter(Boolean).map(JSON.parse);import("./scripts/media/queue-plan.mjs").then(m=>{const md=m.summaryTable(lines);fs.writeFileSync("run-summary.md",md);process.stdout.write(md)})'
          cat run-summary.md >> "$GITHUB_STEP_SUMMARY" || true
          # Dry run: per-part G-loop table (part | I1 | TP1 | loops | final G |
          # I_lim or I_cap | depth | busy | expected result).
          if ls dryrun-*.json >/dev/null 2>&1; then
            {
              echo
              echo "### Dry run — G loop per part"
              node scripts/media/dryrun-table.mjs "$QUEUE" .
            } | tee dryrun-table.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Commit the manifest changes to main (also on cancellation)
        if: ${{ always() && inputs.dry_run != 'true' }}
        run: |
          set -uo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "$MANIFEST" || true
          if git diff --cached --quiet; then
            echo "no manifest change to commit"
          else
            git commit -m "course-audio: DRAFT manifest entries (batch)"
            # Pull --rebase before pushing, retry up to 3x; a failed final push FAILS the job.
            bash scripts/ci/push-with-retry.sh origin main || exit 1
          fi