name: approve-media

# R4 (bulk-03) — a reviewer approves or rejects course-audio WITHOUT hand-editing
# data/media-manifest.json. Manual (workflow_dispatch): pick the decision, give
# the comma-separated Drive file ids and your name, Run. The job sets
# `status`/`reviewer`/`reviewed_at` on each matching entry and commits to main.
#
# - An id not in the manifest is reported as "not found"; the job still succeeds
#   for the rest.
# - A rejected entry is KEPT (audit trail) but never plays — build-courses counts
#   only an `approved` status (P-19). A correction is re-uploaded under a new key
#   (`-v2`) by the pipeline, never by overwriting here.
#
# Mode "all-passing" (12 Nov, default off): approve every converted lesson that passed
# the automatic pre-approval check (data/queues/approve/precheck.json, written by
# approve-check.yml), i.e. every converted, unapproved lesson NOT in FLAGGED.md and not
# waiting for a check. The ids field is ignored; the decision must be "approved".
# "Dry run" lists what would be approved or decided and changes nothing (any mode).
#
# Media "video" (PART V3, needs repo variable VIDEO_ENABLED=true): the same decisions on
# data/video-manifest.json; all-passing reads data/queues/approve-video/precheck.json
# (video-approve-check.yml). Default "audio" = unchanged behaviour on
# data/media-manifest.json.
#
# No external auth: this job only edits a repo file and pushes.

on:
  workflow_dispatch:
    inputs:
      decision:
        description: "Reviewer decision for the listed files"
        required: true
        type: choice
        options:
          - approved
          - rejected
        default: approved
      drive_file_ids:
        description: "Comma-separated Drive file ids to decide on (ignored in mode all-passing)"
        required: false
        default: ""
      reviewer:
        description: "Reviewer name (recorded in the manifest)"
        required: true
      mode:
        description: "per-ids = the ids above; all-passing = every lesson that passed the pre-approval check"
        required: true
        type: choice
        options:
          - per-ids
          - all-passing
        default: per-ids
      dry_run:
        description: "Dry run: only list what would change, change nothing"
        required: true
        type: choice
        options:
          - "false"
          - "true"
        default: "false"
      media:
        description: "audio = data/media-manifest.json (default); video = data/video-manifest.json"
        required: true
        type: choice
        options:
          - audio
          - video
        default: audio

permissions:
  contents: write # commits the manifest decision to main

concurrency:
  group: approve-media
  cancel-in-progress: false

env:
  MANIFEST: data/media-manifest.json

jobs:
  approve:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the repo
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version

      - name: Apply the decision to the manifest
        id: apply
        env:
          DECISION: ${{ github.event.inputs.decision }}
          REVIEWER: ${{ github.event.inputs.reviewer }}
          IDS: ${{ github.event.inputs.drive_file_ids }}
          MODE: ${{ github.event.inputs.mode }}
          DRY_RUN: ${{ github.event.inputs.dry_run }}
          MEDIA: ${{ github.event.inputs.media || 'audio' }}
          VIDEO_ENABLED: ${{ vars.VIDEO_ENABLED }}
        run: |
          set -euo pipefail
          if [ "$MEDIA" = "video" ]; then
            if [ "$VIDEO_ENABLED" != "true" ]; then
              echo "::error::media video needs the repo variable VIDEO_ENABLED=true"
              exit 1
            fi
            MANIFEST=data/video-manifest.json
            echo "MANIFEST=$MANIFEST" >> "$GITHUB_ENV"
          fi
          DRY=""
          if [ "$DRY_RUN" = "true" ]; then DRY="--dry-run"; fi
          if [ "$MODE" = "all-passing" ]; then
            if [ "$DECISION" != "approved" ]; then
              echo "::error::mode all-passing only approves; set decision to approved"
              exit 1
            fi
            if [ "$MEDIA" = "video" ]; then
              node scripts/media/approve-manifest.mjs "$MANIFEST" all-passing "$REVIEWER" data/queues/approve-video/precheck.json $DRY | tee apply.log
            else
              node scripts/media/approve-manifest.mjs "$MANIFEST" all-passing "$REVIEWER" data/queues/approve/precheck.json $DRY | tee apply.log
            fi
          else
            if [ -z "$(printf '%s' "$IDS" | tr -d ' ,\n')" ]; then
              echo "::error::mode per-ids needs the Drive file ids"
              exit 1
            fi
            node scripts/media/approve-manifest.mjs "$MANIFEST" "$DECISION" "$REVIEWER" "$IDS" $DRY | tee apply.log
          fi
          # Pull the applied count the script prints as APPLIED_COUNT=<n>.
          COUNT="$(grep -oE 'APPLIED_COUNT=[0-9]+' apply.log | tail -n1 | cut -d= -f2 || true)"
          echo "count=${COUNT:-0}" >> "$GITHUB_OUTPUT"
          {
            echo "### approve-media (${MODE}${DRY:+, dry run})"
            grep -E '^(would approve|approved|applied|not approved|not found|decision|all-passing)' apply.log | cut -c1-2000
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Commit the decision to main
        if: ${{ github.event.inputs.dry_run != 'true' }}
        env:
          DECISION: ${{ github.event.inputs.decision }}
          REVIEWER: ${{ github.event.inputs.reviewer }}
          COUNT: ${{ steps.apply.outputs.count }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [ ! -f "$MANIFEST" ]; then
            echo "no manifest to commit (nothing was applied)"
            exit 0
          fi
          git add "$MANIFEST"
          if git diff --cached --quiet; then
            echo "no manifest change to commit (no matching ids)"
          else
            git commit -m "media: ${DECISION} ${COUNT} files by ${REVIEWER}"
            git push origin HEAD:main
          fi
