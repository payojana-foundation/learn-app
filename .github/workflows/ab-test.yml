name: ab-test

# Job B v2 · listening test (3 Nov, audio + coordinator). NO R2 upload — GitHub
# artifacts only (retention 7 days).
#
# Parts 8, 11, 4. Each source is downloaded ONCE and its audio extracted; two FULL
# renders per part, ONE mp3 encode each, both via the approved B3 G loop (null
# passes of the limited chain, max 3, aim ±0.2, accept ±0.5, cap at depth 12 with a
# measured I_cap):
#   X = target −16 chain, then a pure volume gain AFTER the limiter. The gain comes
#       from a null-pass measurement of X's chain vs Y's chain in the clip window,
#       so X's clip I matches Y's within ±0.3 LU (verified on the clips).
#   Y = target −18 chain.
# Clips are cut with -c copy at identical timestamps from the full renders:
# loudest 90 s by short-term loudness, start ≥ 120 s, end ≤ duration − 120 s.
# Two rounds, each with its own random labels (R1-8a/R1-8b … R2-…). 12 clips.
# Every clip is asserted 44100 Hz, mono, 64 kbps.
#
# Artifacts: "clips" = the 12 clips ONLY; "keys-do-not-open" = label → X/Y per
# round. Auth: WIF (Drive read-only). Manual only.

on:
  workflow_dispatch:
    inputs:
      part8_id:
        description: "Part 8 drive_file_id"
        required: true
        default: "1-_BI-hRUEdHRfLIKdbjLiEfxxXiW2bV8"
      part11_id:
        description: "Part 11 drive_file_id"
        required: true
        default: "1-dV9SZKR35jWASCTy4Vg4KxD3qSBLllY"
      part4_id:
        description: "Part 4 drive_file_id"
        required: true
        default: "11UtCc2btipfdDjghsUjivEUP9SmPGsG_"

permissions:
  contents: read
  id-token: write

concurrency:
  group: ab-test
  cancel-in-progress: false

jobs:
  ab:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      PART8_ID: ${{ github.event.inputs.part8_id }}
      PART11_ID: ${{ github.event.inputs.part11_id }}
      PART4_ID: ${{ github.event.inputs.part4_id }}
    steps:
      - name: Check out the repo
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version

      - name: Install ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Authenticate to Google Cloud (Workload Identity Federation)
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/drive.readonly

      - name: Render, cut and assert the 12 clips (no R2)
        env:
          ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
          REFRESH_TOKEN_CMD: "gcloud auth print-access-token --scopes=https://www.googleapis.com/auth/drive.readonly"
        run: |
          set -uo pipefail
          chmod +x scripts/media/ab-clips.sh
          scripts/media/ab-clips.sh

      - name: Upload the 12 clips (only the clips)
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: clips
          path: clips/*.mp3
          retention-days: 7
          if-no-files-found: warn

      - name: Upload the label key (kept separate from the clips)
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: keys-do-not-open
          path: keys-do-not-open.json
          retention-days: 7
          if-no-files-found: warn
