name: ab-test

# Job B v2 · B6 — ONE-OFF blind listening test, run once before parts 2–15.
# Part 1 (drive_file_id): 6 clips — loudest 90 s + one pause ≥ 3 s × three
# versions (current / new B3 / B3 gained to ≈ -18) in a random A/B/C order.
# Part 4 (part4_id): 3 clips — loudest 90 s × three versions (B3 / forced -16 /
# -18) in a random x/y/z order. 9 clips total to course-media test/2026-11-02/
# with Cache-Control: no-store; the 9 URLs print in the summary; the A/B/C + P4
# order is written ONLY to a private artifact (never the summary).
#
# Versions: current (the file uploaded 2 Nov), chain B3, and chain B3 with a
# fixed gain down to the current file's I (≈ -18) so the listener judges the
# limiter not the volume.
#
# Cleanup is manual: the coordinator deletes test/ in the Cloudflare dashboard
# after the verdict. Workflows NEVER delete. Auth: WIF (no keys). Manual only.

on:
  workflow_dispatch:
    inputs:
      drive_file_id:
        description: "Pilot part-1 drive_file_id to A/B test"
        required: true
        default: "1EyF4VvMVm5RquR6dEUd-yn_pdznwxYtu"
      current_key:
        description: "Existing R2 key of the current (2 Nov) upload to compare against"
        required: true
        default: "audio/1EyF4VvMVm5RquR6dEUd-yn_pdznwxYtu-a64.mp3"
      part4_id:
        description: "Pilot part-4 drive_file_id (3 extra clips: B3 / forced -16 / -18)"
        required: true
        default: "11UtCc2btipfdDjghsUjivEUP9SmPGsG_"

permissions:
  contents: read
  id-token: write

concurrency:
  group: ab-test
  cancel-in-progress: false

jobs:
  ab:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      DRIVE_FILE_ID: ${{ github.event.inputs.drive_file_id }}
      CURRENT_KEY: ${{ github.event.inputs.current_key }}
      PART4_ID: ${{ github.event.inputs.part4_id }}
      DEST: test/2026-11-02
    steps:
      - name: Check out the repo
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version

      - name: Install ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Authenticate to Google Cloud (Workload Identity Federation)
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/drive

      - name: Set up rclone
        uses: AnimMouse/setup-rclone@v1

      - name: Configure rclone R2 remote (course-media token)
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
        run: |
          if [ -z "${R2_ACCOUNT_ID}" ]; then
            echo "::error title=R2_ACCOUNT_ID missing::Set the repository secret R2_ACCOUNT_ID."
            exit 1
          fi
          mkdir -p "$HOME/.config/rclone"
          cat > "$HOME/.config/rclone/rclone.conf" <<EOF
          [r2]
          type = s3
          provider = Cloudflare
          access_key_id = ${R2_ACCESS_KEY_ID}
          secret_access_key = ${R2_SECRET_ACCESS_KEY}
          endpoint = https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com
          no_check_bucket = true
          EOF
          echo "rclone remote r2 → bucket course-media, endpoint https://***${R2_ACCOUNT_ID: -4}.r2.cloudflarestorage.com"

      - name: Render + upload the A/B/C clips
        env:
          ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
          MEDIA_BASE_URL: https://media.84000.digital
        run: |
          set -uo pipefail
          chmod +x scripts/media/ab-clips.sh
          scripts/media/ab-clips.sh

      - name: Upload the private A/B/C order (artifact only, NOT the summary)
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: abc-order-private
          path: abc-order.json
          retention-days: 14
          if-no-files-found: warn
