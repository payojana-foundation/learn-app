name: auto-release

# PART 5 (coordinator decision 15 Nov) — after each approve-check / video-approve-check run,
# release every converted lesson that passed the pre-check: audio, and video (a video only
# when its lesson's audio is approved). Flagged, not-checked, re-converted and failed lessons
# stay held. Repo variable AUTO_APPROVE_PASSING: "true" = on; anything else = nothing
# automatic (the job is skipped). Video only when VIDEO_ENABLED is "true".
# Reviewer recorded: auto-release. Writes one summary line per run (step summary +
# data/ops/auto-release.log). After a release it starts master-export, which rebuilds the app data.

on:
  workflow_run:
    workflows: [approve-check, video-approve-check]
    types: [completed]
  workflow_dispatch: {}

permissions:
  contents: write
  actions: write # starts master-export (a GITHUB_TOKEN push does not trigger workflows)

concurrency:
  group: data-rebuild-main
  cancel-in-progress: false

jobs:
  release:
    if: ${{ vars.AUTO_APPROVE_PASSING == 'true' && (github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out main
        uses: actions/checkout@v5
        with:
          ref: main

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version

      - name: Approve every passing lesson (audio, then video) and push
        id: push
        env:
          VIDEO_ENABLED: ${{ vars.VIDEO_ENABLED }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          V=""
          if [ "${VIDEO_ENABLED:-}" = "true" ]; then V="--video"; fi
          FILES="data/media-manifest.json data/video-manifest.json data/ops/auto-release.log"
          # Rebase-proof (course-video-matrix appends to video-manifest.json all the time):
          # every attempt starts from origin/main's files and applies the release again.
          for attempt in 1 2 3 4 5 6 7 8; do
            git fetch -q origin main
            git reset -q origin/main
            for p in $FILES; do git checkout origin/main -- "$p" 2>/dev/null || true; done
            node scripts/media/auto-release.mjs $V | tee release.log
            a=$(grep -oE 'AUDIO_APPROVED=[0-9]+' release.log | cut -d= -f2)
            v=$(grep -oE 'VIDEO_APPROVED=[0-9]+' release.log | cut -d= -f2)
            if [ "$a" = "0" ] && [ "$v" = "0" ]; then
              echo "nothing new to release"
              exit 0
            fi
            mkdir -p data/ops
            head -n 1 release.log >> data/ops/auto-release.log
            for p in $FILES; do if [ -f "$p" ]; then git add "$p"; fi; done
            git commit -q -m "media: auto-release ${a} audio, ${v} video (passed the pre-check)"
            if git push origin HEAD:main; then
              echo "released=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "push rejected (attempt $attempt), starting again from origin/main"
            sleep $(( 3 + RANDOM % 7 ))
          done
          echo "::error title=Auto-release not saved::could not push after 8 attempts"
          exit 1
      - name: Rebuild the app data (master-export)
        if: ${{ steps.push.outputs.released == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run master-export.yml --ref main -R "$GITHUB_REPOSITORY"