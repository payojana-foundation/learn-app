name: lint-workflows

# Two guards in CI (Kiro cannot run either locally for the whole repo):
#   actionlint      — lints the workflow YAML when .github/** changes.
#   check-forbidden — fails if any tracked file reintroduces a retired
#                     name/domain (the list lives in scripts/check-forbidden.mjs);
#                     runs on every push so a content change anywhere is caught,
#                     not only .github/** edits.

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  actionlint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the repo
        uses: actions/checkout@v5

      - name: Run actionlint
        uses: raven-actions/actionlint@v2
        with:
          flags: "-color"

  check-forbidden:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the repo
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: ".node-version"

      - name: Forbidden-strings guard
        run: node scripts/check-forbidden.mjs
