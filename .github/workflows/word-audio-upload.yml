name: word-audio-upload

# Job A (media pipeline, P2). Uploads the word-audio batch 023 from Google
# Drive to Cloudflare R2, with a strict MD5 checksum gate (1366 files). Manual
# only; the coordinator runs it from the browser (Actions → Run workflow).
#
# Auth: Workload Identity Federation (no service-account keys). R2 via an rclone
# S3 remote built from repo secrets. Secrets never appear in logs.

on:
  workflow_dispatch:
    inputs:
      limit:
        description: "How many files to process (0 = all; 1 = a single file smoke test)"
        required: true
        default: "1"

permissions:
  contents: read
  id-token: write # required for Workload Identity Federation

concurrency:
  group: word-audio-upload
  cancel-in-progress: false

env:
  BATCH: "023"
  ZIP_NAME: word-audio_023_batch_2026-10-25_v6.zip
  EXPECTED_COUNT: "1366"
  R2_REMOTE: "r2:word-audio/023"

jobs:
  upload:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Check out the repo (for the pipeline scripts)
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version

      - name: Authenticate to Google Cloud (Workload Identity Federation)
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/drive

      - name: Set up rclone
        uses: AnimMouse/setup-rclone@v1

      - name: Configure rclone R2 remote (from secrets)
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ vars.R2_ENDPOINT }}
        run: |
          mkdir -p "$HOME/.config/rclone"
          cat > "$HOME/.config/rclone/rclone.conf" <<EOF
          [r2]
          type = s3
          provider = Cloudflare
          access_key_id = ${R2_ACCESS_KEY_ID}
          secret_access_key = ${R2_SECRET_ACCESS_KEY}
          endpoint = ${R2_ENDPOINT}
          no_check_bucket = true
          EOF

      - name: Download the batch zip from Drive
        env:
          DRIVE_FOLDER: ${{ vars.WORD_AUDIO_DRIVE_FOLDER }}
          ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
        run: |
          # rclone talks to Drive with the short-lived WIF access token (no key
          # on disk). Copy ONLY the named zip from the shared folder.
          rclone --drive-root-folder-id "$DRIVE_FOLDER" \
            --drive-token "{\"access_token\":\"${ACCESS_TOKEN}\",\"token_type\":\"Bearer\"}" \
            copy ":drive:/${ZIP_NAME}" ./incoming/

      - name: Unzip keeping UTF-8 NFC names
        run: |
          mkdir -p "${BATCH}"
          # -O UTF-8 keeps Khmer/Pāḷi file names in their stored NFC form.
          unzip -O UTF-8 "./incoming/${ZIP_NAME}" -d "${BATCH}"

      - name: Checksum local files against MD5SUMS (must be ${{ env.EXPECTED_COUNT }})
        run: |
          # rclone writes the real per-file result; the Node asserter enforces
          # the EXACT count and fails the job on any mismatch.
          # Double-quote the sed script so ${BATCH} expands (strips the "023/"
          # prefix rclone prints). With single quotes it was a literal
          # "${BATCH}/" and never matched — fixed in bulk-02 follow-up.
          rclone md5sum "${BATCH}" | sed "s#  ${BATCH}/#  #" > computed.txt
          node scripts/media/md5sum-to-json.mjs computed.txt > computed.json
          node scripts/media/verify-checksums.mjs "${BATCH}/MD5SUMS_${BATCH}.txt" computed.json "${EXPECTED_COUNT}"

      - name: With limit=1, keep only ONE file (single-file smoke test)
        if: ${{ github.event.inputs.limit == '1' }}
        run: |
          # Keep just the first file so every step runs end-to-end for ONE file.
          first=$(find "${BATCH}" -type f -name '*.mp3' | sort | head -n1)
          echo "limit=1 → uploading only: $first"
          mkdir -p one && cp "$first" "one/$(basename "$first")"
          echo "UPLOAD_DIR=one" >> "$GITHUB_ENV"

      - name: Set upload dir for a full run
        if: ${{ github.event.inputs.limit != '1' }}
        run: echo "UPLOAD_DIR=${BATCH}" >> "$GITHUB_ENV"

      - name: Copy to R2 (immutable, long cache, audio/mpeg) — copy, never sync
        run: |
          rclone copy "${UPLOAD_DIR}" "${R2_REMOTE}" \
            --immutable \
            --header-upload "Cache-Control: public, max-age=31536000, immutable" \
            --header-upload "Content-Type: audio/mpeg"

      - name: Checksum against R2 (full run must be ${{ env.EXPECTED_COUNT }})
        if: ${{ github.event.inputs.limit != '1' }}
        run: |
          rclone md5sum "${R2_REMOTE}" | sed 's#  023/##' > r2sums.txt
          node scripts/media/md5sum-to-json.mjs r2sums.txt > r2.json
          node scripts/media/verify-checksums.mjs "${BATCH}/MD5SUMS_${BATCH}.txt" r2.json "${EXPECTED_COUNT}"

      - name: curl the public URL (200, audio/mpeg, immutable cache)
        run: |
          # URL-encoded Khmer file name; the key is used exactly as stored.
          url="https://audio.84000.digital/023/023.001.001-%E1%9E%80%E1%9E%93%E1%9F%92%E1%9E%91%E1%9E%9A%E1%9E%80%E1%9F%84.mp3"
          echo "HEAD $url"
          headers=$(curl -sS -I "$url")
          echo "$headers"
          echo "$headers" | grep -i "^HTTP/.* 200" || { echo "not 200"; exit 1; }
          echo "$headers" | grep -i "content-type: audio/mpeg" || { echo "wrong content-type"; exit 1; }
          echo "$headers" | grep -i "cache-control: public, max-age=31536000, immutable" || { echo "wrong cache-control"; exit 1; }

      - name: Write the R2 listing + run log back to the Drive folder
        env:
          DRIVE_FOLDER: ${{ vars.WORD_AUDIO_DRIVE_FOLDER }}
          ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
        run: |
          rclone ls "${R2_REMOTE}" > "r2_listing_${BATCH}.txt" || true
          rclone --drive-root-folder-id "$DRIVE_FOLDER" \
            --drive-token "{\"access_token\":\"${ACCESS_TOKEN}\",\"token_type\":\"Bearer\"}" \
            copy "r2_listing_${BATCH}.txt" ":drive:/"
