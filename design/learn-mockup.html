ិធម្មបរិច្ឆេទទី៨ បច្ចយសង្គហ បដិច្ចសមុប្បាទទីបនី (ម៉ោងទី ១០២)បដិច្ចសមុប្បាទ វដ្តៈមាន៣ មូលមាន២","a"],[103,"ព្រះអភិធម្មបរិច្ឆេទទី៨ បច្ចយសង្គហ បដិច្ចសមុប្បាទទីបនី (ម៉ោងទី ១០៣)បដិច្ចសមុប្បាទ រៀនមើលតារាងរបស់បដិច្ចសមុប្បាទ","a"],[104,"ព្រះអភិធម្មបរិច្ឆេទទី៨ បច្ចយសង្គហ បដិច្ចសមុប្បាទទីបនី (ម៉ោងទី ១០៤)បដិច្ចសមុប្បាទ អវិជ្ជាមានលក្ខណៈ២៥ យ៉ាង","a"],[105,"ព្រះអភិធម្មបរិច្ឆេទទី៨ បច្ចយសង្គហ បដិច្ចសមុប្បាទទីបនី (ម៉ោងទី ១០៥)បដិច្ចសមុប្បាទ អវិជ្ជា ការមិនដឹងទុក្ខសច្ចៈ","a"],[106,"ព្រះអភិធម្មបរិច្ឆេទទី៨ បច្ចយសង្គហ បដិច្ចសមុប្បាទទីបនី (ម៉ោងទី ១០៦)អវិជ្ជាមិនដឹងទុក្ខសមុទយេ ទុក្ខនិរោធេ អញ្ញាណំ","a"],[107,"ព្រះអភិធម្មបរិច្ឆេទទី៨ បច្ចយសង្គហ បដិច្ចសមុប្បាទទីបនី (ម៉ោងទី ១០៧)បដិច្ចសមុប្បាទ អវិជ្ជាមិនដឹងនិរោធ មិនដឹងអរិយមគ្គ","a"],[108,"ព្រះអភិធម្មបរិច្ឆេទទី៨ បច្ចយសង្គហ បដិច្ចសមុប្បាទទីបនី (ម៉ោងទី ១០៨)បដិច្ចសមុប្បាទ សង្ខារ៦ជាផលរបស់អវិជ្ជា","a"],[109,"ព្រះអភិធម្មបរិច្ឆេទទី៨ បច្ចយសង្គហ បដិច្ចសមុប្បាទទីបនី (ម៉ោងទី ១០៩)ពន្យល់បុញ្ញាភិសង្ខារ និងអបុញ្ញាសង្ខារកើតពីអវិជ្ជា","a"],[110,"ព្រះអភិធម្មបរិច្ឆេទទី៨ បច្ចយសង្គហ បដិច្ចសមុប្បាទទីបនី (ម៉ោងទី ១១០)ពន្យល់អវិជ្ជាជាបច្ច័យដល់បុញ្ញាភិសង្ខារដោយបច្ច័យ២","a"],[111,"ព្រះអភិធម្មបរិច្ឆេទទី៨ បច្ចយសង្គហ បដិច្ចសមុប្បាទទីបនី (ម៉ោងទី ១១១)សង្ខារប្បច្ចយា វិញ្ញាណំ សង្ខារជាបច្ច័យដល់វិញ្ញាណ","a"],[112,"ព្រះអភិធម្មបរិច្ឆេទទី៨ បច្ចយសង្គហ បដិច្ចសមុប្បាទទីបនី (ម៉ោងទី ១១២)វិញ្ញាណជាផលរបស់សង្ខារមាន២ បដិសន្ធិកាល បវត្តិកាល","a"],[113,"ព្រះអភិធម្មបរិច្ឆេទទី៨ បច្ចយសង្គហ បដិច្ចសមុប្បាទទីបនី (ម៉ោងទី ១១៣/១៣៩)សង្ខារប្បច្ចយា វិញ្ញាណំ វិញ្ញាណជាផលរបស់សង្ខារបញ្ចប់","a"],[114,"ព្រះអភិធម្មបរិច្ឆេទទី៨ បច្ចយសង្គហ បដិច្ចសមុប្បាទទីបនី (ម៉ោងទី ១១៤/១៣៩)វិញ្ញាណប្បច្ចយា នាមរូបំ នាមរូបជាបច្ច័យដល់នាមរូប","a"],[115,"ព្រះអភិធម្មបរិច្ឆេទទី៨ បច្ចយសង្គហ បដិច្ចសមុប្បាទទីបនី (ម៉ោងទី ១១៥/១៣៩)នាមរូបប្បច្ចយា សឡាយតនំ អាយតនៈកើតព្រោះនាមរូបជាបច្ច័យ","a"],[116,"ព្រះអភិធម្មបរិច្ឆេទទី៨ បច្ចយសង្គហ បដិច្ចសមុប្បាទទីបនី (ម៉ោងទី ១១៦/១៣៩)នាមរូបប្បច្ចយា សឡាយនំ ចែកដោយបច្ច័យបញ្ចប់","a"],[117,"ព្រះអភិធម្មបរិច្ឆេទទី៨ បច្ចយសង្គហ បដិច្ចសមុប្បាទទីបនី (ម៉ោងទី ១១៧/១៣៩)សឡាយតនប្បច្ចយា ផស្សោ ផស្សកើតព្រោះសឡាយតនចប់","a"],[118,"ព្រះអភិធម្មបរិច្ឆេទទី៨ បច្ចយសង្គហ បដិច្ចសមុប្បាទទីបនី (ម៉ោងទី ១១៨/១៣៩)ផស្សប្បច្ចយា វេទនា វេទនាកើតពីផស្សជាបច្ច័យ","a"],[119,"ព្រះអភិធម្មបរិច្ឆេទទី៨ បច្ចយសង្គហ បដិច្ចសមុប្បាទទីបនី (ម៉ោងទី ១១៩/១៣៩)វេទនាបច្ចយា តណ្ហា តណ្ហាកើតមានវេទនាជាបច្ច័យ","a"],[120,"ព្រះអភិធម្មបរិច្ឆេទទី៨ បច្ចយសង្គហ បដិច្ចសមុប្បាទទីបនី (ម៉ោងទី ១២០/១៣៩)តណ្ហាបច្ចយា ឧបាទានំ ឧបាទានកើតព្រោះតណ្ហាជាបច្ច័យ","a"],[121,"ព្រះអភិធម្មបរិច្ឆេទទី៨ បច្ចយសង្គហ បដិច្ចសមុប្បាទទីបនី (ម៉ោងទី ១២១/១៣៩)តណ្ហាជាបច្ច័យដល់ទិដ្ឋុបាទាន ទិដ្ឋិ៦២","a"],[122,"ព្រះអភិធម្មបរិច្ឆេទទី៨ បច្ចយសង្គហ បដិច្ចសមុប្បាទទីបនី (ម៉ោងទី ១២២/១៣៩)តណ្ហាជាបច្ច័យដល់ទិដ្ឋុបាទាន អធិប្បាទទិដ្ឋិ៦២បញ្ចប់","a"],[123,"ព្រះអភិធម្មបរិច្ឆេទទី៨ បច្ចយសង្គហ បដិច្ចសមុប្បាទទីបនី (ម៉ោងទី ១២៣/១៣៩)តណ្ហាជាបច្ច័យដល់ទិដ្ឋុបាទាន សក្កាយទិដ្ឋិ២០","a"],[124,"ព្រះអភិធម្មបរិច្ឆេទទី៨ បច្ចយសង្គហ បដិច្ចសមុប្បាទទីបនី (ម៉ោងទី ១២៤/១៣៩)តណ្ហាជាបច្ច័យដល់ទិដ្ឋុបាទាន អត្តចែកជា២យ៉ាង","a"],[125,"ព្រះអភិធម្មបរិច្ឆេទទី៨ បច្ចយសង្គហ បដិច្ចសមុប្បាទទីបនី (ម៉ោងទី ១២៥/១៣៩)តណ្ហាជាបច្ច័យដល់សីលបាទុបាទាន អត្តវាទុបាទាន","a"],[126,"ព្រះអភិធម្មបរិច្ឆេទទី៨ បច្ចយសង្គហ បដិច្ចសមុប្បាទទីបនី (ម៉ោងទី ១២៦/១៣៩)ឧបាទានប្បច្ចយា ភវោ ភពកើតមានព្រោះឧបាទាន","a"],[127,"ព្រះអភិធម្មបរិច្ឆេទទី៨ បច្ចយសង្គហ បដិច្ចសមុប្បាទទីបនី (ម៉ោងទី ១២៧/១៣៩)ឧបាទានប្បច្ចយា ភវោ សង្រ្គោះដោយបច្ច័យចប់","a"],[128,"ព្រះអភិធម្មបរិច្ឆេទទី៨ បច្ចយសង្គហ បដិច្ចសមុប្បាទទីបនី (ម៉ោងទី ១២៨/១៣៩) ឧបាទានប្បច្ចយា ភវោ សង្គ្រោះបច្ច័យ២៤ចប់","a"],[129,"ព្រះអភិធម្មបរិច្ឆេទទី៨ បច្ចយសង្គហ បដិច្ចសមុប្បាទទីបនី (ម៉ោងទី ១២៩/១៣៩)ភវប្បច្ចយា ជាតិ ជាតិកើតមានព្រោះភពជាបច្ច័យ","a"],[130,"ព្រះអភិធម្មបរិច្ឆេទទី៨ បច្ចយសង្គហ បដិច្ចសមុប្បាទទីបនី (ម៉ោងទី ១៣០/១៣៩)ជាតិប្បច្ចយា ជរាមរណំ ជរានិងមរណំកើតព្រោះជាតិ","a"],[131,"ព្រះអភិធម្មបរិច្ឆេទទី៨ បច្ចយសង្គហ បដិច្ចសមុប្បាទទីបនី (ម៉ោងទី ១៣១/១៣៩)សោកបរិទេវទុក្ខទោមនស្សុបាយាសា សម្ភវន្តិ","a"],[132,"ព្រះអភិធម្មបរិច្ឆេទទី៨ បច្ចយសង្គហ បដិច្ចសមុប្បាទទីបនី (ម៉ោងទី ១៣២/១៣៩)បញ្ចប់អង្គបដិច្ចសមុប្បាទទាំង ១២","a"],[133,"ព្រះអភិធម្មបរិច្ឆេទទី៨ បច្ចយសង្គហ បដិច្ចសមុប្បាទទីបនី (ម៉ោងទី ១៣៣/១៣៩)ប្រៀបធៀបបដិច្ចសមុប្បាទអង្គ១២ ដូចមនុស្សខ្វាក់ជាដើម","a"],[134,"ព្រះអភិធម្មបរិច្ឆេទទី៨ បច្ចយសង្គហ បដិច្ចសមុប្បាទទីបនី (ម៉ោងទី ១៣៤/១៣៩)ការឈ្លាសក្នុងបដិច្ចសមុប្បាទរបស់ព្រះអានន្ទដោយហេតុ៤","a"],[135,"ព្រះអភិធម្មបរិច្ឆេទទី៨ បច្ចយសង្គហ បដិច្ចសមុប្បាទទីបនី (ម៉ោងទី ១៣៥/១៣៩)ចែកបដិច្ចសមុប្បាទជា២ សុត្តន្ត និងអភិធម្ម","a"],[136,"ព្រះអភិធម្មបរិច្ឆេទទី៨ បច្ចយសង្គហ បដិច្ចសមុប្បាទទីបនី (ម៉ោងទី ១៣៦/១៣៩)ចែកបដិច្ចសមុប្បាទជាអភិធម្មភាជនីយ​ន័យកុសលបទ","a"],[137,"ព្រះអភិធម្មបរិច្ឆេទទី៨ បច្ចយសង្គហ បដិច្ចសមុប្បាទទីបនី (ម៉ោងទី ១៣៧/១៣៩)ចែកបដិច្ចសមុប្បាទជាអភិធម្មភាជនីយ​ន័យអព្យាកត","a"],[138,"ព្រះអភិធម្មបរិច្ឆេទទី៨ បច្ចយសង្គហ បដិច្ចសមុប្បាទទីបនី (ម៉ោងទី ១៣៨/១៣៩)ចែកបដិច្ចសមុប្បាទជាអភិធម្មភាជនីយ៦ និទ្ទេស","a"],[139,"ព្រះអភិធម្មបរិច្ឆេទទី៨ បច្ចយសង្គហ បដិច្ចសមុប្បាទទីបនី (ម៉ោងទី ១៣៩/១៣៩)ចែកបញ្ញត្តិផ្សេងបញ្ចប់បរិច្ឆេទទី៨","a"]]},{"i":64,"t":"yon-yi","km":"ព្រះអភិធម្មបរិច្ឆេទទី7 (2023)","en":"Abhidhamma Chapter 7 (2023)","tp":["abhidhamma"],"L":[[1,"ព្រះអភិធម្មបរិច្ឆេទទី៧ សមុច្ចយសង្គហវិភាគ(ម៉ោងទី ០១/១១៩) អាសវៈ ៤ យ៉ាងថ្ងៃផ្តើមដំបូង","a"],[2,"ព្រះអភិធម្មបរិច្ឆេទទី៧ សមុច្ចយសង្គហវិភាគ(ម៉ោងទី ០២/១១៩) អង្គធម៌របស់អាសវៈ ៤ យ៉ាង","a"],[3,"ព្រះអភិធម្មបរិច្ឆេទទី៧ សមុច្ចយសង្គហវិភាគ(ម៉ោងទី ០៣/១១៩) ឱឃៈ ៤ យោគៈ ៤","a"],[4,"ព្រះអភិធម្មបរិច្ឆេទទី៧ សមុច្ចយសង្គហវិភាគ(ម៉ោងទី ០៤/១១៩) គន្ថៈមាន ៤ យ៉ាង","a"],[5,"ព្រះអភិធម្មបរិច្ឆេទទី៧ សមុច្ចយសង្គហវិភាគ(ម៉ោងទី ០៥/១១៩) ឧបាទាន (ការប្រកាន់មាំ) មាន ៤ យ៉ាង","a"],[6,"ព្រះអភិធម្មបរិច្ឆេទទី៧ សមុច្ចយសង្គហវិភាគ(ម៉ោងទី ០៦/១១៩) នីវរណៈ (គ្រឿងរារាំ)មាន ៦ យ៉ាង","a"],[7,"ព្រះអភិធម្មបរិច្ឆេទទី៧ សមុច្ចយសង្គហវិភាគ(ម៉ោងទី ០៧/១១៩) អនុសយមាន ៧ ប្រការ","a"],[8,"ព្រះអភិធម្មបរិច្ឆេទទី៧ សមុច្ចយសង្គហវិភាគ(ម៉ោងទី ០៨/១១៩) ពន្យល់អនុស័យ ៧ បន្ត","a"],[9,"ព្រះអភិធម្មបរិច្ឆេទទី៧ សមុច្ចយសង្គហវិភាគ(ម៉ោងទី ០៩/១១៩) ការលះកិលេស ៣ កម្រិត","a"],[10,"ព្រះអភិធម្មបរិច្ឆេទទី៧ សមុច្ចយសង្គហវិភាគ(ម៉ោងទី ១០/១១៩) សញ្ញោជនៈមាន ១០ ប្រការ","a"],[11,"ព្រះអភិធម្មបរិច្ឆេទទី៧ សមុច្ចយសង្គហវិភាគ(ម៉ោងទី ១១/១១៩) សំយោជនៈ១០ កើតក្នុងរូបារម្មណ៍","a"],[12,"ព្រះអភិធម្មបរិច្ឆេទទី៧ សមុច្ចយសង្គហវិភាគ(ម៉ោងទី ១២/១១៩) ការលះបង់សំយោជនៈ ១០ យ៉ាង","a"],[13,"ព្រះអភិធម្មបរិច្ឆេទទី៧ សមុច្ចយសង្គហវិភាគ(ម៉ោងទី ១៣/១១៩) កិលេស (គ្រឿងសៅហ្មង) ១០ យ៉ាង","a"],[14,"ព្រះអភិធម្មបរិច្ឆេទទី៧ សមុច្ចយសង្គហវិភាគ(ម៉ោងទី ១៤/១១៩) មិស្សកសង្គហៈហេតុ ៦","a"],[15,"ព្រះអភិធម្មបរិច្ឆេទទី៧ សមុច្ចយសង្គហវិភាគ(ម៉ោងទី ១៥/១១៩) មិស្សកសង្គហៈ ឈានង្គៈ អង្គឈាន ៧","a"],[16,"ព្រះអភិធម្មបរិច្ឆេទទី៧ សមុច្ចយសង្គហវិភាគ(ម៉ោងទី ១៦/១១៩) ឈានង្គៈ អង្គឈាន៧ លះបដិបក្ខធម៌","a"],[17,"ព្រះអភិធម្មបរិច្ឆេទទី៧ សមុច្ចយសង្គហវិភាគ(ម៉ោងទី ១៧/១១៩) មគ្គង្គ សម្មាទិដ្ឋិ ការយល់ត្រូវ","a"],[18,"ព្រះអភិធម្មបរិច្ឆេទទី៧ សមុច្ចយសង្គហវិភាគ(ម៉ោងទី ១៨/១១៩) មគ្គង្គ សម្មាទិដ្ឋិរបស់បុគ្គល ៣ ប្រភេទ","a"],[19,"ព្រះអភិធម្មបរិច្ឆេទទី៧ សមុច្ចយសង្គហវិភាគ(ម៉ោងទី ១៩/១១៩) មគ្គង្គ បញ្ហាផ្សេងៗជុំវិញសម្មាទិដ្ឋិ","a"],[20,"ព្រះអភិធម្មបរិច្ឆេទទី៧ សមុច្ចយសង្គហវិភាគ(ម៉ោងទី ២០/១១៩) សម្មាសង្កប្ប សម្មាវាចា សម្មាកម្មន្ត សម្មាអាជីវ","a"],[21,"ព្រះអភិធម្មបរិច្ឆេទទី៧ សមុច្ចយសង្គហវិភាគ(ម៉ោងទី ២១/១១៩) មគ្គង្គ សម្មាវាយាម សម្មាសតិ សម្មាសមាធិ","a"],[22,"ព្រះអភិធម្មបរិច្ឆេទទី៧ សមុច្ចយសង្គហវិភាគ(ម៉ោងទី ២២/១១៩) មិច្ឆាទិដ្ឋិ មិច្ឆាសង្កប្ប មិច្ឆាវាយាម មិច្ឆាសមាធិ","a"],[23,"ព្រះអភិធម្មបរិច្ឆេទទី៧ សមុច្ចយសង្គហវិភាគ(ម៉ោងទី ២៣/១១៩) បញ្ចប់មគ្គង្គ ចូលនិយមន័យឥន្រ្ទិយ","a"],[24,"ព្រះអភិធម្មបរិច្ឆេទទី៧ សមុច្ចយសង្គហវិភាគ(ម៉ោងទី ២៤/១១៩) អំពីឥន្រ្ទិយ ២២ ភាគ២ និងបញ្ញត្តិ៦ យ៉ាង","a"],[25,"ព្រះអភិធម្មបរិច្ឆេទទី៧ សមុច្ចយសង្គហវិភាគ(ម៉ោងទី ២៥/១១៩) អធិប្បាយចក្ខុន្រ្ទិយដល់សោមនស្សិន្រ្ទិយ","a"],[26,"ព្រះអភិធម្មបរិច្ឆេទទី៧ សមុច្ចយសង្គហវិភាគ(ម៉ោងទី ២៦/១១៩) អធិប្បាយទោមនិស្សិន្ទ្រិយដល់វីរិយិន្រ្ទិយ","a"],[27,"ព្រះអភិធម្មបរិច្ឆេទទី៧ សមុច្ចយសង្គហវិភាគ(ម៉ោងទី ២៧/១១៩) អធិប្បាយសតិន្រ្ទិយ ដល់អនញ្ញត្តញ្ញស្សាមីតិន្រ្ទិយ","a"],[28,"ព្រះអភិធម្មបរិច្ឆេទទី៧ សមុច្ចយសង្គហវិភាគ(ម៉ោងទី ២៨/១១៩) ចែកឥន្រ្ទិយ២២ ដោយភូមិ និងកុសលតិកៈ","a"],[29,"ព្រះអភិធម្មបរិច្ឆេទទី៧ សមុច្ចយសង្គហវិភាគ(ម៉ោងទី ២៩/១១៩) ចែកឥន្រ្ទិយ២២ ដោយនាមរូប ដល់អាយតន","a"],[30,"ព្រះអភិធម្មបរិច្ឆេទទី៧ សមុច្ចយសង្គហវិភាគ(ម៉ោងទី ៣០/១១៩) ឥន្រ្ទិយ២២ ដោយធាតុដល់កំណើត៤","a"],[31,"ព្រះអភិធម្មបរិច្ឆេទទី៧ សមុច្ចយសង្គហវិភាគ(ម៉ោងទី ៣១/១១៩) ចែកឥន្រ្ទិយ២២ បដិសន្ធក្នុងព្រហ្មលោក","a"],[32,"ព្រះអភិធម្មបរិច្ឆេទទី៧ សមុច្ចយសង្គហវិភាគ(ម៉ោងទី ៣២/១១៩) ពលៈ ៩ យ៉ាង សទ្ធាពល វីរិយពលៈ","a"],[33,"ព្រះអភិធម្មបរិច្ឆេទទី៧ សមុច្ចយសង្គហវិភាគ(ម៉ោងទី ៣៣/១១៩) ពលៈ ៩ យ៉ាង សតិពលៈ សមាធិពលៈ","a"],[34,"ព្រះអភិធម្មបរិច្ឆេទទី៧ សមុច្ចយសង្គហវិភាគ(ម៉ោងទី ៣៤/១១៩) ពលៈ ៩ យ៉ាងបញ្ចប់ និងនិយមន័យអធិបតី","a"],[35,"ព្រះអភិធម្មបរិច្ឆេទទី៧ សមុច្ចយសង្គហវិភាគ(ម៉ោងទី ៣៥/១១៩) អធិបតី ភាពជាធំមាន ៤ យ៉ាង","a"],[36,"ព្រះអភិធម្មបរិច្ឆេទទី៧ សមុច្ចយសង្គហវិភាគ(ម៉ោងទី ៣៦/១១៩) បញ្ចប់អធិបតី ៤ ចូលនិយមន័យអាហារ","a"],[37,"ព្រះអភិធម្មបរិច្ឆេទទី៧ សមុច្ចយសង្គហវិភាគ(ម៉ោងទី ៣៧/១១៩) ពន្យល់កពឡិង្កាហារ បានដល់បាយទឹកជាដើម","a"],[38,"ព្រះអភិធម្មបរិច្ឆេទទី៧ សមុច្ចយសង្គហវិភាគ(ម៉ោងទី ៣៨/១១៩) ពន្យល់អាហារភ័យគឺជាភ័យ","a"],[39,"ព្រះអភិធម្មបរិច្ឆេទទី៧ សមុច្ចយសង្គហវិភាគ(ម៉ោងទី ៣៩/១១៩) ភ័យក្នុងអាហារ៤ ប្រៀបដូចពុកម្តាយស៊ីសាច់កូន","a"],[40,"ព្រះអភិធម្មបរិច្ឆេទទី៧ សមុច្ចយសង្គហវិភាគ(ម៉ោងទី ៤០/១១៩) តើអាហារ៤ មានអ្វីជាបច្ច័យ","a"],[41,"ព្រះអភិធម្មបរិច្ឆេទទី៧ សមុច្ចយសង្គហវិភាគ(ម៉ោងទី ៤១/១១៩) ពាក្យថា ពោធិបក្ខិយធម៌ មាន ៣៧ ប្រការ","a"],[42,"ព្រះអភិធម្មបរិច្ឆេទទី៧ សមុច្ចយសង្គហវិភាគ(ម៉ោងទី ៤២/១១៩) ពោធិបក្ខិយធម៌ ពាក្យថា សតិប្បដ្ឋាន","a"],[43,"ព្រះអភិធម្មបរិច្ឆេទទី៧ សមុច្ចយសង្គហវិភាគ(ម៉ោងទី ៤៣/១១៩) ហេតុអ្វីព្រះអង្គសម្តែងធម៌នៅដែនកុរុ","a"],[44,"ព្រះអភិធម្មបរិច្ឆេទទី៧ សមុច្ចយសង្គហវិភាគ(ម៉ោងទី ៤៤/១១៩) ពន្យល់ថា ឯកាយនមគ្គោ ផ្លូវមូលតែមួយដូចម្តេច","a"],[45,"ព្រះអភិធម្មបរិច្ឆេទទី៧ សមុច្ចយសង្គហវិភាគ(ម៉ោងទី ៤៥/១១៩) សតិប្បដ្ឋានដើម្បីកម្ចាត់សេចក្តីសោក និងខ្សឹកខ្សួល","a"],[46,"ព្រះអភិធម្មបរិច្ឆេទទី៧ សមុច្ចយសង្គហវិភាគ(ម៉ោងទី ៤៦/១១៩) សតិប្បដ្ឋានដើម្បីរំងាប់ទុក្ខនិងទោមនស្ស","a"],[47,"ព្រះអភិធម្មបរិច្ឆេទទី៧ សមុច្ចយសង្គហវិភាគ(ម៉ោងទី ៤៧/១១៩) សតិប្បដ្ឋាន ព្រោះហេតុ ៣ យ៉ាង","a"],[48,"ព្រះអភិធម្មបរិច្ឆេទទី៧ សមុច្ចយសង្គហវិភាគ(ម៉ោងទី ៤៨/១១៩) សតិប្បដ្ឋាន មានត្រឹមតែ៤ ព្រោះហេតុអ្វី","a"],[49,"ព្រះអភិធម្មបរិច្ឆេទទី៧ សមុច្ចយសង្គហវិភាគ(ម៉ោងទី ៤៩/១១៩) សតិប្បដ្ឋាន ពន្យល់ថា","a"],[50,"ព្រះអភិធម្មបរិច្ឆេទទី៧ សមុច្ចយសង្គហវិភាគ(ម៉ោងទី ៥០/១១៩) សតិប្បដ្ឋាន កាយេ កាយានុបស្សី វិហរតិ","a"],[51,"ព្រះអភិធម្មបរិច្ឆេទទី៧ សមុច្ចយសង្គហវិភាគ(ម៉ោងទី ៥១/១១៩) សតិប្បដ្ឋាន អាតាបី សម្បជានោ សតិមា","a"],[52,"ព្រះអភិធម្មបរិច្ឆេទទី៧ សមុច្ចយសង្គហវិភាគ(ម៉ោងទី ៥២/១១៩) សតិប្បដ្ឋាន ពាក្យថា អានាបានបព្វ","a"],[53,"ព្រះអភិធម្មបរិច្ឆេទទី៧ សមុច្ចយសង្គហវិភាគ(ម៉ោងទី ៥៣/១១៩) អានាបានបព្វៈ និមិត្តរបស់អានាបានគឺអ្វី","a"],[54,"ព្រះអភិធម្មបរិច្ឆេទទី៧ សមុច្ចយសង្គហវិភាគ(ម៉ោងទី ៥៤/១១៩) អានាបានបព្វៈ ការកំណត់ខ្យល់ដង្ហើមនឹងសម្រេចអរហត្ត","a"],[55,"ព្រះអភិធម្មបរិច្ឆេទទី៧ សមុច្ចយសង្គហវិភាគ(ម៉ោងទី ៥៥/១១៩) អានាបានបព្វៈ កំណត់ខ្យល់វេទនា ចិត្ត ធម៌ អរហត្ត","a"],[56,"ព្រះអភិធម្មបរិច្ឆេទទី៧ សមុច្ចយសង្គហវិភាគ(ម៉ោងទី ៥៦/១១៩) ឥរិយាបថបព្វៈ ការពិចារណាឥរិយាបថទាំង ៤","a"],[57,"ព្រះអភិធម្មបរិច្ឆេទទី៧ សមុច្ចយសង្គហវិភាគ(ម៉ោងទី ៥៧/១១៩) សម្បជញ្ញបព្វៈ ការដឹងខ្លួនគ្រប់ឥរិយាបថទាំង ៤","a"],[58,"ព្រះអភិធម្មបរិច្ឆេទទី៧ សមុច្ចយសង្គហវិភាគ(ម៉ោងទី ៥៨/១១៩) សម្បជញ្ញបព្វៈ សប្បាយសម្បជញ្ញ គោចរសម្បជញ្ញ","a"],[59,"ព្រះអភិធម្មបរិច្ឆេទទី៧ សមុច្ចយសង្គហវិភាគ(ម៉ោងទី ៥៩/១១៩) សម្បជញ្ញបព្វៈ អសម្មោហសម្បជញ្ញ ការមិនវង្វេង","a"],[60,"ព្រះអភិធម្មបរិច្ឆេទទី៧ សមុច្ចយសង្គហវិភាគ(ម៉ោងទី ៦០/១១៩) សម្បជញ្ញបព្វៈ អសម្មោហសម្បជញ្ញ ការមិនវង្វេងភាគបញ្ចប់","a"],[61,"ព្រះអភិធម្មបរិច្ឆេទទី៧ សមុច្ចយសង្គហវិភាគ(ម៉ោងទី ៦១/១១៩) ពន្យល់អសម្មោហសម្បជញ្ញៈ ក្នុងការប្រើចីវរជាដើម","a"],[62,"ព្រះអភិធម្មបរិច្ឆេទទី៧ សមុច្ចយសង្គហវិភាគ(ម៉ោងទី ៦២/១១៩) បដិកូលមនសិការបព្វៈ ពិចារណាអាការៈ៣២ជាបដិកូល","a"],[63,"ព្រះអភិធម្មបរិច្ឆេទទី៧ សមុច្ចយសង្គហវិភាគ(ម៉ោងទី ៦៣/១១៩) បដិកូលមនសិការបព្វៈ ឧគ្គហកោសល្យ ៧ ប្រការ","a"],[64,"ព្រះអភិធម្មបរិច្ឆេទទី៧ សមុច្ចយសង្គហវិភាគ(ម៉ោងទី ៦៤/១១៩) បដិកូលមនសិការបព្វៈ មនសិការកោសល្យ ១០ យ៉ាង","a"],[65,"ព្រះអភិធម្មបរិច្ឆេទទី៧ សមុច្ចយសង្គហវិភាគ(ម៉ោងទី ៦៥/១១៩) បដិកូលមនសិការបព្វៈ អធិចិត្តសូត្រ សតីភាវសូត្រ","a"],[66,"ព្រះអភិធម្មបរិច្ឆេទទី៧ សមុច្ចយសង្គហវិភាគ(ម៉ោងទី ៦៦/១១៩) បដិកូលមនសិការបព្វៈ អធិប្បាយឧគ្គហកោសល្សតាមមហាដីកាចារ្យ","a"],[67,"ព្រះអភិធម្មបរិច្ឆេទទី៧ សមុច្ចយសង្គហវិភាគ(ម៉ោងទី ៦៧/១១៩) បដិកូលមនសិការបព្វៈ កាយគតាសតិតាមហាដីកា","a"],[68,"ព្រះអភិធម្មបរិច្ឆេទទី៧ សមុច្ចយសង្គហវិភាគ(ម៉ោងទី ៦៨/១១៩) បដិកូលមនសិការបព្វៈ អធិប្បាយសក់ រោម ក្រចក ធ្មេញ ស្បែក","a"],[69,"ព្រះអភិធម្មបរិច្ឆេទទី៧ សមុច្ចយសង្គហវិភាគ(ម៉ោងទី ៦៩/១១៩) បដិកូលមនសិការបព្វៈ អធិប្បាយសាច់ សសៃ ឆ្អឹង","a"],[70,"ព្រះអភិធម្មបរិច្ឆេទទី៧ សមុច្ចយសង្គហវិភាគ(ម៉ោងទី ៧០/១១៩) បដិកូលមនសិការបព្វៈ អធិប្បាយវក្កបញ្ចក មត្ថលុង្គបញ្ចក","a"],[71,"ព្រះអភិធម្មបរិច្ឆេទទី៧ សមុច្ចយសង្គហវិភាគ(ម៉ោងទី ៧១/១១៩) បដិកូលមនសិការបព្វៈ អធិប្បាយកោដ្ឋាសក្នុងអាបោធាតុ","a"],[72,"ព្រះអភិធម្មបរិច្ឆេទទី៧ សមុច្ចយសង្គហវិភាគ(ម៉ោងទី ៧២/១១៩) ធាតុមនសិការបព្វ នវសីវថិកាបព្វ","a"],[73,"ព្រះអភិធម្មបរិច្ឆេទទី៧ សមុច្ចយសង្គហវិភាគ(ម៉ោងទី ៧៣/១១៩) វេទនានុបស្សនាសតិប្បដ្ឋាន ការកំណត់វេទនា","a"],[74,"ព្រះអភិធម្មបរិច្ឆេទទី៧ សមុច្ចយសង្គហវិភាគ(ម៉ោងទី ៧៤/១១៩) វេទនានុបស្សនាសតិប្បដ្ឋាន សាមិសសុខវេទនា","a"],[75,"ព្រះអភិធម្មបរិច្ឆេទទី៧ សមុច្ចយសង្គហវិភាគ(ម៉ោងទី ៧៥/១១៩) សាមិសសុខវេទនា និរាមិសសុខ សាមិសទុក្ខ និរាមិសទុក្ខ","a"],[76,"ព្រះអភិធម្មបរិច្ឆេទទី៧ សមុច្ចយសង្គហវិភាគ(ម៉ោងទី ៧៦/១១៩) ចិត្តានុបស្សនា ចិត្តប្រកបដោយរាគៈ ចិត្តប្រាសចាករាគៈ","a"],[77,"ព្រះអភិធម្មបរិច្ឆេទទី៧ សមុច្ចយសង្គហវិភាគ(ម៉ោងទី ៧៧/១១៩) ចិត្តានុបស្សនា ចិត្តប្រកបទោស មោហៈដល់អនុត្តរចិត្ត","a"],[78,"ព្រះអភិធម្មបរិច្ឆេទទី៧ សមុច្ចយសង្គហវិភាគ(ម៉ោងទី ៧៨/១១៩) ធម្មានុបស្សនាសតិប្បដ្ឋាន នីវរណបព្វៈ ការកំណត់នាមរូប","a"],[79,"ព្រះអភិធម្មបរិច្ឆេទទី៧ សមុច្ចយសង្គហវិភាគ(ម៉ោងទី ៧៩/១១៩) នីវរណបព្វៈ កាមឆន្ទ ព្យាបាទនីវរណៈ","a"],[80,"ព្រះអភិធម្មបរិច្ឆេទទី៧ សមុច្ចយសង្គហវិភាគ(ម៉ោងទី ៨០/១១៩) នីវរណបព្វៈ ថីនមិទ្ធនីវរណ ឧទ្ធច្ចកុក្កុច្ចនីវរណៈ","a"],[81,"ព្រះអភិធម្មបរិច្ឆេទទី៧ សមុច្ចយសង្គហវិភាគ(ម៉ោងទី ៨១/១១៩) ធម្មានុបស្សនា នីវរណបព្វៈ វិចិកិច្ឆានីវរណ សេចក្តីសង្ស័យ","a"],[82,"ព្រះអភិធម្មបរិច្ឆេទទី៧ សមុច្ចយសង្គហវិភាគ(ម៉ោងទី ៨២/១១៩) ធម្មានុបស្សនា ខន្ធបព្វៈ កំណត់ដឹងបញ្ចក្ខន្ធ","a"],[83,"ព្រះអភិធម្មបរិច្ឆេទទី៧ សមុច្ចយសង្គហវិភាគ(ម៉ោងទី ៨៣/១១៩) ធម្មានុបស្សនា ខន្ធបព្វៈ វិនិច្ឆ័យដោយខន្ធ ៦ ប្រការ","a"],[84,"ព្រះអភិធម្មបរិច្ឆេទទី៧ សមុច្ចយសង្គហវិភាគ(ម៉ោងទី ៨៤/១១៩) ធម្មានុបស្សនា ខន្ធបព្វៈ ហេតុអ្វីខន្ធមានតែ ៥ មិនលើស មិនខ្វះ","a"],[85,"ព្រះអភិធម្មបរិច្ឆេទទី៧ សមុច្ចយសង្គហវិភាគ(ម៉ោងទី ៨៥/១១៩) ធម្មានុបស្សនា ខន្ធបព្វៈ ឧបមាខន្ធ ៥ ជាជំងឺ និងអ្នកជំងឺ","a"],[86,"ព្រះអភិធម្មបរិច្ឆេទទី៧ សមុច្ចយសង្គហវិភាគ(ម៉ោងទី ៨៦/១១៩) ធម្មានុបស្សនា ខន្ធបព្វៈ ពន្យល់ខន្ធដោយអាការ២","a"],[87,"ព្រះអភិធម្មបរិច្ឆេទទី៧ សមុច្ចយសង្គហវិភាគ(ម៉ោងទី ៨៧/១១៩) ធម្មានុបស្សនា ខន្ធបព្វៈ ពន្យល់៥ ជាបន្តតាមមហាដីកា","a"],[88,"ព្រះអភិធម្មបរិច្ឆេទទី៧ សមុច្ចយសង្គហវិភាគ(ម៉ោងទី ៨៨/១១៩) ធម្មានុបស្សនា ខន្ធបព្វៈ ពន្យល់ឧបមាខន្ធ៥ ដូចពពុះទឹកជាដើម","a"],[89,"ព្រះអភិធម្មបរិច្ឆេទទី៧ សមុច្ចយសង្គហវិភាគ(ម៉ោងទី ៨៩/១១៩) អាយតនបព្វៈ អត្ថន័យអាយតនៈមាន ៥ ន័យ","a"],[90,"ព្រះអភិធម្មបរិច្ឆេទទី៧ សមុច្ចយសង្គហវិភាគ(ម៉ោងទី ៩០/១១៩) បញ្ចប់អាយតនៈ ចូលពោជ្ឈង្គបព្វ សតិសម្ពោជ្ឈង្គៈ","a"],[91,"ព្រះអភិធម្មបរិច្ឆេទទី៧ សមុច្ចយសង្គហវិភាគ(ម៉ោងទី ៩១/១១៩) ពោជ្ឈង្គបព្វៈ ធម្មវិចយសម្ពជ្ឈង្គ ការពិចារណាធម៌","a"],[92,"ព្រះអភិធម្មបរិច្ឆេទទី៧ សមុច្ចយសង្គហវិភាគ(ម៉ោងទី ៩២/១១៩) ពោជ្ឈង្គបព្វៈ វីរិយសម្ពោជ្ឈង្គៈ និងធម៌នាំឱ្យកើតវីរិយៈ","a"],[93,"ព្រះអភិធម្មបរិច្ឆេទទី៧ សមុច្ចយសង្គហវិភាគ(ម៉ោងទី ៩៣/១១៩) ពោជ្ឈង្គបព្វៈ បីតិ បស្សទ្ធិ សមាធិ ឧបេក្ខាសម្ពោជ្ឈង្គៈ","a"],[94,"ព្រះអភិធម្មបរិច្ឆេទទី៧ សមុច្ចយសង្គហវិភាគ(ម៉ោងទី ៩៤/១១៩) សច្ចបព្វៈ អធិប្បាយមាតិកានៃអរិយសច្ចៈ ៤","a"],[95,"ព្រះអភិធម្មបរិច្ឆេទទី៧ សមុច្ចយសង្គហវិភាគ(ម៉ោងទី ៩៥/១១៩) សច្ចបព្វៈ ហេតុអ្វីអរិយសច្ចៈ មានត្រឹមតែ៤","a"],[96,"ព្រះអភិធម្មបរិច្ឆេទទី៧ សមុច្ចយសង្គហវិភាគ(ម៉ោងទី ៩៦/១១៩) ទុក្ខសច្ចៈ ជាតិទុក្ខ ជរាទុក្ខ មរណទុក្ខតាមវិសុទ្ធិមគ្គ","a"],[97,"ព្រះអភិធម្មបរិច្ឆេទទី៧ សមុច្ចយសង្គហវិភាគ(ម៉ោងទី ៩៧/១១៩) សច្ចបព្វៈ សោក បរិទេវ ទុក្ខទុក្ខ ឧបាយាស អប្បិយសម្បយោគទុក្ខ","a"],[98,"ព្រះអភិធម្មបរិច្ឆេទទី៧ សមុច្ចយសង្គហវិភាគ(ម៉ោងទី ៩៨/១១៩) ទុក្ខសច្ចៈ បិយសម្បយោទុក្ខ អប្បិយទុក្ខ ឥច្ឆិតាលាភទុក្ខ","a"],[99,"ព្រះអភិធម្មបរិច្ឆេទទី៧ សមុច្ចយសង្គហវិភាគ(ម៉ោងទី ៩៩/១១៩) សមុទយសច្ចៈ តណ្ហា ៣ និរោធសច្ចៈ ព្រះនិព្វាន","a"],[100,"ព្រះអភិធម្មបរិច្ឆេទទី៧ សមុច្ចយសង្គហវិភាគ(ម៉ោងទី ១០០/១១៩) មគ្គសច្ចៈ ផ្លូវទៅកាន់ព្រះនិព្វាន សម្មាទិដ្ឋិ សម្មាសង្កប្បៈ","a"],[101,"ព្រះអភិធម្មបរិច្ឆេទទី៧ សមុច្ចយសង្គហវិភាគ(ម៉ោងទី ១០១/១១៩) មគ្គសច្ចៈ សម្មាវាចា សម្មាកម្មន្ត សម្មាអាជីវ សម្មាវាយាម","a"],[102,"ព្រះអភិធម្មបរិច្ឆេទទី៧ សមុច្ចយសង្គហវិភាគ(ម៉ោងទី ១០២/១១៩) មគ្គសច្ចៈ សម្មាវាយាម ព្យាយាមត្រូវ សម្មាសតិ រលឹកត្រូវ","a"],[103,"ព្រះអភិធម្មបរិច្ឆេទទី៧ សមុច្ចយសង្គហវិភាគ(ម៉ោងទី ១០៣/១១៩) សម្មាសមាធិ ការតម្កល់ចិត្តនឹងត្រូវបញ្ចប់សតិប្បដ្ឋាន ៤","a"],[104,"ព្រះអភិធម្មបរិច្ឆេទទី៧ សមុច្ចយសង្គហវិភាគ(ម៉ោងទី ១០៤/១១៩) សម្មប្បធាន ៤","a"],[105,"ព្រះអភិធម្មបរិច្ឆេទទី៧ សមុច្ចយសង្គហវិភាគ(ម៉ោងទី ១០៥/១១៩) ឥទ្ធិបាទធម៌ ៤ យ៉ាង មានឆន្ទិទ្ធិបាទជាដើម","a"],[106,"ព្រះអភិធម្មបរិច្ឆេទទី៧ សមុច្ចយសង្គហវិភាគ(ម៉ោងទី ១០៦/១១៩) ឥន្រ្ទិយ ៥ យ៉ាងមានសទ្ធិន្រ្ទិយជាដើម","a"],[107,"ព្រះអភិធម្មបរិច្ឆេទទី៧ សមុច្ចយសង្គហវិភាគ(ម៉ោងទី ១០៧/១១៩) ពោធិបក្ខិយ ពលៈ ៥ និងពោជ្ឈង្គ ៧ ប្រការ","a"],[108,"ព្រះអភិធម្មបរិច្ឆេទទី៧ សមុច្ចយសង្គហវិភាគ(ម៉ោងទី ១០៨/១១៩)មគ្គង្គ សម្មាទិដ្ឋិ និងសម្មាសង្កប្បៈភិក្ខុ","a"],[109,"ព្រះអភិធម្មបរិច្ឆេទទី៧ សមុច្ចយសង្គហវិភាគ(ម៉ោងទី ១០៩/១១៩)មគ្គង្គ សម្មាវាចា ដល់សម្មាសមាធិ បញ្ចប់ពោធបក្ខិយភិក្ខុ","a"],[110,"ព្រះអភិធម្មបរិច្ឆេទទី៧ សមុច្ចយសង្គហវិភាគ(ម៉ោងទី ១១០/១១៩)សព្វសង្គហៈ ខន្ធ ៥ និយមន័យខន្ធយភិក្ខុ","a"],[111,"ព្រះអភិធម្មបរិច្ឆេទទី៧ សមុច្ចយសង្គហវិភាគ(ម៉ោងទី ១១១/១១៩)សព្វសង្គហៈ ខន្ធ ៥ ពន្យល់ពីខន្ធចែជា ១១ ពួក","a"],[112,"ព្រះអភិធម្មបរិច្ឆេទទី៧ សមុច្ចយសង្គហវិភាគ(ម៉ោងទី ១១២/១១៩) ខន្ធ ៥ ចែកដោយអង្គធម៌និងការឧបមា","a"],[113,"ព្រះអភិធម្មបរិច្ឆេទទី៧ សមុច្ចយសង្គហវិភាគ(ម៉ោងទី ១១៣/១១៩) ឧបាទានក្ខន្ធ ៥ និងអាយតនៈ ១២ យ៉ាង","a"],[114,"ព្រះអភិធម្មបរិច្ឆេទទី៧ សមុច្ចយសង្គហវិភាគ(ម៉ោងទី ១១៤/១១៩)ធាតុ ១៨ មានចក្ខុធាតុជាដើម","a"],[115,"ព្រះអភិធម្មបរិច្ឆេទទី៧ សមុច្ចយសង្គហវិភាគ(ម៉ោងទី ១១៥/១១៩) អរិយសច្ចៈ ទុក្ខសច្ចៈ ឧបមាអរិយសច្ចៈ","a"],[116,"ព្រះអភិធម្មបរិច្ឆេទទី៧ សមុច្ចយសង្គហវិភាគ(ម៉ោងទី ១១៦/១១៩) ទុក្ខសច្ចៈ ជាតិ ជរា ព្យាធ មរណៈ សោក បរិទេវ ទុក្ខទុក្ខ","a"],[117,"ព្រះអភិធម្មបរិច្ឆេទទី៧ សមុច្ចយសង្គហវិភាគ(ម៉ោងទី ១១៧/១១៩) បញ្ចប់ទុក្ខ ១២ កង និងចូលសមុទយសច្ចៈ","a"],[118,"ព្រះអភិធម្មបរិច្ឆេទទី៧ សមុច្ចយសង្គហវិភាគ(ម៉ោងទី ១១៨/១១៩) អរិយសច្ចៈ សមុទយសច្ចៈ និរោធសច្ចៈ","a"],[119,"ព្រះអភិធម្មបរិច្ឆេទទី៧ សមុច្ចយសង្គហវិភាគ ភាគបញ្ចប់(ម៉ោងទី ១១៩/១១៩)អរិយសច្ចៈ ទុក្ខនិរោធគាមិនីបដិបទាអរិយសច្ចៈ","a"]]},{"i":65,"t":"yon-yi","km":"ព្រះអភិធម្មបរិច្ឆេទទី6 (2023)","en":"Abhidhamma Chapter 6 (2023)","tp":["abhidhamma"],"L":[[1,"ព្រះអភិធម្មបរិច្ឆេទទី៦ រូបសង្គហវិភាគ (ម៉ោងទី ០១/៦៦) និយមន័យរូប ថ្ងៃផ្តើមដំបូង","a"],[2,"ព្រះអភិធម្មបរិច្ឆេទទី៦ រូបសង្គហវិភាគ (ម៉ោងទី ០២/៦៦) លក្ខណាទិចតុក្ករបស់រូប","a"],[3,"ព្រះអភិធម្មបរិច្ឆេទទី៦ រូបសង្គហវិភាគ (ម៉ោងទី ០៣/៦៦) មហាភូតរូបដោយហេតុ ៥ ប្រការ","a"],[4,"ព្រះអភិធម្មបរិច្ឆេទទី៦ រូបសង្គហវិភាគ (ម៉ោងទី ០៤/៦៦) ពាក្យភូតមាន ៧ ន័យ","a"],[5,"ព្រះអភិធម្មបរិច្ឆេទទី៦ រូបសង្គហវិភាគ (ម៉ោងទី ០៥/៦៦) អាបោធាតុ មាន ៤ ន័យ","a"],[6,"ព្រះអភិធម្មបរិច្ឆេទទី៦ រូបសង្គហវិភាគ (ម៉ោងទី ០៦/៦៦) តេជោធាតុ មានសេចក្តី ៣ ប្រការ","a"],[7,"ព្រះអភិធម្មបរិច្ឆេទទី៦ រូបសង្គហវិភាគ (ម៉ោងទី ០៧/៦៦) វាយោធាតុ ខ្យល់មាន ៤ យ៉ាង","a"],[8,"ព្រះអភិធម្មបរិច្ឆេទទី៦ រូបសង្គហវិភាគ (ម៉ោងទី ០៨/៦៦) បញ្ចប់ធាតុ ៤ និងប្រៀបនឹងអាសិរពិស","a"],[9,"ព្រះអភិធម្មបរិច្ឆេទទី៦ រូបសង្គហវិភាគ (ម៉ោងទី ០៩/៦៦) ប្រៀបធៀបមហាភូតរូប ៤ នឹងអាសិរពិស","a"],[10,"ព្រះអភិធម្មបរិច្ឆេទទី៦ រូបសង្គហវិភាគ (ម៉ោងទី  ១០/៦៦) ឧបាទានក្ខន្ធ ៥ ជាពេជ្ឈឃាតជាដើម","a"],[11,"ព្រះអភិធម្មបរិច្ឆេទទី៦ រូបសង្គហវិភាគ (ម៉ោងទី  ១១/៦៦) ចក្ខុបសាទ និយមន័យចក្ខុ៣ យ៉ាង","a"],[12,"ព្រះអភិធម្មបរិច្ឆេទទី៦ រូបសង្គហវិភាគ (ម៉ោងទី  ១២/៦៦) បញ្ញាចក្ខុមាន ៥ យ៉ាង និងចក្ខុ ១៤ន័យ","a"],[13,"ព្រះអភិធម្មបរិច្ឆេទទី៦ រូបសង្គហវិភាគ (ម៉ោងទី  ១៣/៦៦) សោតបសាទ សោតមាន ៧ ប្រការ","a"],[14,"ព្រះអភិធម្មបរិច្ឆេទទី៦ រូបសង្គហវិភាគ (ម៉ោងទី  ១៤/៦៦) ឃានបសាទ និងជិវ្ហាបសាទរូប","a"],[15,"ព្រះអភិធម្មបរិច្ឆេទទី៦ រូបសង្គហវិភាគ (ម៉ោងទី  ១៥/៦៦) កាយបសាទរូប កាយមាន៤ យ៉ាង","a"],[16,"ព្រះអភិធម្មបរិច្ឆេទទី៦ រូបសង្គហវិភាគ (ម៉ោងទី  ១៦/៦៦) គោរចររូប រូបារម្មណ៍","a"],[17,"ព្រះអភិធម្មបរិច្ឆេទទី៦ រូបសង្គហវិភាគ (ម៉ោងទី  ១៧/៦៦) គោរចររូប សទ្ទារម្មណ៍ គន្ធារម្មណ៍","a"],[18,"ព្រះអភិធម្មបរិច្ឆេទទី៦ រូបសង្គហវិភាគ (ម៉ោងទី  ១៨/៦៦) គោរចររូប រសារម្មណ៍","a"],[19,"ព្រះអភិធម្មបរិច្ឆេទទី៦ រូបសង្គហវិភាគ (ម៉ោងទី  ១៩/៦៦) គោរចររូប រសារម្មណ៍ រសមាន ៤ យ៉ាង","a"],[20,"ព្រះអភិធម្មបរិច្ឆេទទី៦ រូបសង្គហវិភាគ (ម៉ោងទី  ២០/៦៦) ផោដ្ឋព្វារម្មណ៍ ៣ គឺដី ភ្លើង ខ្យល់","a"],[21,"ព្រះអភិធម្មបរិច្ឆេទទី៦ រូបសង្គហវិភាគ (ម៉ោងទី  ២១/៦៦) ភាវរូប គឺឥត្ថីភាវ បុរិសភាវ","a"],[22,"ព្រះអភិធម្មបរិច្ឆេទទី៦ រូបសង្គហវិភាគ (ម៉ោងទី  ២២/៦៦) ហទយវត្ថុ បេះដូង","a"],[23,"ព្រះអភិធម្មបរិច្ឆេទទី៦ រូបសង្គហវិភាគ (ម៉ោងទី  ២៣/៦៦) ហទយវត្ថុ និងទឹកឈាមក្នុងបេះដូង","a"],[24,"ព្រះអភិធម្មបរិច្ឆេទទី៦ រូបសង្គហវិភាគ (ម៉ោងទី  ២៤/៦៦) ជីវិតរូប រូបរក្សាកម្មជ្ជរូប","a"],[25,"ព្រះអភិធម្មបរិច្ឆេទទី៦ រូបសង្គហវិភាគ (ម៉ោងទី  ២៥/៦៦) ជីវិតរូប បច្ចុប្បន្នជីវិតិន្រ្ទិយមាន ៣ ប្រការ","a"],[26,"ព្រះអភិធម្មបរិច្ឆេទទី៦ រូបសង្គហវិភាគ (ម៉ោងទី  ២៦/៦៦) អាហាររូប កពលិង្ការាហារ","a"],[27,"ព្រះអភិធម្មបរិច្ឆេទទី៦ រូបសង្គហវិភាគ (ម៉ោងទី  ២៧/៦៦) អាហាររូប ការប្រៀបធៀបអាហារ","a"],[28,"ព្រះអភិធម្មបរិច្ឆេទទី៦ រូបសង្គហវិភាគ (ម៉ោងទី  ២៨/៦៦) បរិច្ឆេទរូប រូបកំណត់ព្រំដែនរបស់រូប","a"],[29,"ព្រះអភិធម្មបរិច្ឆេទទី៦ រូបសង្គហវិភាគ (ម៉ោងទី  ២៩/៦៦) កាយវិញ្ញត្តិរូប ការកម្រើកាយ","a"],[30,"ព្រះអភិធម្មបរិច្ឆេទទី៦ រូបសង្គហវិភាគ (ម៉ោងទី  ៣០/៦៦) វចីវិញ្ញត្តិរូប ការកម្រើកវាចា","a"],[31,"ព្រះអភិធម្មបរិច្ឆេទទី៦ រូបសង្គហវិភាគ (ម៉ោងទី  ៣១/៦៦) មេរៀនវចីវិញ្ញត្តិរូប","a"],[32,"ព្រះអភិធម្មបរិច្ឆេទទី៦ រូបសង្គហវិភាគ (ម៉ោងទី  ៣២/៦៦) ចិត្ត ២៦ ញុំាងរូប និងឧបត្ថម្ភឥរិយាបថ","a"],[33,"ព្រះអភិធម្មបរិច្ឆេទទី៦ រូបសង្គហវិភាគ (ម៉ោងទី  ៣៣/៦៦) វិការរូប រូបលហុតា ភាពស្រាលនៃរូប","a"],[34,"ព្រះអភិធម្មបរិច្ឆេទទី៦ រូបសង្គហវិភាគ (ម៉ោងទី  ៣៤/៦៦) រូបមុទុតា រូបកម្មញ្ញតា","a"],[35,"ព្រះអភិធម្មបរិច្ឆេទទី៦ រូបសង្គហវិភាគ (ម៉ោងទី  ៣៥/៦៦) ឧបចយរូប រូបកើតគ្រាដំបូងនិងក្រោយ","a"],[36,"ព្រះអភិធម្មបរិច្ឆេទទី៦ រូបសង្គហវិភាគ (ម៉ោងទី  ៣៦/៦៦) មោហៈការមិនដឹងក្នុងទុក្ខសច្ចៈ","a"],[37,"ព្រះអភិធម្មបរិច្ឆេទទី៦ រូបសង្គហវិភាគ (ម៉ោងទី  ៣៧/៦៦) ជរតារូប អនិច្ចតារូប","a"],[38,"ព្រះអភិធម្មបរិច្ឆេទទី៦ រូបសង្គហវិភាគ (ម៉ោងទី  ៣៨/៦៦) រូបន័យទី២ ឯកវិធន័យ ចែករូបជាន័យ១","a"],[39,"ព្រះអភិធម្មបរិច្ឆេទទី៦ រូបសង្គហវិភាគ (ម៉ោងទី  ៣៩/៦៦) ទុកន័យ គូទី១ ទី ២ ទី៣","a"],[40,"ព្រះអភិធម្មបរិច្ឆេទទី៦ រូបសង្គហវិភាគ (ម៉ោងទី  ៤០/៦៦) ទុកន័យ គូទី៤ ទី៥ ទី៦ ទី៧","a"],[41,"ព្រះអភិធម្មបរិច្ឆេទទី៦ រូបសង្គហវិភាគ (ម៉ោងទី  ៤១/៦៦) ទុកន័យ គូទី៨ ដល់ទី១១ បញ្ចប់","a"],[42,"ព្រះអភិធម្មបរិច្ឆេទទី៦ រូបសង្គហវិភាគ (ម៉ោងទី  ៤២/៦៦) រូបសមុដ្ឋាន កម្មជ្ជរូប ១៨","a"],[43,"ព្រះអភិធម្មបរិច្ឆេទទី៦ រូបសង្គហវិភាគ (ម៉ោងទី  ៤៣/៦៦) រូបសមុដ្ឋាន ចិត្តជ្ជរូប ១៥","a"],[44,"ព្រះអភិធម្មបរិច្ឆេទទី៦ រូបសង្គហវិភាគ (ម៉ោងទី ៤៤/៦៦) ចិត្តជ្ជរូបរូបកើតពីចិត្តមាន ១៥","a"],[45,"ព្រះអភិធម្មបរិច្ឆេទទី៦ រូបសង្គហវិភាគ (ម៉ោងទី ៤៥/៦៦) ឧតុជ្ជរូប មាន ១២ រូប","a"],[46,"ព្រះអភិធម្មបរិច្ឆេទទី៦ រូបសង្គហវិភាគ (ម៉ោងទី ៤៦/៦៦) អាហារជ្ជរូបមាន ១២ រូប","a"],[47,"ព្រះអភិធម្មបរិច្ឆេទទី៦ រូបសង្គហវិភាគ (ម៉ោងទី ៤៧/៦៦) ចែករូបដោយសមុដ្ឋាន៤ ជា ៥ ន័យ","a"],[48,"ព្រះអភិធម្មបរិច្ឆេទទី៦ រូបសង្គហវិភាគ (ម៉ោងទី ៤៨/៦៦) ចែកសសម្ភារៈជាសុត្តន្តន័យ បឋវីធាតុ ២០","a"],[49,"ព្រះអភិធម្មបរិច្ឆេទទី៦ រូបសង្គហវិភាគ (ម៉ោងទី ៤៩/៦៦) ចែកសសម្ភារៈជាសុត្តន្តន័យ អាបោ តេជោ វាយោធាតុ","a"],[50,"ព្រះអភិធម្មបរិច្ឆេទទី៦ រូបសង្គហវិភាគ (ម៉ោងទី ៥០/៦៦) រូបកលាប ចែកសំណុរបស់រូបជា ២១ កលាប","a"],[51,"ព្រះអភិធម្មបរិច្ឆេទទី៦ រូបសង្គហវិភាគ (ម៉ោងទី ៥១/៦៦) កម្មជ្ជកលាប កលាបរូបកើតពីកម្មមាន ៩ កលាប","a"],[52,"ព្រះអភិធម្មបរិច្ឆេទទី៦ រូបសង្គហវិភាគ (ម៉ោងទី ៥២/៦៦) ចិត្តជ្ជកលាប មាន ៦ កលាបមានរូប ១៤","a"],[53,"ព្រះអភិធម្មបរិច្ឆេទទី៦ រូបសង្គហវិភាគ (ម៉ោងទី ៥៣/៦៦) ចិត្តជ្ជកលាប មាន ៦ កលាបភាគបញ្ចប់","a"],[54,"ព្រះអភិធម្មបរិច្ឆេទទី៦ រូបសង្គហវិភាគ (ម៉ោងទី ៥៤/៦៦) ចិត្តជ្ជកលាប មាន ៦ កលាបភាគបញ្ចប់","a"],[55,"ព្រះអភិធម្មបរិច្ឆេទទី៦ រូបសង្គហវិភាគ (ម៉ោងទី ៥៥/៦៦) ឧតុជ្ជកលាប ៤ យ៉ាងផ្សេងទៀត","a"],[56,"ព្រះអភិធម្មបរិច្ឆេទទី៦ រូបសង្គហវិភាគ (ម៉ោងទី ៥៦/៦៦) អារហារជ្ជកលាបមាន ២ និងសសម្ភារបឋវី","a"],[57,"ព្រះអភិធម្មបរិច្ឆេទទី៦ រូបសង្គហវិភាគ (ម៉ោងទី ៥៧/៦៦) កលាបសសម្ភារបឋវី អាបោធាតុ តេជោធាតុ","a"],[58,"ព្រះអភិធម្មបរិច្ឆេទទី៦ រូបសង្គហវិភាគ (ម៉ោងទី ៥៨/៦៦) សសម្ភាររបស់កលាប ៤ ភាគបញ្ចប់","a"],[59,"ព្រះអភិធម្មបរិច្ឆេទទី៦ រូបសង្គហវិភាគ (ម៉ោងទី ៥៩/៦៦) រូបបវត្តិកមន័យ សម្តែងការប្រព្រឹត្តទៅរបស់រូប","a"],[60,"ព្រះអភិធម្មបរិច្ឆេទទី៦ រូបសង្គហវិភាគ (ម៉ោងទី ៦០/៦៦) ចែករូបកើតក្នុងភូមិទាំង ៤ មានកាមភូមិជាដើម","a"],[61,"ព្រះអភិធម្មបរិច្ឆេទទី៦ រូបសង្គហវិភាគ (ម៉ោងទី ៦១/៦៦) ចែករូបដោយកាល ៣ គឺបដិសន្ធិកាល បវត្តិកាល ចុតិកាល","a"],[62,"ព្រះអភិធម្មបរិច្ឆេទទី៦ រូបសង្គហវិភាគ (ម៉ោងទី ៦២/៦៦) ចែករូបកើតក្នុងសមុដ្ឋាន ៤ ក្នុងចុតិកាល","a"],[63,"ព្រះអភិធម្មបរិច្ឆេទទី៦ រូបសង្គហវិភាគ (ម៉ោងទី ៦៣/៦៦) ចែករូបដោយកំណើតរបស់សត្វ ៤","a"],[64,"ព្រះអភិធម្មបរិច្ឆេទទី៦ រូបសង្គហវិភាគ (ម៉ោងទី ៦៤/៦៦) និព្វានបរមត្ថ និយមន័យនិព្វាន","a"],[65,"ព្រះអភិធម្មបរិច្ឆេទទី៦ រូបសង្គហវិភាគ (ម៉ោងទី ៦៥/៦៦) និព្វានមាន ១ ២ ៣ និង៥ យ៉ាង","a"],[66,"ព្រះអភិធម្មបរិច្ឆេទទី៦ រូបសង្គហវិភាគ ភាគបញ្ចប់(ម៉ោងទី ៦៦/៦៦) និព្វានមាន ១៤៣បទ និងប្រៀបធៀបនឹងអាកាស ១០","a"]]},{"i":66,"t":"yon-yi","km":"ព្រះអភិធម្មបរិច្ឆេទទី5 (2022)","en":"Abhidhamma Chapter 5 (2022)","tp":["abhidhamma"],"L":[[1,"បរិច្ឆេទទី៥ វិថីមុត្តសង្គហវិភាគ 01 ថ្ងៃបើកវិគ្គបរិច្ឆេទទី ៥ ដំបូង","ay"],[2,"បរិច្ឆេទទី៥ វិថីមុត្តសង្គហវិភាគ 02 និយមន័យនរក ឬនិរយ","ay"],[3,"បរិច្ឆេទទី៥ វិថីមុត្តសង្គហវិភាគ 03 សង្ឃាតនរក នរកភ្នំភ្លើងកិនឱ្យខ្ទិច","ay"],[4,"បរិច្ឆេទទី៥ វិថីមុត្តសង្គហវិភាគ 04 តាបននរកដល់មហារោរុវនរក","ay"],[5,"ព្រះអភិធម្មបរិច្ឆេទទី៥ វិថីមុត្តសង្គហវិភាគ (ម៉ោងទី ០៥/៨២) អវីចិនរក នរកមិនមានចន្លោះនៃភ្លើង","a"],[6,"ព្រះអភិធម្មបរិច្ឆេទទី៥ វិថីមុត្តសង្គហវិភាគ (ម៉ោងទី ០៦/៨២) ទេវទូតសូត្រ ទេវទូតមាន ៥","a"],[7,"ព្រះអភិធម្មបរិច្ឆេទទី៥ វិថីមុត្តសង្គហវិភាគ (ម៉ោងទី ០៧/៨២) ទេវទូតសូត្រភាគ២","a"],[8,"ព្រះអភិធម្មបរិច្ឆេទទី៥ វិថីមុត្តសង្គហវិភាគ (ម៉ោងទី ០៨/៨២) អ្នកក្បត់ចិត្តស្វាមី និងបុរសក្បត់ចិត្តប្រពន្ធ","a"],[9,"ព្រះអភិធម្មបរិច្ឆេទទី៥ វិថីមុត្តសង្គហវិភាគ (ម៉ោងទី ០៩/៨២) វិនិច្ឆ័យទោសនៃបាណាតិបាតទៅនរក","a"],[10,"ព្រះអភិធម្មបរិច្ឆេទទី៥ វិថីមុត្តសង្គហវិភាគ (ម៉ោងទី ១០/៨២) បាបកម្មធ្លាក់នរកក្នុងនេមិរាជជាតក","a"],[11,"ព្រះអភិធម្មបរិច្ឆេទទី៥ វិថីមុត្តសង្គហវិភាគ (ម៉ោងទី ១១/៨២) បាបកម្មធ្លាក់នរកក្នុងនេមិរាជជាតកបន្ត","a"],[12,"ព្រះអភិធម្មបរិច្ឆេទទី៥ វិថីមុត្តសង្គហវិភាគ (ម៉ោងទី ១២/៨២) យកលោកនរកទាំង ១០","a"],[13,"ព្រះអភិធម្មបរិច្ឆេទទី៥ វិថីមុត្តសង្គហវិភាគ (ម៉ោងទី ១៣/៨២) លោកន្តរនរក នរកបាបកម្មធ្ងន់","a"],[14,"ព្រះអភិធម្មបរិច្ឆេទទី៥ វិថីមុត្តសង្គហវិភាគ (ម៉ោងទី ១៤/៨២) និយមន័យបេត (ប្រេត)","a"],[15,"ព្រះអភិធម្មបរិច្ឆេទទី៥ វិថីមុត្តសង្គហវិភាគ (ម៉ោងទី ១៥/៨២) រឿងប្រេតភាគ៣","a"],[16,"ព្រះអភិធម្មបរិច្ឆេទទី៥ វិថីមុត្តសង្គហវិភាគ (ម៉ោងទី ១៦/៨២) រឿងប្រេតញាតិព្រះបាទពិម្ពិសារ","a"],[17,"ព្រះអភិធម្មបរិច្ឆេទទី៥ វិថីមុត្តសង្គហវិភាគ (ម៉ោងទី ១៧/៨២) តិរោកុឌ្ឌបេត្តវត្ថុភាគបញ្ចប់","a"],[18,"ព្រះអភិធម្មបរិច្ឆេទទី៥ វិថីមុត្តសង្គហវិភាគ (ម៉ោងទី ១៨/៨២) ប្រេតគ្មានសម្លៀកបំពាក់ជាដើម","a"],[19,"ព្រះអភិធម្មបរិច្ឆេទទី៥ វិថីមុត្តសង្គហវិភាគ (ម៉ោងទី ១៩/៨២) ប្រេតជាមាតាព្រះសារីបុត្តជាដើមភាគ៦","a"],[20,"ព្រះអភិធម្មបរិច្ឆេទទី៥ វិថីមុត្តសង្គហវិភាគ (ម៉ោងទី ២០/៨២) មដ្ឋកុណ្ឌលីប្រេតដល់ធនបាលប្រេត","a"],[21,"ព្រះអភិធម្មបរិច្ឆេទទី៥ វិថីមុត្តសង្គហវិភាគ (ម៉ោងទី ២១/៨២) ចូឡសេដ្ឋីប្រេត និងអង្កុរប្រេត","a"],[22,"ព្រះអភិធម្មបរិច្ឆេទទី៥ វិថីមុត្តសង្គហវិភាគ (ម៉ោងទី ២២/៨២) ឧត្តមាតុប្រេត សុតប្រេត កណ្ណមុណ្ឌប្រេត","a"],[23,"ព្រះអភិធម្មបរិច្ឆេទទី៥ វិថីមុត្តសង្គហវិភាគ (ម៉ោងទី ២៣/៨២) អភិជ្ជមានប្រេត សានុវាសិប្រេត","a"],[24,"ព្រះអភិធម្មបរិច្ឆេទទី៥ វិថីមុត្តសង្គហវិភាគ (ម៉ោងទី ២៤/៨២) សានុវាសិប្រេត រថកាប្រេត ភុសប្រេត","a"],[25,"ព្រះអភិធម្មបរិច្ឆេទទី៥ វិថីមុត្តសង្គហវិភាគ (ម៉ោងទី ២៥/៨២) សេរីនីប្រេត មិគលុទ្ទប្រេត ធាតុវិវណ្ណប្រេត","a"],[26,"ព្រះអភិធម្មបរិច្ឆេទទី៥ វិថីមុត្តសង្គហវិភាគ (ម៉ោងទី ២៦/៨២) អម្ពសក្ខរប្រេត","a"],[27,"ព្រះអភិធម្មបរិច្ឆេទទី៥ វិថីមុត្តសង្គហវិភាគ (ម៉ោងទី ២៧/៨២) សេរីសកប្រេត នន្ទិកាប្រេត","a"],[28,"ព្រះអភិធម្មបរិច្ឆេទទី៥ វិថីមុត្តសង្គហវិភាគ (ម៉ោងទី ២៨/៨២) រេវតីប្រេត ឧច្ឆុប្រេត កុមារប្រេត រាជបុត្តប្រេត","a"],[29,"ព្រះអភិធម្មបរិច្ឆេទទី៥ វិថីមុត្តសង្គហវិភាគ (ម៉ោងទី ២៩/៨២) គណប្រេត បាដលិប្រេត អម្ពវនប្រេត","a"],[30,"ព្រះអភិធម្មបរិច្ឆេទទី៥ វិថីមុត្តសង្គហវិភាគ (ម៉ោងទី ៣០/៨២) ភោគសំហរប្រេត សេដ្ឋីបុត្តប្រេត សដ្ឋីកូដសហស្ស","a"],[31,"ព្រះអភិធម្មបរិច្ឆេទទី៥ វិថីមុត្តសង្គហវិភាគ (ម៉ោងទី ៣១/៨២)  ប្រេត ១២ ពួកតាមបរមត្ថជោតិកៈ","a"],[32,"ព្រះអភិធម្មបរិច្ឆេទទី៥ វិថីមុត្តសង្គហវិភាគ (ម៉ោងទី ៣២/៨២) ប្រេត ២១ ជំពូកក្នុងព្រះវិន័យបិដក","a"],[33,"ព្រះអភិធម្មបរិច្ឆេទទី៥ វិថីមុត្តសង្គហវិភាគ (ម៉ោងទី ៣៣/៨២) បញ្ចប់មេរៀនកំណើតប្រេត","a"],[34,"ព្រះអភិធម្មបរិច្ឆេទទី៥ វិថីមុត្តសង្គហវិភាគ (ម៉ោងទី ៣៤/៨២) កំណើតអសុរកាយ","a"],[35,"ព្រះអភិធម្មបរិច្ឆេទទី៥ វិថីមុត្តសង្គហវិភាគ (ម៉ោងទី ៣៥/៨២) កំណើតសត្វតិរច្ឆាន","a"],[36,"ព្រះអភិធម្មបរិច្ឆេទទី៥ វិថីមុត្តសង្គហវិភាគ (ម៉ោងទី ៣៦/៨២) មេរៀនកំណើតមនុស្ស","a"],[37,"ព្រះអភិធម្មបរិច្ឆេទទី៥ វិថីមុត្តសង្គហវិភាគ (ម៉ោងទី ៣៧/៨២) ទ្វីបមនុស្សមាន ៤ ទ្វីប","a"],[38,"ព្រះអភិធម្មបរិច្ឆេទទី៥ វិថីមុត្តសង្គហវិភាគ (ម៉ោងទី ៣៨/៨២) ស្ថានភាពរស់នៅមនុស្សក្នុងទី្វបទាំង៤","a"],[39,"ព្រះអភិធម្មបរិច្ឆេទទី៥ វិថីមុត្តសង្គហវិភាគ (ម៉ោងទី ៣៩/៨២) ទេវតាចាតុម្មហារាជិកភូមិ","a"],[40,"ព្រះអភិធម្មបរិច្ឆេទទី៥ វិថីមុត្តសង្គហវិភាគ (ម៉ោងទី ៤០/៨២) ទេវតាចិត្តអាក្រក់មាន ៤ ប្រភេទ","a"],[41,"ព្រះអភិធម្មបរិច្ឆេទទី៥ វិថីមុត្តសង្គហវិភាគ (ម៉ោងទី ៤១/៨២) ទេវតាតាវត្តិង្ស យាមា តុសិត និម្មានរតី","a"],[42,"ព្រះអភិធម្មបរិច្ឆេទទី៥ វិថីមុត្តសង្គហវិភាគ (ម៉ោងទី ៤២/៨២) បរនិម្មតវសវត្តី និងបញ្ចប់ទេវតា៦ជាន់","a"],[43,"ព្រះអភិធម្មបរិច្ឆេទទី៥ វិថីមុត្តសង្គហវិភាគ (ម៉ោងទី ៤៣/៨២) រូបព្រហ្មបឋមជ្ឈានភូមិ ទុតិយជ្ឈានភូមិ","a"],[44,"ព្រះអភិធម្មបរិច្ឆេទទី៥ វិថីមុត្តសង្គហវិភាគ (ម៉ោងទី ៤៤/៨២) តតិយជ្ឈានភូមិ ចតុត្ថជ្ឈានភូមិ","a"],[45,"ព្រះអភិធម្មបរិច្ឆេទទី៥ វិថីមុត្តសង្គហវិភាគ (ម៉ោងទី ៤៥/៨២) អរូបភូមិមាន ៤","a"],[46,"ព្រះអភិធម្មបរិច្ឆេទទី៥ វិថីមុត្តសង្គហវិភាគ (ម៉ោងទី ៤៦/៨២) បញ្ចប់ភូមិ ៣១","a"],[47,"ព្រះអភិធម្មបរិច្ឆេទទី៥ វិថីមុត្តសង្គហវិភាគ (ម៉ោងទី ៤៧/៨២) សត្តាវាស៩ វិញ្ញាណឋិតិ៧","a"],[48,"ព្រះអភិធម្មបរិច្ឆេទទី៥ វិថីមុត្តសង្គហវិភាគ (ម៉ោងទី ៤៨/៨២) អំពីកប្បមាន ៤ យ៉ាង","a"],[49,"ព្រះអភិធម្មបរិច្ឆេទទី៥ វិថីមុត្តសង្គហវិភាគ (ម៉ោងទី ៤៩/៨២) សុញ្ញកប្ប និងអសុញ្ញកប្ប","a"],[50,"ព្រះអភិធម្មបរិច្ឆេទទី៥ វិថីមុត្តសង្គហវិភាគ (ម៉ោងទី ៥០/៨២) កប្បដែលព្រះពុទ្ធបំពេញបារមី៤ អសង្ខេយ្យ១សែនកប្ប","a"],[51,"ព្រះអភិធម្មបរិច្ឆេទទី៥ វិថីមុត្តសង្គហវិភាគ (ម៉ោងទី ៥១/៨២) កប្បដែលវិនាសដោយភ្លើង","a"],[52,"ព្រះអភិធម្មបរិច្ឆេទទី៥ វិថីមុត្តសង្គហវិភាគ (ម៉ោងទី ៥២/៨២) តើផែនដីក៏កើតឡើងយ៉ាងដូចម្តេច","a"],[53,"ព្រះអភិធម្មបរិច្ឆេទទី៥ វិថីមុត្តសង្គហវិភាគ (ម៉ោងទី ៥៣/៨២) សិក្សាបញ្ចប់ភូមចតុក្ក","a"],[54,"ព្រះអភិធម្មបរិច្ឆេទទី៥ វិថីមុត្តសង្គហវិភាគ (ម៉ោងទី ៥៤/៨២) កម្មនាំឱ្យពិការផ្សេងៗ","a"],[55,"ព្រះអភិធម្មបរិច្ឆេទទី៥ វិថីមុត្តសង្គហវិភាគ (ម៉ោងទី ៥៥/៨២) ជនកកម្ម កម្មញុំាងវិបាកនិងកម្មជ្ជរូបឱ្យកើត","a"],[56,"ព្រះអភិធម្មបរិច្ឆេទទី៥ វិថីមុត្តសង្គហវិភាគ (ម៉ោងទី ៥៦/៨២) ឧបត្ថម្ភកកម្មប្រការទី១ភាគ១","a"],[57,"ព្រះអភិធម្មបរិច្ឆេទទី៥ វិថីមុត្តសង្គហវិភាគ (ម៉ោងទី ៥៧/៨២) ឧបត្ថម្ភកកម្មប្រការទី១ក លេខ ១ ដល់លេខ ៤","a"],[58,"ព្រះអភិធម្មបរិច្ឆេទទី៥ វិថីមុត្តសង្គហវិភាគ (ម៉ោងទី ៥៨/៨២) ឧបត្ថម្ភកកម្មប្រការទី១ក លេខ ៥ ដល់លេខ ៨","a"],[59,"ព្រះអភិធម្មបរិច្ឆេទទី៥ វិថីមុត្តសង្គហវិភាគ (ម៉ោងទី ៥៩/៨២) ឧបត្ថម្ភកកម្មប្រការទី២ខ លេខ ១ ដល់លេខ ៥","a"],[60,"ព្រះអភិធម្មបរិច្ឆេទទី៥ វិថីមុត្តសង្គហវិភាគ (ម៉ោងទី ៦០/៨២) ឧបត្ថម្ភកកម្មប្រការទី២ខ លេខ ៦ ដល់លេខ ១០","a"],[61,"ព្រះអភិធម្មបរិច្ឆេទទី៥ វិថីមុត្តសង្គហវិភាគ (ម៉ោងទី ៦១/៨២) ឧបត្ថម្ភកកម្មប្រការទី៣គ លេខ ១ដល់លេខ៣","a"],[62,"ព្រះអភិធម្មបរិច្ឆេទទី៥ វិថីមុត្តសង្គហវិភាគ (ម៉ោងទី ៦២/៨២) ឧបត្ថម្ភកកម្មប្រការទី៣គ លេខ ៣ដល់លេខ៧","a"],[63,"ព្រះអភិធម្មបរិច្ឆេទទី៥ វិថីមុត្តសង្គហវិភាគ (ម៉ោងទី ៦៣/៨២) ឧបបីឡកកម្ម កម្មបៀតបៀនមាន ៣ ប្រការ","a"],[64,"ព្រះអភិធម្មបរិច្ឆេទទី៥ វិថីមុត្តសង្គហវិភាគ (ម៉ោងទី ៦៤/៨២) ឧបបីឡកកម្ម កម្មបៀតបៀន ៣ ប្រការភាគបញ្ចប់","a"],[65,"ព្រះអភិធម្មបរិច្ឆេទទី៥ វិថីមុត្តសង្គហវិភាគ (ម៉ោងទី ៦៥/៨២) ឧបឃាតកកម្ម ក ប្រការទី១មាន ៣ ប្រការ","a"],[66,"ព្រះអភិធម្មបរិច្ឆេទទី៥ វិថីមុត្តសង្គហវិភាគ (ម៉ោងទី ៦៦/៨២) ឧបឃាតកកម្ម មាន ៣ ប្រការចុងក្រោយ","a"],[67,"ព្រះអភិធម្មបរិច្ឆេទទី៥ វិថីមុត្តសង្គហវិភាគ (ម៉ោងទី ៦៧/៨២) គរុកកម្ម កម្មដែលធ្ងន់","a"],[68,"ព្រះអភិធម្មបរិច្ឆេទទី៥ វិថីមុត្តសង្គហវិភាគ (ម៉ោងទី ៦៨/៨២) អាសន្នកម្ម កម្មកើតពេលជិតស្លាប់","a"],[69,"ព្រះអភិធម្មបរិច្ឆេទទី៥ វិថីមុត្តសង្គហវិភាគ (ម៉ោងទី ៦៩/៨២) អាចិណ្ណកម្ម កម្មសន្សំរឿយៗ","a"],[70,"ព្រះអភិធម្មបរិច្ឆេទទី៥ វិថីមុត្តសង្គហវិភាគ (ម៉ោងទី ៧០/៨២) ទិដ្ឋធម្មវេទនីយកម្ម កម្មឱ្យផលក្នុងបច្ចុប្បន្នជាតិ","a"],[71,"ព្រះអភិធម្មបរិច្ឆេទទី៥ វិថីមុត្តសង្គហវិភាគ (ម៉ោងទី ៧១/៨២) ទិដ្ឋធម្មវេទនីយកម្ម ប្រកបដោយលក្ខណៈ៤ ប្រការ","a"],[72,"ព្រះអភិធម្មបរិច្ឆេទទី៥ វិថីមុត្តសង្គហវិភាគ (ម៉ោងទី ៧២/៨២) ឧបបជ្ជវេទនីកម្ម អបរាបរិយវេទនីយកម្ម","a"],[73,"ព្រះអភិធម្មបរិច្ឆេទទី៥ វិថីមុត្តសង្គហវិភាគ (ម៉ោងទី ៧៣/៨២) អហោសិកម្ម កម្មមិនមានឱកាសឱ្យផល","a"],[74,"ព្រះអភិធម្មបរិច្ឆេទទី៥ វិថីមុត្តសង្គហវិភាគ (ម៉ោងទី ៧៤/៨២) បាកដ្ឋាចតុក្ក អកុសលកម្ម បាណាតិបាត","a"],[75,"ព្រះអភិធម្មបរិច្ឆេទទី៥ វិថីមុត្តសង្គហវិភាគ (ម៉ោងទី ៧៥/៨២) បាកដ្ឋាចតុក្ក អកុសលកម្មបថ អទិន្នាទា","a"],[76,"ព្រះអភិធម្មបរិច្ឆេទទី៥ វិថីមុត្តសង្គហវិភាគ (ម៉ោងទី ៧៦/៨២) កាមេសុមិច្ឆាចារ មុសាវាទ បិសុណាវាទ","a"],[77,"ព្រះអភិធម្មបរិច្ឆេទទី៥ វិថីមុត្តសង្គហវិភាគ (ម៉ោងទី ៧៧/៨២) បញ្ចប់អកុសលកម្មបថ១០","a"],[78,"ព្រះអភិធម្មបរិច្ឆេទទី៥ វិថីមុត្តសង្គហវិភាគ (ម៉ោងទី ៧៨/៨២) បញ្ចប់អកុសលកម្ម១០ ភាគបញ្ចប់","a"],[79,"ព្រះអភិធម្មបរិច្ឆេទទី៥ វិថីមុត្តសង្គហវិភាគ (ម៉ោងទី ៧៩/៨២) ទានមយបុណ្យ សីលមយបុណ្យ","a"],[80,"ព្រះអភិធម្មបរិច្ឆេទទី៥ វិថីមុត្តសង្គហវិភាគ (ម៉ោងទី ៨០/៨២) ភាវនា អបចាយន វេយ្យាវច្ច បត្តិទាន","a"],[81,"ព្រះអភិធម្មបរិច្ឆេទទី៥ វិថីមុត្តសង្គហវិភាគ (ម៉ោងទី ៨១/៨២) ធម្មស្សវន ធម្មទេសនា ទិដ្ឋុជុកម្ម","a"],[82,"ព្រះអភិធម្មបរិច្ឆេទទី៥ វិថីមុត្តសង្គហវិភាគ ភាគបញ្ចប់(ម៉ោងទី ៨២/៨២) មរណុប្បត្តិចតុក្ក ការស្លាប់មាន ៤ យ៉ាង","a"]]},{"i":67,"t":"yon-yi","km":"ព្រះអភិធម្មបរិច្ឆេទទី1 (2022)","en":"Abhidhamma Chapter 1 (2022)","tp":["abhidhamma"],"L":[[1,"០១ និយមន័យអភិធម្ម","ay"],[2,"០២ សច្ច:២យ៉ាង","ay"],[3,"០៣ សម្មតិសច្ចៈដោយហេតុ ៨","ay"],[4,"០៤ ពន្យល់ពាក្យថា ចិត្ត","ay"],[5,"០៥ ការប្រៀបធៀបចិត្ត","ay"],[6,"០៦ សមុដ្ឋាននាំឱ្យរូបបែកធ្លាយ","ay"],[7,"០៧ ពាក្យថានិព្វាន","ay"],[8,"០៨ វេវចនរបស់ចិត្ត១០ យ៉ាង","ay"],[9,"០៩ ពាក្យថាវិញ្ញាណ វិញ្ញាណក្ខន្ធ","ay"],[10,"១០ លក្ខណាទិចតុក្ករបស់ចិត្ត","ay"],[11,"១១ អំណាចរបស់ចិត្ត","ay"],[12,"១២ ធម្មជាតិរបស់ចិត្ត ៣ ប្រការ","ay"],[13,"១៣ គាថាសម្តែងពីសភាពរបស់ចិត្ត","ay"],[14,"១៤ ពាក្យថាអកុសលចិត្ត","ay"],[15,"១៥ លោភមូលចិត្តដួងទី១","ay"],[16,"១៦ និយតនមិច្ឆាទិដ្ឋិ ៣ យ៉ាង","ay"],[17,"១៧ ពន្យល់លោភមូលចិត្តដួងទី១ទី២","ay"],[18,"១៨ ពន្យល់លោភមូលចិត្តដួងទី៣","ay"],[19,"១៩ មានះ ៩ យ៉ាង","ay"],[20,"២០ ចិត្តបរមត្ថ","ay"],[21,"២១ លោភមូលចិត្តដួងទី៥ ទី៦","ay"],[22,"២២ លោភមូលចិត្តដួងទី៧ ទី៨","ay"],[23,"២៣ លក្ខណាទិចតុក្ករបស់លោភមូលចិត្ត","ay"],[24,"២៤ សំយោជនជាហេតុនាំឱ្យលោភកើត","ay"],[25,"២៥ ហេតុនាំឱ្យលោភកើតមាន ៤","ay"],[26,"២៦ ហេតុឱ្យកើតទិដ្ឋិសម្បយុត្តចិត្ត","ay"],[27,"២៧ ហេតុឱ្យកើតទិដ្ឋិវិប្បយុត្តចិត្ត","ay"],[28,"២៨ ហេតុនាំឱ្យកើតសោមនស្ស និងឧបេក្ខាលោភ","ay"],[29,"២៩ ហេតុនាំឱ្យកើតអសង្ខារិកនិងសសង្ខារ","ay"],[30,"៣០ របៀសង្កេតលោភមូលចិត្ត","ay"],[31,"៣១ ចែកលោភចិត្តដោយន័យផ្សេងៗ","ay"],[32,"៣២ ចែកលោភចិត្តដោយសម្បយុត្តដល់កិច្ច","ay"],[33,"៣៣ ចែកលោភចិត្តដោយអារម្មណ៍ដល់វិញ្ញាណធាតុ","ay"],[34,"៣៤ ផលរបស់លោភមូលចិត្តបច្ចុប្បន្ននិងអនាគត","ay"],[35,"៣៥ ពន្យល់ទោសមូលចិត្ត ២ ដួង","ay"],[36,"៣៦ អាឃាតអ្នកដទៃដោយវត្ថុ ១០ ប្រការ","ay"],[37,"៣៧ ហេតុនាំឱ្យកើតទោសមូលចិត្តមាន ៤ ប្រការ","ay"],[38,"៣៨ បុគ្គលជាទោសដល់ការផ្សាយមេត្តាចិត្ត","ay"],[39,"៣៩ ផ្សាយមេត្តាចិត្តចំពោះខ្លួនឯងនិងអ្នកដទៃ","ay"],[40,"៤០ ផ្សាយមេត្តាទៅកាន់ទិសផ្សេងៗ","ay"],[41,"៤១ ការពិចារណាដើម្បីលះបង់ទោសមូលចិត្ត","ay"],[42,"៤២ ពិចារណាធម៌ដូចម្តេចដើម្បីលះទោសៈ","ay"],[43,"៤៣ វិធីយកឈ្នះមនុស្សមាន ៤ ប្រភេទ","ay"],[44,"៤៤ និយមន័យមោហមូលចិត្ត ២ ដួង","ay"],[45,"៤៥ អវិជ្ជាមិនដឹងធម៌ ៨ យ៉ាង","ay"],[46,"៤៦ ឧទាហរណ៍ក្នុងមោហមូលចិត្ត ២ ដួង","ay"],[47,"៤៧ ហេតុនាំឱ្យកើតមោហមូលចិត្ត ២ ដួង","ay"],[48,"៤៨ បកស្រាយរឿងប្រេត និងកាន់បិណ្ឌ","ay"],[49,"៤៩ ព្រះនាមថាអរហំ សម្មាសម្ពុទ្ធោ","ay"],[50,"៥០ ព្រ ៗ","ay"],[143,"១៤៣ មហាវិបាកចិត្ត៨ដួង","ay"],[144,"១៤៤ ផលរបស់កម្ម ៧ យ៉ាង ចូឡកម្មវិភាគសូត្រ","ay"],[145,"១៤៥ បុព្វហេតុនាំឱ្យផលរបស់កម្មផ្សេងគ្នា","ay"],[146,"១៤៦ ចែកមហាវិបាកចិត្តដោយន័យផ្សេងៗ","ay"],[147,"១៤៧ ចែកមហាកិរិយាចិត្តដោយន័យផ្សេងៗ","ay"],[148,"១៤៨ ពាក្យថា ឈានចិត្តរូបាវចរឈាន","ay"],[149,"១៤៩ បុព្វកិច្ចរបស់អ្នកបដិបត្តិកម្មដ្ឋាន៧","ay"],[150,"១៥០ បុព្វកិច្ចរបស់អ្នកបដិបត្តិកម្មដ្ឋានបន្តចប់","ay"],[151,"១៥១ អង្គឈាន វិតក្ក វិចារ បីតិ","ay"],[152,"១៥២ អង្គឈានលះនីវរណៈ ៥ យ៉ាង","ay"],[153,"១៥៣ ពាក្យសមថភាវនា","ay"],[154,"១៥៤ កិសណ ១០ អសុភ ១០","ay"],[155,"១៥៥ អធិប្បាយអនុស្សតិ ១០","ay"],[156,"១៥៦ ឧបសមានុស្សតិ មរណានុស្សតិ កាយគាតសតិ អានាបានស្សតិ","ay"],[157,"១៥៧ ចម្រើនមេត្តា និងករុណាចិត្តចំពោះសព្វសត្វ","ay"],[158,"១៥៨ អាហារេបដិកូលសញ្ញា ចតុធាតុវវត្ថាន","ay"],[159,"១៥៩ ចែកកម្មដ្ឋាន៤០ ដោយអាការៈ១០យ៉ាង","ay"],[160,"១៦០ កម្មដ្ឋានសមគួរដល់ចរិត ៦","ay"],[161,"១៦១ ការប្រព្រឹត្តិធម៌របស់ចរិតទាំង ៦","ay"],[162,"១៦២ ចែកន័យផ្សេងៗក្នុងរូបកុសល ៥","ay"],[163,"១៦៣ រូបាវចរចិត្ត ៥ រូបព្រហ្ម ១៦","ay"],[164,"១៦៤ អរូបឈានទី ១ អាកាសានញ្ចាយតន","ay"],[165,"១៦៥ សំណួរចម្លើយក្នុងលោកិយចិត្ត ៨១","ay"],[166,"១៦៦ និយមន័យលោកុត្តរចិត្ត","ay"],[167,"១៦៧ សោតាបត្តិមគ្គចិត្ត","ay"],[168,"១៦៨ សោតាបន្នបុគ្គលចែកជា ៣ ប្រភេទ","ay"],[169,"១៦៩ អនាគាមី ចែកចេញជា ៥ ប្រភេទ","ay"],[170,"១៧០ ព្រះអរហន្ត ចែកជា ២ ប្រភេទ","ay"],[171,"១៧១ តើព្រះអរិយបុគ្គលត្រាស់ដឹងនូវធម៌អ្វី","ay"],[172,"១៧២ ចែកលោកុត្តរចិត្តលះបង់កិលេសដូចម្តេចខ្លះ","ay"],[173,"១៧៣ សរុបចិត្ត ៨៩ ដួងដោយន័យផ្សេងៗ","ay"],[174,"១៧៤ បញ្ចប់ថ្នាក់ចិត្តបរមត្ថរយៈពេល២ ឆ្នាំ","ay"]]},{"i":68,"t":"yon-yi","km":"ព្រះអភិធម្មបរិច្ឆេទទី2 (2024)","en":"Abhidhamma Chapter 2 (2024)","tp":["abhidhamma"],"L":[[1,"០១ ចេតសិកមានអត្ថ៤យ៉ាង","ay"],[2,"០២ លក្ខណាទិចតុក្ករបស់ចេតសិក","ay"],[3,"០៣ ផស្សចេតសិក ការប៉ះខ្ទប់ឬពាល់ត្រូវ","ay"],[4,"០៤ វេទនចេតសិក ចែកវេទនាជា២ន័យ","ay"],[5,"០៥ លក្ខណាទិចតុក្គរបស់វេទនា","ay"],[6,"០៦ សោមនស្សវេទនា ទោមនស្សវេទនា ឧបេក្ខាវេទនា","ay"],[7,"០៧ ហេតុនាំឲ្យកើតវេទនាមាន៥យ៉ាង","ay"],[8,"០៨ សញ្ញាចេតសិក ចេតនាចេតសិក","ay"],[9,"០៩ ចេតនាចេតសិក ឯកគ្គតចេតសិក","ay"],[10,"១០ ជីវិតិន្រ្ទិយចេតសិក មនសិការចេតសិក","ay"],[11,"១១ មនសិការចេតសិក ចែកជា៣យ៉ាង","ay"],[12,"១២ ចែកសព្វចិត្តសាធារណចេតសិកដោយន័យផ្សេងៗ","ay"],[13,"១៣ វិតក្កចេតសិក ការត្រិះរិះ","ay"],[14,"១៤ វិចារចេតសិក ការពិចារណាអារម្មណ៍","ay"],[15,"១៥ អធិមោក្ខចេតសិក វីរិយាចេតសិក","ay"],[16,"១៦ សង្វេគវត្ថុ៨ បីតិចេតសិក","ay"],[17,"១៧ ឆន្ទចេតសិក សេចក្ដីឆ្អែតចិត្ត ឆន្ទៈមាន៣","ay"],[18,"១៨ មោហចេតសិក ការវង្វេងមិនដឹងការពិត","ay"],[19,"១៩ មោហចេតសិក ការមិនដឹងក្នុងខន្ធ អាយតន ធាតុ","ay"],[20,"២០ អហិរិក អនោត្តប្ប ឧទ្ធច្ចចេតសិក","ay"],[21,"២១ លោភចេតសិក ការជាប់ជំពាក","ay"],[22,"២២ ទិដ្ឋិចេតសិក ការយល់ខុសពីការពិត","ay"],[23,"២៣ ទិដ្ឋិចេតសិក ការួបរឹតដោយទិដ្ឋិ ១៦យ៉ាង","ay"],[24,"២៤ ទិដ្ឋិចេតសិក ហេតុនាំឲ្យកើតមិច្ឆាទិដ្ឋិមាន៥","ay"],[25,"២៥ ទិដ្ឋិចេតសិក និយតមិច្ឆាទិដ្ឋិ ទិដ្ឋិមានទោសធ្ងន់","ay"],[26,"២៦ ទិដ្ឋិចេតសិក អធិប្បាយមិច្ឆាទិដ្ឋិមាន៦២ប្រការ","ay"],[27,"២៧ មានចេតសិក ការលើកតម្កើងខ្លួន","ay"],[28,"២៨ មានចេតសិក ហេតុនាំឲ្យលើកតម្កើងខ្លួន","ay"],[29,"២៩ មានចេតសិក សេចក្តីស្រវឹងមាន ២៧ យ៉ាង","ay"],[30,"៣០ ទោសចេតសិក ការខឹងក្រោធ ឥស្សា ច្រណែន","ay"],[31,"៣១ មច្ឆរិយចេតសិក សេចក្ដីកំណាញ់មាន៥យ៉ាង","ay"],[32,"៣២ កុក្កុច្ចចេតសិក ការក្ដៅក្រហាយចិត្ត","ay"],[33,"៣៣ ថីនមិទ្ធចេតសិក ការរួញរា ងងុយងោកងក់","ay"],[34,"៣៤ វិចិកិច្ឆាចេតសិក ការសង្ស័យក្នុងព្រះរតនត្រ័យ","ay"],[35,"៣៥ សទ្ធាចេតសិក ការជ្រះថ្លា សទ្ធាមាន៤យ៉ាង","ay"],[36,"៣៦ សទ្ធាចេតសិក លក្ខណៈសំគាល់របស់អ្នកមានសទ្ធា៣យ៉ាង","ay"],[37,"៣៧ សតិចេតសិក ការរលឹកដឹង","ay"],[38,"៣៨ ហិរិ ការខ្មាសបាប គឺរង្កៀសទុច្ចរិត","ay"],[39,"៣៩ ឱត្តប្បចេតសិក ការខ្លាចបាប ឬខ្លាចទុច្ចរិត","ay"],[40,"៤០ អលោភចេតសិក អទោសចេតសិក","ay"],[41,"៤១ តត្រមជ្ឈត្តតាចេតសិក និងយុគលធម៌៣គូ","ay"],[42,"៤២ យុគលធម៌គូទី៤ ដល់ទី៦ និង ធម៌បដិបក្ខ","ay"],[43,"៤៣ វីរតិ ៣ សម្មាវាចា សម្ដីត្រូវ សម្មាកម្មន្ត ការងារត្រូវ","ay"],[44,"៤៤ វីរតិ ៣ សម្មាអាជីវៈ ការចិញ្ចឹមជីវិតត្រូវ","ay"],[45,"៤៥ អប្បមញ្ញាចេតសិក ២ គឺ ករុណា និងមុទិតា","ay"],[46,"៤៦ មេត្តា ឧបេក្ខា និងបញ្ញិន្រ្ទិយចេតសិក","ay"],[47,"៤៧ បញ្ញិន្រ្ទិយចេតសិក ការដឹង","ay"],[48,"៤៨ សម្បយោគន័យ វិតក្កៈ វិចារៈ អធិមោក្ខចេតសិក","ay"],[49,"៤៩ សម្បយោគន័យ វិរិយ វីតិ ឆន្ទចេតសិក","ay"],[50,"៥០ សម្បយោគន័យ អកុសលចេតសិក១៤ សោភណសាធារណ១៩","ay"],[51,"៥១ សម្បយោគន័យ ចែកចេតសិកជា២ គឺអនិយតយោគី និងនិយតយោគី","ay"],[52,"៥២ សង្គហន័យ ចែកលោកុត្តរជា ៥ ន័យ","ay"],[53,"៥៣ សង្គហន័យ ចែកមហគ្គតចិត្ត ២៧ និងមហាកុសល៨","ay"],[54,"៥៤ សង្គហន័យ ចែកកាមសោភណចិត្ត ២៤ ប្រកបនឹងចេតសិក","ay"],[55,"៥៥ សង្គហន័យ ចែកអកុសលចិត្ត អហេតុកចិត្តនិងចេតសិក","ay"],[56,"៥៦ តទុភយមិស្សកន័យ ការរួមចេតសិកដែលប្រកបរួមគ្នា","ay"],[57,"៥៧ រម្លឹកមេរៀនចេតសិកបរមត្ថភាគ ១ សម្បយោគន័យ","ay"],[58,"៥៨ រម្លឹកមេរៀនចេតសិកបរមត្ថភាគ ២ តទុភយមិស្សកន័យ","ay"]]},{"i":69,"t":"yon-yi","km":"ព្រះអភិធម្មបរិច្ឆេទទី3 (2025)","en":"Abhidhamma Chapter 3 (2025)","tp":["abhidhamma"],"L":[[1,"០១ រម្លឹកបរមត្ថធម៌៤","ay"],[2,"០២ និយមន័យវេទនា","ay"],[3,"០៣ ចែកវេទនាជា ៣ ប្រភេទ","ay"],[4,"០៤ វេទនា ២ និងវេទនា៣","ay"],[5,"០៥ ពន្យល់វេទនា៣តាមបិដកនិងដីកា","ay"],[6,"០៦ វេទនាសង្គហៈ ចែកវេទនា៣","ay"],[7,"០៧ វេទនាសង្គហៈ ចែកវេទនា៦ យ៉ាងបន្ត","ay"],[8,"០៨ វេទនាសង្គហៈ ចែកវេទនា១៨ និង១២យ៉ាង","ay"],[9,"០៩ វេទនាសង្គហៈ ចែក៩ តាមព្រះសូត្រ","ay"],[10,"១០ វេទនាសង្គហៈ ចែកវេទនាដោយអារម្មណានុភវលក្ខណន័យ","ay"],[11,"១១ វេទនាសង្គហៈ ចែកវេទនាដោយឥន្រ្ទិយនិងអារម្មណ៍៣","ay"],[12,"១២ វេទនាសង្គហៈ ចែកវេទនាដោយឥន្រ្ទិយមាន៥","ay"],[13,"១៣ វេទនាសង្គហៈ ចែកវេទនាដោយឥន្រ្ទិយ៥​ ជាបន្ត","ay"],[14,"១៤ ចែកវេទនាកើតរួមនឹងចេតសិក","ay"],[15,"១៥ ហេតុសង្គហៈ ផលធម៌កើតពីហេតុដូចម្តេច​","ay"],[16,"១៦ ហេតុសង្គហៈ ហេតុមាន ៤ យ៉ាង​","ay"],[17,"១៧ ហេតុសង្គហៈ ចែកសហេតុកចិត្តជា ៣","ay"],[18,"១៨ ហេតុសង្គហៈ ចែកហេតុ៦ដោយន័យផ្សេងៗ​","ay"],[19,"១៩ ហេតុសង្គហៈ ចែកហេតុ៦ ជាគហិតគហនន័យ","ay"],[20,"២០ ហេតុសង្គហៈ ចែកហេតុ៦ ជាគហិតគហនន័យ​ភាគបញ្ចប់","ay"],[21,"២១ កិច្ចសង្គហ និយមន័យកិច្ច១៤ យ៉ាង","ay"],[22,"២២ កិច្ចសង្គហ ពន្យល់ឃាយតនកិច្ចដល់ជវនកិច្ច","ay"],[23,"២៣ កិច្ចសង្គហ ពន្យល់ចិត្ត និងចេតសិកធ្វើកិច្ចតាមទ្វារ៣","ay"],[24,"២៤ កិច្ចសង្គហ បដិសន្ធិកិច្ចដល់ជវនកិច្ច","ay"],[25,"២៥ កិច្ចសង្គហ ជវនកិច្ច និងតទាលម្ពណកិច្ច","ay"],[26,"២៦ កិច្ចសង្គហ ចេតសិកធ្វើកិច្ច១៤","ay"],[27,"២៧ កិច្ចសង្គហ ឋានរបស់ចិត្តបដិសន្ធិស្ថាន/ ភិក្ខុអគ្គចិត្តោ យ៉ុន យី បរិច្ឆេទទី៣","ay"],[28,"២៨ ឋាន១០ ភវង្គស្ថានដល់សន្តីរណស្ថាន/ ភិក្ខុអគ្គចិត្តោ យ៉ុន យី បរិច្ឆេទទី៣","ay"],[29,"២៩ ឋាន១០ ជវនស្ថាន ដល់ចុតិស្ថានបញ្ចប់/ ភិក្ខុអគ្គចិត្តោ យ៉ុន យី បរិច្ឆេទទី៣","ay"],[30,"២៩ ទ្វារសង្គហ អង្គធម៌ទ្វារ៦ ចិត្តក្នុងទ្វារនិងក្រៅទ្វារ/ ភិក្ខុអគ្គចិត្តោ យ៉ុន យី បរិច្ឆេទទី៣","ay"],[31,"៣១ ទ្វារសង្គហ ចែកចិត្តកើតតាមទ្វារទាំង៦/ ភិក្ខុអគ្គចិត្តោ យ៉ុន យី បរិច្ឆេទទី៣","ay"],[32,"៣២ ទ្វារសង្គហ ចែកចេតសិកកើតតាមទ្វារ៦/ ភិក្ខុអគ្គចិត្តោ យ៉ុន យី បរិច្ឆេទទី៣","ay"],[33,"៣៣ ទ្វារសង្គហ ចែកចេតសិកកើតតាមទ្វារ៦បញ្ចប់/ ភិក្ខុអគ្គចិត្តោ យ៉ុន យី បរិច្ឆេទទី៣","ay"],[34,"៣៤ អារម្មណសង្គហ ចែកអង្គធម៌របស់អារម្មណ៍៦/ ភិក្ខុអគ្គចិត្តោ យ៉ុន យី បរិច្ឆេទទី៣","ay"],[35,"៣៥ អារម្មណសង្គហ សាមញ្ញអារម្មណ៍ អធិបតីអារម្មណ៍/ ភិក្ខុអគ្គចិត្តោ យ៉ុន យី បរិច្ឆេទទី៣","ay"],[36,"៣៦ អារម្មណសង្គហ ចែកទ្វារិកចិត្តនឹងអារម្មណ៍៦/ ភិក្ខុអគ្គចិត្តោ យ៉ុន យី បរិច្ឆេទទី៣","ay"],[37,"៣៧ អារម្មណសង្គហ ពន្យល់កម្មារម្មណ៍របស់ទ្វារវិមុត្តិ/ ភិក្ខុអគ្គចិត្តោ យ៉ុន យី បរិច្ឆេទទី៣","ay"],[38,"៣៨ អារម្មណសង្គហ កម្មារម្មណ៍ កម្មនិមិត្តារម្មណ៍ គតិនិមិត្ត/ ភិក្ខុអគ្គចិត្តោ យ៉ុន យី បរិច្ឆេទទី៣","ay"],[39,"៣៩ អារម្មណសង្គហ សង្ខេបអារម្មណ៍ជា៤ប្រភេទ/ ភិក្ខុអគ្គចិត្តោ យ៉ុន យី បរិច្ឆេទទី៣","ay"],[40,"៤០ អារម្មណសង្គហ ចិត្តដឹងមហគ្គតារម្មណ៍ប្រាកដ/ ភិក្ខុអគ្គចិត្តោ យ៉ុន យី បរិច្ឆេទទី៣","ay"],[41,"៤១ អារម្មណសង្គហ ចិត្តដឹងនូវកាមារម្មណ៍","ay"],[42,"៤២ អារម្មណសង្គហ មហគ្គតារម្មណ៍ និព្វានារម្មណ៍","ay"],[43,"៤៣ អារម្មណសង្គហ នាមារម្មណ៍ អតីតារម្មណ៍","ay"],[44,"៤៤ អារម្មណសង្គហ បច្ចុប្បន្ន អនាគត កាលវិមុត្តារម្មណ៍/ ភិក្ខុអគ្គចិត្តោ យ៉ុន បរិច្ឆេទទី៣","ay"],[45,"៤៥ អារម្មណសង្គហ បញ្ញត្យារម្មណ៍ បរមត្ថារម្មណ៍/ ភិក្ខុអគ្គចិត្តោ យ៉ុន បរិច្ឆេទទី៣","ay"],[46,"៤៦ អារម្មណសង្គហ អជ្ឈត្ត ពហិទ្ធ អជ្ឈត្តពិហទ្ធ/ ភិក្ខុអគ្គចិត្តោ យ៉ុន បរិច្ឆេទទី៣","ay"],[47,"៤៧ អារម្មណសង្គហ រូប សទ្ទារម្មណ៍ គន្ធារម្មណ៍/ ភិក្ខុអគ្គចិត្តោ យ៉ុន បរិច្ឆេទទី៣","ay"],[48,"៤៨ អារម្មណសង្គហ រសារម្មណ៍ ផោដ្ឋព្វ ធម្មារម្មណ៍/ ភិក្ខុអគ្គចិត្តោ យ៉ុន បរិច្ឆេទទី៣","ay"],[49,"៤៩ អារម្មណសង្គហ ចិត្តទទួលអារម្មណ៍តិចនិងច្រើន/ ភិក្ខុអគ្គចិត្តោ យ៉ុន បរិច្ឆេទទី៣","ay"],[50,"៥០ អារម្មណសង្គហ ចេតសិក៥២ដឹងអារម្មណ៍២១/ ភិក្ខុអគ្គចិត្តោ យ៉ុន បរិច្ឆេទទី៣","ay"],[51,"៥១ អារម្មណសង្គហ ចេតសិក៥២ដឹងកាលវិមុត្ត និងដល់បរមត្ថ","ay"],[52,"៥២ អារម្មណសង្គហ ចេតសិក៥២ដឹងអជ្ឈត្តដល់ធម្មារម្មណ៍","ay"],[53,"៥៣ វត្ថុសង្គហ ចែកវិញ្ញាណ ៧ ក្នុងភូមិនីមួយៗ","ay"],[54,"៥៤ វត្ថុសង្គហ ចែកចិត្តនិងចេតសិកវត្ថុនិងទ្វារ (ក្នុងដាក់លេខ ៥៦)","ay"],[55,"៥៥ រម្លឹកមេរៀនបរិច្ឆេទទី៥ និងបញ្ចប់បរិច្ឆេទទី៣","ay"]]},{"i":70,"t":"yon-yi","km":"ព្រះអភិធម្មបរិច្ឆេទទី4 (2025)","en":"Abhidhamma Chapter 4 (2025)","tp":["abhidhamma"],"L":[[1,"០១ ចែកឆក្កៈចែក ៦ យ៉ាង ថ្ងៃបើកវគ្គថ្មី/ភិក្ខុអគ្គចិត្តោ យ៉ុន យី​ បរិច្ឆេទទី៤","ay"],[2,"០២ អារម្មណ៍៤ តាមបញ្ចទ្វារ និងមនោទ្វារ/ភិក្ខុអគ្គចិត្តោ យ៉ុន យី​ បរិច្ឆេទទី៤","ay"],[3,"០៣ ហេតុនាំឱ្យកើតមនោទ្វារមាន ១៤ យ៉ាង/ភិក្ខុអគ្គចិត្តោ យ៉ុន យី​ បរិច្ឆេទទី៤","ay"],[4,"០៤ ចែកចិត្តនិងបុគ្គល និងភូមិទាំង ៣១/ភិក្ខុអគ្គចិត្តោ យ៉ុន យី​ បរិច្ឆេទទី៤","ay"],[5,"០៥ ចែកវិថីចិត្តជា ២ គឺកាមវិថី និងអប្បនាមវិថី/ភិក្ខុអគ្គចិត្តោ យ៉ុន យី​ បរិច្ឆេទទី៤","ay"],[6,"០៦ ឧបមាវិថីចិត្តរបស់បញ្ចទ្វារមាន ១៧​ ខណៈ","ay"],[7,"០៧ សិក្សាឧបមាវិថីចិត្ត និងចក្ខុបសាទ៣","ay"],[8,"០៨ ចក្ខុទ្វារិកអតិមហន្តារម្មណ៍ប្រភេទទី១","ay"],[9,"០៩ អតិមហន្តារម្មណប្រភេទទី១ បន្តចប់","ay"],[10,"១០ អតិមហន្តារម្មណប្រភេទទី២ ដល់ទី៥","ay"],[11,"១១ អតិមហន្តារម្មណប្រភេទទី៥ និងមានវិថីមានអាគន្តុក","ay"],[12,"១២ ពន្យល់បរិកប្ប ២ ទាក់ទងនឹង៥ ចំណុច","ay"],[13,"១៣ បញ្ចប់អតិមហន្តារម្មណ៍បន្តមហន្តារម្មណ៍ប្រភេទទី១","ay"],[14,"១៤ មហន្តារម្មណ៍ប្រភេទទី១ដល់ទី៤","ay"],[15,"១៥ មហន្តារម្មណ៍ប្រេភេទទី៤ ដល់ទី៦ចប់/ភិក្ខុអគ្គចិត្តោ យ៉ុន យី​ បរិច្ឆេទទី៤","ay"],[16,"១៦ បរិត្តារម្មណ៍មាន ៦ ប្រភេទបញ្ចប់/ភិក្ខុអគ្គចិត្តោ យ៉ុន យី​ បរិច្ឆេទទី៤","ay"],[17,"១៧ អតិបរិត្តារម្មណ៍ អារម្មណ៍តូចបំផុតមាន៦ឬ៧យ៉ាង/ភិក្ខុអគ្គចិត្តោ យ៉ុន យី​ បរិច្ឆេទទី៤","ay"],[18,"១៨ មិស្សកមនោទ្វារវិថី និយមមនោទ្វារមាន៤ យ៉ាង/ភិក្ខុអគ្គចិត្តោ យ៉ុន យី​ បរិច្ឆេទទី៤","ay"],[19,"១៩ មិស្សកមនោទ្វារវិថី ចែកវិថីចិត្តនិងចិត្តក្នុងបរិច្ឆេទទី៣/ភិក្ខុអគ្គចិត្តោ យ៉ុន យី​ បរិច្ឆេទទី៤","ay"],[20,"២០ មិស្សកមនោទ្វារវិថី អតីតគណហណៈប្រភេទី១ទី២/ភិក្ខុអគ្គចិត្តោ យ៉ុន យី​ បរិច្ឆេទទី៤","ay"],[21,"២១ មិស្សកមនោទ្វារវិថី អតីតគណហណៈប្រភេទី៣ទី៥/ភិក្ខុអគ្គចិត្តោ យ៉ុន យី​ បរិច្ឆេទទី៤","ay"],[22,"២២ មិស្សកមនោទ្វារវិថី សមូហគណហណៈប្រភេទី១ទី៥/ភិក្ខុអគ្គចិត្តោ យ៉ុន យី​ បរិច្ឆេទទី៤","ay"],[23,"២៣ មិស្សកមនោទ្វារវិថី អត្ថគ្គហណវិថីប្រភេទទី១/ភិក្ខុអគ្គចិត្តោ យ៉ុន យី​ បរិច្ឆេទទី៤","ay"],[24,"២៤ មិស្សកមនោទ្វារវិថី អត្ថគ្គហណវិថី៣ ប្រភេទ/ភិក្ខុអគ្គចិត្តោ យ៉ុន យី​ បរិច្ឆេទទី៤","ay"],[25,"២៥ បញ្ចប់មិស្សកមនោទ្វារ អត្ថគ្គហណវិថី នាមគ្គហណវិថិ/ភិក្ខុអគ្គចិត្តោ យ៉ុន យី​ បរិច្ឆេទទី៤","ay"],[26,"២៦ អតិវិភូតារម្មណ៍មានអតីតភវង្គ១ដល់៥ /ភិក្ខុអគ្គចិត្តោ យ៉ុន យី​ បរិច្ឆេទទី៤","ay"],[27,"២៧ អតិវិភូតារម្មណ៍មាន៣៦ ប្រភេទបញ្ចប់ /ភិក្ខុអគ្គចិត្តោ យ៉ុន យី​ បរិច្ឆេទទី៤","ay"],[28,"២៨ អតិវិភូតារម្មណ៍មិនមានអតីតភវង្គប្រភេទទី១/ភិក្ខុអគ្គចិត្តោ យ៉ុន យី​ បរិច្ឆេទទី៤","ay"],[29,"២៩ អតិវិភូតារម្មណ៍មិនមានអតីតភវង្គប្រភេទទី២ទី៣/ភិក្ខុអគ្គចិត្តោ យ៉ុន យី​ បរិច្ឆេទទី៤","ay"],[30,"៣០ អតិវិភូតារម្មណ៍មិនមានអតីតភវង្គប្រភេទទី៣ទី៤/ភិក្ខុអគ្គចិត្តោ យ៉ុន យី​ បរិច្ឆេទទី៤","ay"],[31,"៣១ អតិវិភូតារម្មណ៍មិនមានអតីតភវង្គប្រភេទទី៤ទី៥/ភិក្ខុអគ្គចិត្តោ យ៉ុន យី​ បរិច្ឆេទទី៤","ay"],[32,"៣២ វិភូតារម្មណ៍មិនមានអតីតភវង្គកាមជវន១៤ ប្រភេទ/ភិក្ខុអគ្គចិត្តោ យ៉ុន យី​ បរិច្ឆេទទី៤","ay"],[33,"៣៣ វិភូតារម្មណ៍មិនមានអតីតភវង្គប្រភេទទី១/ភិក្ខុអគ្គចិត្តោ យ៉ុន យី​ បរិច្ឆេទទី៤","ay"],[34,"៣៤ អវិភូតារម្មណ៍ និងអតិអវិភូតារម្មណ៍/ភិក្ខុអគ្គចិត្តោ យ៉ុន យី​ បរិច្ឆេទទី៤","ay"],[35,"៣៥ សុបិនមនោទ្វារវិថីមាន ១២ ប្រភេទ/ភិក្ខុអគ្គចិត្តោ យ៉ុន យី​ បរិច្ឆេទទី៤","ay"],[36,"៣៦ អប្បនាជវនវារៈ វិថីចិត្តមុនសម្រេចអប្បនាឈាន/ភិក្ខុអគ្គចិត្តោ យ៉ុន យី​ បរិច្ឆេទទី៤","ay"],[37,"៣៧ អប្បនាជវនវារៈ អាទិកម្មិកឈានវិថី ឈានសមាបត្តិវិថី /ភិក្ខុអគ្គចិត្តោ យ៉ុន យី​ បរិច្ឆេទទី៤","ay"],[38,"៣៨ អប្បនាជវនវារៈ ឈានសមាបត្តិ បាទកឈាន អភិញ្ញាវិថី /ភិក្ខុអគ្គចិត្តោ យ៉ុន យី​ បរិច្ឆេទទី៤","ay"],[39,"៣៩ អប្បនាជវនវារៈ លោកិយអភិញ្ញា ឥទ្ធិ១០យ៉ាង/ភិក្ខុអគ្គចិត្តោ យ៉ុន យី​ បរិច្ឆេទទី៤","ay"],[40,"៤០ អប្បនាជវនវារៈ អភិញ្ញា លោកិយអភិញ្ញាមានទិព្វចក្ខុជាដើម /ភិក្ខុអគ្គចិត្តោ យ៉ុន យី​ បរិច្ឆេទទី៤","ay"],[41,"៤១ មគ្គវិថី សោតាបត្តិមគ្គដល់អរហត្តមគ្គ /ភិក្ខុអគ្គចិត្តោ យ៉ុន យី​ បរិច្ឆេទទី៤","ay"],[42,"៤២ ផលសមាបត្តិវិថី និងនិរោធសមាបត្តិវិថី/ភិក្ខុអគ្គចិត្តោ យ៉ុន យី​ បរិច្ឆេទទី៤","ay"],[43,"៤៣ បញ្ចប់និរោធសមាបត្តិ និងចូលមរណាសន្នវិថី/ភិក្ខុអគ្គចិត្តោ យ៉ុន យី​ បរិច្ឆេទទី៤","ay"],[44,"៤៤ មរណាសន្នវិថី ការស្លាប់ដោយហេតុ៤ យ៉ាង/ភិក្ខុអគ្គចិត្តោ យ៉ុន យី​ បរិច្ឆេទទី៤","ay"],[45,"៤៥ មរណាសន្នវិថី ការស្លាប់តាមបញ្ចទ្វារ/ភិក្ខុអគ្គចិត្តោ យ៉ុន យី​ បរិច្ឆេទទី៤","ay"],[46,"៤៦ មរណាសន្នវិថី ការស្លាប់តាមមនោទ្វារ៤ យ៉ាង/ភិក្ខុអគ្គចិត្តោ យ៉ុន យី​ បរិច្ឆេទទី៤","ay"],[47,"៤៧ មរណាសន្នវិថី បរិនិព្វានធម្មតា និងឈានសមនន្តរវិថី/ភិក្ខុអគ្គចិត្តោ យ៉ុន យី​ បរិច្ឆេទទី៤","ay"],[48,"៤៨ បរិនិព្វានវិថីពិសេស បច្ចវេក្ខណសមន្តរ អភិញ្ញា ជីវិតសមសីសី/ភិក្ខុអគ្គចិត្តោ យ៉ុន យី​ បរិច្ឆេទទី៤","ay"],[49,"៤៩ តទាលម្ពណនិយម អារម្មណ៍ ៣ យ៉ាងរបស់តទា","ad"],[50,"៥០ តទាលម្ពណនិយម មិនកើតដោយហេតុ១១ យ៉ាងបន្ត","ad"],[51,"៥១ បញ្ចប់តទាលម្ពននិយមចូលជវននិយម","ad"],[52,"៥២ ជវននិយម និងចែកបុគ្គល១២ ពួក","ad"],[53,"៥៣ ចែកបុគ្គលជា១២ ពួកនិងភូមិ៣","ad"],[54,"៥៤ រូបវិថីចិត្តជ្ជកលាបកើតឡើងមាន១៥៣ កលាប","ad"],[55,"៥៥ រូបវិថីកម្មបច្ចយឧតុជ្ជកលាប ឧតុកើតពីកម្ម","ad"],[56,"៥៦ រូបវិថី ចិត្តប្បយឧតុជ្ជរូប ឧតុបច្ចយឧតុជ្ជរូប ភិក្ខុអគ្គចិត្តោ យ៉ុន យី​ បរិច្ឆេទទី៤-2026-08-06 19 28 51(copy)","ad"],[57,"៥៧ រូបវិថី ឧតុបច្ចយឧតុជ្ជរូប ជារូបកើតពីកម្មនិងចិត្ត ភិក្ខុអគ្គចិត្តោ យ៉ុន យី​ បរិច្ឆេទទី៤-2026-08-06 22 06 32(copy)-2026-08-07 13 33 49(copy)","ad"],[58,"៥៨ រូបវិថី តារាងទី២ ជីវិតនកកលាប ភិក្ខុអគ្គចិត្តោ យ៉ុន យី​ បរិច្ឆេទទី៤","ad"],[59,"៥៩ រូបវិថី តារាងទី៣ អាហារជ្ជរូប តារាងទី៤ ចក្ខ្វាទិចតុក្ក ភិក្ខុអគ្គចិត្តោ យ៉ុន យី​ បរិច្ឆេទទី៤-2026-08-09 10 01 50(copy)-2026-08-09 14 26 27(copy)","ad"],[60,"៦០ រូបវិថី តារាងទី៥ និងទី៦ បញ្ចទ្វារវិថីនិងនិរោធសមាបត្តិ ភិក្ខុអគ្គចិត្តោ យ៉ុន យី​ បរិច្ឆេទទី៤-2026-08-14 11 30 48(copy)","ad"],[61,"៦១ រូបវិថី តារាងទី៦និងទី៧ ចូលនិរោធ ចេញពីនិរោធ","ad"],[62,"៦២ រូបវិថី តារាងទី៨ បញ្ចទ្វារមរណាសន្នវិថី","ad"],[63,"៦៣ រូបវិថី តារាងទី៩ ស្លាប់តាមមនោទ្វារ តារាងទី១០","ad"]]},{"i":71,"t":"yon-yi","km":"ព្រះអភិធម្មបរិច្ឆេទទី5 (2026)","en":"Abhidhamma Chapter 5 (2026)","tp":["abhidhamma"],"L":[[1,"០១_និយមន័យ_អបាយភូមិភិក្ខុអគ្គចិត្តោ_យ៉ុន_យី_បរិច្ឆេទទី៥","d"],[2,"០២_ភូមិចតុក្កៈ_សញ្ជីវនរក_កាឡសុត្តនរកភិក្ខុអគ្គចិត្តោ_យ៉ុន_យី_បរិច្ឆេទទី៥","d"],[3,"០៣_ភូមិចតុក្កៈ_រោរុវនរក_ដល់អវីចិនរកភិក្ខុអគ្គចិត្តោ_យ៉ុន_យី_បរិច្ឆេទទី៥","d"],[4,"០៤_ភូមិចតុក្កៈ_បាបកម្មនាំឱ្យកើតអវីចិនរកជាដើមភិក្ខុអគ្គចិត្តោ_យ៉ុន","d"]]},{"i":72,"t":"yon-yi","km":"ព្រះអភិធម្មបរិច្ឆេទទី6 (2024)","en":"Abhidhamma Chapter 6 (2024)","tp":["abhidhamma"],"L":[[1,"០១ និយមន័យរូប ពាក្យថា រូបក្ខន្ធ/ ភិក្ខុអគ្គចិត្តោ យ៉ុន យី រូបបរមត្ថ","y"],[2,"០២ និយមន័យរូប ៧ ន័យ និងវចនត្ថៈរបស់រូប/ ភិក្ខុអគ្គចិត្តោ យ៉ុន យី រូបបរមត្ថ បរិច្ឆេទទី៦","y"],[3,"០៣ រូប ២៨ ២ពួកធំ និងចែកជា ៥ យ៉ាង/ ភិក្ខុអគ្គចិត្តោ យ៉ុន យី រូបបរមត្ថ បរិច្ឆេទទី៦","y"],[4,"០៤ មហាភូត ដោយហេតុ ៥ យ៉ាង/ ភិក្ខុអគ្គចិត្តោ យ៉ុន យី រូបបរមត្ថ បរិច្ឆេទទី៦","y"],[5,"០៥ មហាភូតរូបដោយហេតុ៥ យ៉ាងបន្ត/ ភិក្ខុអគ្គចិត្តោ យ៉ុន យី រូបបរមត្ថ","y"],[6,"០៦ មហាភូតរូបន័យទី ៤ និងន័យទី ៥/ ភិក្ខុអគ្គចិត្តោ យ៉ុន យីបរិច្ឆេទទី៦","y"],[7,"០៧ ភូតមាន ៧ ន័យ មានភូតបានដល់ព្រះអហរន្តជាដើម/ ភិក្ខុអគ្គចិត្តោ យ៉ុន យី បរិច្ឆេទទី៦","y"],[8,"០៨ បឋវីធាតុ បឋវីធាតុចែកជា ៤ យ៉ាង/ ភិក្ខុអគ្គចិត្តោ យ៉ុន យី បរិច្ឆេទទី៦","y"],[9,"០៩ អាបោធាតុ ធាតុដី តេជោធាតុ ធាតភ្លើង/ ភិក្ខុអគ្គចិត្តោ យ៉ុន យី បរិច្ឆេទទី៦","y"],[10,"១០ តេជោធាតុ ៤ យ៉ាង និងវាយធាតុ ៦ យ៉ាង/ ភិក្ខុអគ្គចិត្តោ យ៉ុន យី បរិច្ឆេទទី៦","y"],[11,"១១ ឧបមាធាតុ ៤ ដូចជាអាសិរពិស ៤ និងពេជ្ឈឃាត/ ភិក្ខុអគ្គចិត្តោ យ៉ុន យី បរិច្ឆេទទី៦","y"],[12,"១២ ឧបមាធាតុ ៤ ពេជ្ឈឃាតគម្រប់៥ ពេជ្ឈឃាតគ្រប់៦/ ភិក្ខុអគ្គចិត្តោ យ៉ុន យី បរិច្ឆេទទី៦","y"],[13,"១៣ ចក្ខុបសាទរូប ចែកជា ២ មំសំចក្ខុ បញ្ញាចក្ខុ/ ភិក្ខុអគ្គចិត្តោ យ៉ុន យី បរិច្ឆេទទី៦","y"],[14,"១៤ ចក្ខុបសាទរូប បញ្ញាចក្ខុ ៥ យ៉ាង និងចក្ខុចែកជា១៣ យ៉ាង/ ភិក្ខុអគ្គចិត្តោ យ៉ុន យី បរិច្ឆេទទី៦","y"],[15,"១៥ សោតបសាទរូប ឃានបសាទរូប/ ភិក្ខុអគ្គចិត្តោ យ៉ុន យី បរិច្ឆេទទី៦","y"],[16,"១៦ ជិវ្ហាបសាទ​ កាយបសាទរូប/ ភិក្ខុអគ្គចិត្តោ យ៉ុន យី បរិច្ឆេទទី៦","y"],[17,"១៧ កាយបសាទ និងរូបារម្មណ៍ គឺវណ្ណៈ ពណ៌/ ភិក្ខុអគ្គចិត្តោ យ៉ុន យី បរិច្ឆេទទី៦","y"],[18,"១៨ សទ្ទារម្មណ៍​ សំឡេង គន្ធារម្មណ៍ ក្លិន/ ភិក្ខុអគ្គចិត្តោ យ៉ុន យី បរិច្ឆេទទី៦","y"],[19,"១៩ គន្ធារម្មណ៍ រសារម្មណ៍ ផោដ្ឋព្វារម្មណ៍/ ភិក្ខុអគ្គចិត្តោ យ៉ុន យី បរិច្ឆេទទី៦","y"],[20,"២០ ភាវរូប ២ និងហទយវត្ថុ/ ភិក្ខុអគ្គចិត្តោ យ៉ុន យី បរិច្ឆេទទី៦","y"],[21,"២១ ហទយវត្ថុរូប បេះដូង ទឹកឈាមមានពណ៌ ៦ យ៉ាង/ ភិក្ខុអគ្គចិត្តោ យ៉ុន យី បរិច្ឆេទទី៦","y"],[22,"២២ ជីវិតរូប ការអនុបាលនូវសហជាតរូបឱ្យតាំងនៅ/ ភិក្ខុអគ្គចិត្តោ យ៉ុន យី បរិច្ឆេទទី៦","y"],[23,"២៣ អាហាររូប រូបដែលជាអាហារចិញ្ចឹមរាងកាយ/ ភិក្ខុអគ្គចិត្តោ យ៉ុន យី បរិច្ឆេទទី៦","y"],[24,"២៤ អាហាររូប និងបរិច្ឆេទរូប/ ភិក្ខុអគ្គចិត្តោ យ៉ុន យី បរិច្ឆេទទី៦","y"],[25,"២៥ វិញ្ញត្តិរូប ២ កាយវិញ្ញត្តិការកម្រើកកាយ/ ភិក្ខុអគ្គចិត្តោ យ៉ុន យី បរិច្ឆេទទី៦","y"],[26,"២៦ វិញ្ញត្តិរូប ២ វចីវិញ្ញត្តិរូប ការកម្រើកវាចា/ ភិក្ខុអគ្គចិត្តោ យ៉ុន យី បរិច្ឆេទទី៦","y"],[27,"២៧ វិញ្ញត្តិរូប ២ ចិត្តដែលញុំាងវិញ្ញត្តិរូបឱ្យកើត/ ភិក្ខុអគ្គចិត្តោ យ៉ុន យី បរិច្ឆេទទី៦","y"],[28,"២៨ វិការរូប ៣ រូបលហុតា រូបមុទុតា រូបកម្មញ្ញតា/ ភិក្ខុអគ្គចិត្តោ យ៉ុន យី បរិច្ឆេទទី៦","y"],[29,"២៩ លក្ខណរូប ឧបចយរូប សន្តតិរូប/ ភិក្ខុអគ្គចិត្តោ យ៉ុន យី បរិច្ឆេទទី៦","y"],[30,"៣០ លក្ខណរូប ៤ ជរតារូប រូបចាស់គ្រាំគ្រា/ ភិក្ខុអគ្គចិត្តោ យ៉ុន យី បរិច្ឆេទទី៦","y"],[31,"៣១ លក្ខណរូប ៤ ជរាមាន ២យ៉ាង និងអនិច្ចតារូប/ ភិក្ខុអគ្គចិត្តោ យ៉ុន យី បរិច្ឆេទទី៦","y"],[32,"៣២ ចែករូបជាសាសវៈ សង្ខតៈ លោកិយ និងកាមាវចរ/ ភិក្ខុអគ្គចិត្តោ យ៉ុន យី បរិច្ឆេទទី៦","y"],[33,"៣៣ ចែករូបជាឯកវិធន័យចប់ចូលអជ្ឈត្តិក និងពហិទ្ធរូប/ ភិក្ខុអគ្គចិត្តោ យ៉ុន យី បរិច្ឆេទទី៦","y"],[34,"៣៤ ទុកន័យ វត្ថុរូប ទ្វាររូប ឥន្រ្ទិយរូបឱឡារិករូប/ ភិក្ខុអគ្គចិត្តោ យ៉ុន យី បរិច្ឆេទទី៦","y"],[35,"៣៥ ទុកន័យ សប្បដិឃរូប សនិទស្សនរូប គោរចរគាហិក/ ភិក្ខុអគ្គចិត្តោ យ៉ុន យី បរិច្ឆេទទី៦","y"],[36,"៣៦ រូបន័យទី ៣ រូបសមុដ្ឋាន មាន៤/ ភិក្ខុអគ្គចិត្តោ យ៉ុន យី បរិច្ឆេទទី៦","y"],[37,"៣៧ រូបន័យទី ៣ កម្មជ្ជរូប រូបកើតកម្ម១៨/ ភិក្ខុអគ្គចិត្តោ យ៉ុន យី បរិច្ឆេទទី៦","y"],[38,"៣៨ រូបន័យទី ៣ ពន្យល់កម្មជ្ជរូប និងចិត្តជ្ជរូបសាមញ្ញ/ ភិក្ខុអគ្គចិត្តោ យ៉ុន យី បរិច្ឆេទទី៦","y"],[39,"៣៩ រូបន័យទី ៣ ពន្យល់កម្មជ្ជរូប និងចិត្តជ្ជរូបសាមញ្ញ/ ភិក្ខុអគ្គចិត្តោ យ៉ុន យី បរិច្ឆេទទី៦","y"],[40,"៤០ ឧតុជ្ជរូប រូបកើតពីឧតុ និងអាហារជ្ជរូប រូបកើតពីអាហារ/ ភិក្ខុអគ្គចិត្តោ យ៉ុន យី បរិច្ឆេទទី៦","y"],[41,"៤១ សិក្សាសមុដ្ឋានិករូប រូបកើតពីសមុដ្ឋានទាំង ៤/ ភិក្ខុអគ្គចិត្តោ យ៉ុន យី បរិច្ឆេទទី៦","y"],[42,"៤២ ចែកកោដ្ឋាស ៤២ ដោយសមុដ្ឋាន ៤/ ភិក្ខុអគ្គចិត្តោ យ៉ុន យី បរិច្ឆេទទី៦","y"],[43,"៤៣ រូបកលាបន័យទី៣ កម្មជ្ជកលាបមាន ៩ កលាប/ ភិក្ខុអគ្គចិត្តោ យ៉ុន យី បរិច្ឆេទទី៦","y"],[44,"៤៤ រូបកលាបន័យទី៣ ចិត្តជ្ជកលាបមាន ៩ កលាប/ ភិក្ខុអគ្គចិត្តោ យ៉ុន យី បរិច្ឆេទទី៦","y"],[45,"៤៥ រូបកលាបន័យទី៣ ឧតុជ្ជកលាបមាន ៦ កលាប/ ភិក្ខុអគ្គចិត្តោ យ៉ុន យី បរិច្ឆេទទី៦","y"],[46,"៤៦ រូបកលាបន័យទី៣ អាហារជ្ជកលាបមាន ២ កលាប/ ភិក្ខុអគ្គចិត្តោ យ៉ុន យី បរិច្ឆេទទី៦","y"],[47,"៤៧ រូបកលាបន័យទី៣ ចែកសសម្ភា៤២ ជារូបកលាប/ ភិក្ខុអគ្គចិត្តោ យ៉ុន យី បរិច្ឆេទទី៦","y"],[48,"៤៨ រូបបវត្តិក្កមន័យទី៤ ចែករូបតាមភូមិ២៧ភូមិ/ ភិក្ខុអគ្គចិត្តោ យ៉ុន យី បរិច្ឆេទទី៦","y"],[49,"៤៩ រូបបវត្តិក្កមន័យទី៤ ចែករូបដោយសមុដ្ឋានតាមភូមិ៣/ ភិក្ខុអគ្គចិត្តោ យ៉ុន យី បរិច្ឆេទទី៦","y"],[50,"៥០ រូបបវត្តិក្កមន័យទី៤ ចែករូបតាមកាល៣ មានបដិសន្ធិកាលជាដើម/ ភិក្ខុអគ្គចិត្តោ យ៉ុន យី បរិច្ឆេទទី៦","y"],[51,"៥១ រូបបវត្តិក្កមន័យទី៤ ចែករូបតាមកាល៣ មានបដិសន្ធិកាលជាដើម/ ភិក្ខុអគ្គចិត្តោ យ៉ុន យី បរិច្ឆេទទី៦","y"],[52,"៥២ រូបបវត្តិក្កមន័យទី៤ ចែករូបដោយកំណើត៣/ ភិក្ខុអគ្គចិត្តោ យ៉ុន យី បរិច្ឆេទទី៦","y"],[53,"៥៣ និព្វានបរមត្ថ និយមន័យនិព្វាន និព្វាននៅឯណា?/ ភិក្ខុអគ្គចិត្តោ យ៉ុន យី បរិច្ឆេទទី៦","y"],[54,"៥៤ និព្វានបរមត្ថ ព្រះនិព្វានមាន ១៤៣ ពាក្យបញ្ចប់បរិច្ឆេទទី៦/ ភិក្ខុអគ្គចិត្តោ យ៉ុន យី បរិច្ឆេទទី៦","y"],[55,"៥៥ ថ្ងៃប្រឡងបិទវគ្គបញ្ចប់បរិច្ឆេទទី៦ រូបនិងនិព្វាន/ ភិក្ខុអគ្គចិត្តោ យ៉ុន យី បរិច្ឆេទទី៦","y"]]},{"i":73,"t":"yon-yi","km":"ព្រះអភិធម្មបរិច្ឆេទទី1 (2023)","en":"Abhidhamma Chapter 1 (2023)","tp":["abhidhamma"],"L":[[1,"០២ ប្រយោជន៍នៃការសិក្សាព្រះអភិធម្ម","ay"],[2,"០៣ និយមន័យ ពាក្យថា អភិធម្ម","ay"],[3,"០៤ និយមន័យ បរមត្ថធម៌","ay"],[4,"០៥ លក្ខណៈប្រចាំ២គឺសាមញ្ញលក្ខណ វិសេសលក្ខណៈ","ay"],[5,"០៦ ព្រះអង្គសម្តែងសម្មតិសច្ចៈដោយហេតុ៨","ay"],[6,"០៧ និយមន័យរបស់ចិត្តបរមត្ថ","ay"],[7,"០៨ វេវចនៈរបស់ចិត្តមាន១០ យ៉ាង","ay"],[8,"០៩ អំណាចរបស់ចិត្ត","ay"],[9,"១០ ពន្យល់គាថាសម្តែងអំពីចិត្តជាប្រធាន","ay"],[10,"11 ពាក្យថា អកុសលចិត្ត","ay"],[11,"12 លោភមូលចិត្តដួងទី ១","ay"],[12,"13 លោភមូលចិត្តដួងទី ១ ,២","ay"],[13,"14 លោភមូលចិត្តដួងទី ៣","ay"],[14,"15 មានះ មាន៩ យ៉ាងមេរៀនលោភដួងទី៣","ay"],[15,"16 លោភមូលចិត្តដួងទី៤​,៥​ ៦","ay"],[16,"17 លោភមូលចិត្តដួងទី ៧ ទី ៨","ay"],[17,"18 ហេតុនាំឱ្យកើតលោភមូលចិត្តមាន៤","ay"],[18,"19 ហេតុនាំឱ្យកើតទិដ្ឋិគតសម្បយុត្តចិត្ត","ay"],[19,"20 ហេតុនាំឱ្យកើតទិដ្ឋិគតវិប្បយុត្តចិត្ត","ay"],[20,"21 ហេតុនាំឱ្យកើតសោមនស្សនិងឧបេក្ខា","ay"],[21,"22 វិធីសង្កេតលោភមូលចិត្ត","ay"],[22,"23 ចែកលោភមូលចិត្តដោហេតុដល់កិច្ច","ay"],[23,"24 ចែកលោភមូលចិត្តដោន័យផ្សេងបញ្ចប់","ay"],[24,"25 និយមន័យទោសមូលចិត្ត","ay"],[25,"26 លក្ខណាទិចតុក្កៈរបស់ទោសៈ","ay"],[26,"27 ហេតុនាំឱ្យកើតទោសមូលចិត្តមាន៤","ay"],[27,"28 វិធីចម្រើនមេត្តាចិត្ត","ay"],[28,"29 ផ្សាយមេត្តាទៅកាន់បុគ្គលផ្សេងតាមលំដាប់","ay"],[29,"30 មេត្តសូត្រ សម្តែងរឿងភិក្ខុចម្រើនមេត្តា","ay"],[30,"31 មេត្តសូត្រ អធិប្បាយតាមអដ្ឋកថាបិដក៥៤","ay"],[31,"32 ពិចារណាកម្មដើម្បីលះបង់ទោសមូលចិត្ត","ay"],[32,"33 ការពិចារណាពុទ្ធោវាទដើម្បីលះទោសៈ","ay"],[33,"34 អានិសង្សនៃការចម្រើនមេត្តាមាន១១","ay"],[34,"35 វិធីឈ្នះមនុស្ស ៤ យ៉ាង","ay"],[35,"36 ចែកទោសមូលចិត្តដោយន័យផ្សេងៗ ១៤ យ៉ាង","ay"],[36,"37 និយមន័យមោហមូលចិត្ត","ay"],[37,"39 មោហៈការមិនដឹងក្នុងនិរោធ និងមគ្គ","ay"],[38,"40 អវិជ្ជាមិនដឹងខន្ធ អាយតនៈ ធាតុ","ay"],[39,"41 ពន្យល់វិចិកិច្ឆា និងឧទ្ធច្ចៈ","ay"],[40,"42 ពន្យល់ការដល់ព្រះសរណគមន៍","ay"],[41,"43 ពន្យល់ពាក្យថា ព្រះពុទ្ធ","ay"],[42,"44 ពន្យល់ពាក្យថា បារមី ទាន សីល នេក្ខម្ម","ay"],[43,"45 ពន្យល់ពាក្យថា បារមី បញ្ចប់ទាំង ៣០","ay"],[44,"46 ព្រះពុទ្ធគុណ​ អរហំ សម្មាសម្ពុទ្ធោ","ay"],[45,"47 ព្រះពុទ្ធគុណ​ វិជ្ជាចរណសម្បន្នោ សុគតោ","ay"],[46,"48 លោកវិទូ​ ទ្រង់ជ្រាបនូវវិញ្ញាណឋិតិ ៧ ប្រការ","ay"],[47,"49 លោកវិទូ​ ទ្រង់ជ្រាបធម៌៨ គឺលោកធម៌ទាំង ៨ ប្រការ","ay"],[48,"50 លោកវិទូ ទ្រង់ជាបនូវសត្វលោក","ay"],[49,"51 អនុត្តរោ ទ្រង់ប្រសើរលើសដោយសីលាទិគុណជាដើម","ay"],[50,"52 និយមន័យធុតង្គ បង្សុកូលិកង្គ","ay"],[51,"53 តេចីវរិកង្គធុតង្គ បិណ្ឌបាតិកង្គធុតង្គ","ay"],[52,"54 សបទានចារិកង្គធុតង្គ និងឯកាសនិកង្គធុតង្គ","ay"],[53,"55 បត្តបិណ្ឌក ខលុបច្ឆាភត្តិ អារញ្ញិកង្គធុតង្គ","ay"],[54,"56 រុក្ខមូលិកង្គ អព្ភោកាសិកង្គ សោសានិកង្គ","ay"],[55,"57 យថាសន្ថិកង្គ និងនេសជ្ជិកង្គធុតង្គ","ay"],[56,"58 ទ្រង់ព្រះនាមថា បុរិសទម្មសារថិ","ay"],[57,"59 សត្ថាទេវមនុស្សានំ ពុទ្ធោ ភគវា","ay"],[58,"60 ធម្មគុណ​ ស្ខាក្ខាតោ ភគវតា ធម្មោ","ay"],[59,"61 ធម្មគុណ​ និយមន័យព្រះត្រៃបិដក","ay"],[60,"62 ធម្មគុណ​ព្រះអង្គសម្តែងព្រះត្រៃមានន័យផ្សេងគ្នា","ay"],[61,"63 ធម្មគុណ ​សន្ទិដ្ឋិកោ អកាលិកោ","ay"],[62,"64 ស ិបាក ៧ ដួង","ay"],[99,"១០២ វិថីចិត្តតាមបញ្ចទ្វារនិងមនោទ្វារក្នុងអហេតុកចិត្ត","ay"],[100,"១០៣ កុសលវិបាក ចក្ខុវិញ្ញាណ សោតវិញ្ញាណ ឃានវិញ្ញាណ","ay"],[101,"១០៤ កុសលវិបាក ជិវ្ហាវិញ្ញាណ កាយវិញ្ញា ដល់មនោវិញ្ញាណ","ay"],[102,"១០៥ អហេតុកកិរិយាចិត្តដួងទី១ ដួងទី២ និងរម្លឹកមេរៀន","ay"],[103,"១០៦ ហសិតុប្បាទចិត្ត ការញញឹមចែកចេញជា ៦ យ៉ាង","ay"],[104,"១០៧ អហេតុកចិត្ត ១៨ កិច្ចក្នុងអហេតុកចិត្ត ១៨","ay"],[105,"១០៨ អហេតុកចិត្ត ចែកទ្វារ វត្ថុ វិញ្ញាណធាតុ៧","ay"],[106,"១០៩ បញ្ចប់អហេតុកចិត្ត១៨ ចែកដោយន័យផ្សេងៗ","ay"],[107,"១១០ មហាកុសលចិត្ត ៨ និយមន័យសោភណចិត្ត","ay"],[108,"១១១ មហាកុសលចិត្ត ៨ ពាក្យថាបុណ្យ និងកុសល","ay"],[109,"១១២ មហាកុសលចិត្តដួងទី១ និងអត្ថរបស់កុសល","ay"],[110,"១១៣ មហាកុសលចិត្តដួងទី២ ដួងទី៣","ay"],[111,"១១៤ មហាកុសលចិត្តដួងទី៤ ដួងទី ៥","ay"],[112,"១១៥ មហាកុសលចិត្តដួងទិ៥ដល់ទី៨ និងលក្ខណាទិចតុក្កៈកុសល","ay"],[113,"១១៦ ចក្កធម៌ ៤ យ៉ាង និងសប្បុរិសធម៌ ៧ ប្រការ","ay"],[114,"១១៧ ហេតុនាំឱ្យកើតសោមនស្សក្នុងមហាកុសលចិត្ត","ay"],[115,"១១៨ ផលរបស់បុណ្យមាន ២៧ យ៉ាងក្នុងនធិកណ្ឌសូត្","ay"],[116,"១១៩ ហេតុនាំឱ្យកើតមហាកុសលញាណសម្បយុត្តចិត្ត","ay"],[117,"១២០ ហេតុនាំឱ្យកើតមហាកុសលអសង្ខារិកចិត្តមាន ៦ យ៉ាង","ay"],[118,"១២១ ហេតុនាំកើតសសង្ខារ និងហេតុនាំឱ្យកើតបញ្ញាមាន ៣","ay"],[119,"១២២ ចែកមហាកុសលដោយកុសលកម្មបថ១០","ay"],[120,"១២៣ ចែកមហាកុសលដោយបុញ្ញកិរិយាវត្ថុ ទានមយបុណ្យ","ay"],[121,"១២៤ ចែកមហាកុសល ទានវត្ថុ ៤ និងទុកទាន","ay"],[122,"១២៥ ទានមយបុណ្យ ទុកទាន និងតិកទាន","ay"],[123,"១២៦ ទានមយបុណ្យ តិកទាន ទាសទាន សហាយទាន សាមិទាន","ay"],[124,"១២៧ ទានមយបុណ្យ ទាន ៨ យ៉ាង និងផលរបស់ទានផ្សេងៗ","ay"],[125,"១២៨ បុញ្ញកិរិយាវត្ថុ ទានមយបុណ្យ ផលរបស់ទានជាបន្ត","ay"],[126,"១២៩ បុញ្ញកិរិយាវត្ថុ ទានមយបុណ្យ អានិសង្សថ្វាយបាយជាដើម","ay"],[127,"១៣០ បុញ្ញកិរិយាវត្ថុ សីលមយបុណ្យ សីលរបស់គ្រហស្ថមាន ៣យ៉ាង","ay"],[128,"១៣១ បុញ្ញកិរិយាវត្ថុ សីលមយបុណ្យ បុណ្យសម្រេចដោយការរក្សាសីល","ay"],[129,"១៣២ បុញ្ញកិរិយាវត្ថុ សីលមយបុណ្យ ឧបោសថសីល ៣ យ៉ាង","ay"],[130,"១៣៣ សីលមយបុណ្យ ពន្យល់ វិកាលភោជនសិក្ខាបទ","ay"],[131,"១៣៤ សីលមយ វិកាលសិក្ខា ភេសជ្ជគួរបរិភោគ","ay"],[132,"១៣៥ សីលមយ វិកាលសិក្ខាបញ្ចប់ ចូលនច្ចគីតសិក្ខាបទ","ay"],[133,"១៣៦ សីលមយ មាលាគន្ធវិលេបន និងឧច្ចាសយនមហាសយនា","ay"],[134,"១៣៧ សីលមយ ឧច្ចាសយនមហាសយនសិក្ខាបទ","ay"],[135,"១៣៨ សីលមយ ជាតរូបបរជតប្បដិគ្គហណសិក្ខាបទ","ay"],[136,"១៣៩ សីលមយ អានិសង្សការវៀរចាកបាណាតិបាត អទិន្នាទាន","ay"],[137,"១៤០ អានិសង្សការវៀរចាកអព្រហ្មចរិយ មុសាវាទ សុរាមេរ័យ","ay"],[138,"១៤១ អានិសង្សនៃការរក្សាភាបន្ត","ay"],[139,"១៤១ បដិបក្ខរបស់សីល និងភាវនាមយបុណ្យ","ay"],[140,"១៤២ អាបចាយនៈ និងវេយ្យាវច្ចមយបុណ្យ","ay"],[141,"១៤៣ បត្តិទាន ការចែកបុណ្យ បត្តានុមោទនា ត្រេកអរនឹងបុណ្យ","ay"],[142,"១៤៤ ធម្មស្សវន ធម្មទេសនា ទិដ្ឋុជុកម្មមយបុណ្យ","ay"],[143,"១៤៥ ចែកមហាកុសលជាឧក្កដ្ឋកុសល និងឱមកកុសល","ay"],[144,"១៤៦ ចែកមហាកុសលដោយន័យផ្សេងៗ ១៤ ន័យ","ay"],[145,"១៤៧ មហាវិបាកចិត្ត ៨ ដួង និងផលរបស់ទាន៧/ភិក្ខុអគ្គចិត្តោ យ៉ុន យី​ បរិច្ឆេទទី១","ay"],[146,"១៤៨ មហាវិបាកចិត្ត ៨ ដួង និងសមង្គិតា៥/ភិក្ខុអគ្គចិត្តោ យ៉ុន យី​ បរិច្ឆេទទី១","ay"],[147,"១៤៩ មហាកិរិយាចិត្ត ៨ ដួង ការដឹងអារម្មណ៍តាមទ្វារ ៦/ភិក្ខុអគ្គចិត្តោ យ៉ុន យី​ បរិច្ឆេទទី១","ay"],[148,"១៥០ សំណួរបញ្ចប់កាមាវចរចិត្ត និងរូបឈាន/ភិក្ខុអគ្គចិត្តោ យ៉ុន យី​ បរិច្ឆេទទី១","ay"],[149,"១៥១ រូបាវចរចិត្ត បលិពោធ គ្រឿងកង្វល់របស់សមាធិ/ភិក្ខុអគ្គចិត្តោ យ៉ុន យី​ បរិច្ឆេទទី១","ay"],[150,"១៥២ រូបាវចរចិត្ត ពន្យល់អង្គឈាន ៥ លះនីវរណធម៌/ភិក្ខុអគ្គចិត្តោ យ៉ុន យី​ បរិច្ឆេទទី១","ay"],[151,"១៥៣ រូបាវចរកុសល កសិណ១០ យ៉ាង/ភិក្ខុអគ្គចិត្តោ យ៉ុន យី​ បរិច្ឆេទទី១","ay"],[152,"១៥៤ រូបាវចរកុសល អសុភ១០ និងអនុស្សតិ ១០/ភិក្ខុអគ្គចិត្តោ យ៉ុន យី​ បរិច្ឆេទទី១","ay"],[153,"១៥៥ ឧបសមានុស្សតិ និងមរណានុស្សតិ/ភិក្ខុអគ្គចិត្តោ យ៉ុន យី​ បរិច្ឆេទទី១","ay"],[154,"១៥៦ មរណានុស្សតិ អានាបានស្សតិ និងមេត្តា ករុណា/ភិក្ខុអគ្គចិត្តោ យ៉ុន យី​ បរិច្ឆេទទី១","ay"],[155,"១៥៧ ព្រហ្មវិហារកម្មដ្ឋាន របៀបចម្រើនព្រហ្មវិហារធម៌៤/ភិក្ខុអគ្គចិត្តោ យ៉ុន យី​ បរិច្ឆេទទី១","ay"],[156,"១៥៨ អាហារបដិកូលសញ្ញា ចតុធាតុវវត្ថាន","ay"],[157,"១៥៩ សមថកម្មដ្ឋាន៤០ វិនិច្ឆ័យដោយអាការ១០យ៉ាង","ay"],[158,"១៦០ សមថកម្មដ្ឋាន៤០ ចែកតាមចរិតរបស់បុគ្គល","ay"],[159,"១៦១ ចែកការប្រព្រឹត្តរបស់ចរិត៦ និងន័យផ្សេងៗ ១៤","ay"],[160,"១៦២ រូបាវចរវិបាកចិត្ត ៥ ដួង ផលទៅកើតព្រហ្មលោក","ay"],[161,"១៦៣ រូបាវចរវិបាកចិត្ត ៥ ដួង និងរូបាវចរកិរិយា៥ ដួង","ay"],[162,"១៦៤ អរូបាវចរចិត្ត ១២ អរូបកុសល ៤ អរូបវិបាក៤","ay"],[163,"១៦៥ បញ្ចប់អរូបាវចរចិត្ត១២ និងចូលលោកុត្តរចិត្ត","ay"],[164,"១៦៦ លោកុត្តរចិត្ត សោតាបត្តិមគ្គ សោតាមាន៣ ប្រភេទ/ភិក្ខុអគ្គចិត្តោ យ៉ុន យី​ បរិច្ឆេទទី១","ay"],[165,"១៦៧ សកទាគាមី៥ អនាគាមីមាន ៥ ប្រភេទ/ភិក្ខុអគ្គចិត្តោ យ៉ុន យី​ បរិច្ឆេទទី១","ay"],[166,"១៦៨ លោកុត្តរចិត្ត ទុក្ខសច្ចៈ/ភិក្ខុអគ្គចិត្តោ យ៉ុន យី​ បរិច្ឆេទទី១","ay"],[167,"១៦៩ ពន្យល់អរិយសច្ចៈ ៤ មានទុក្ខសច្ចជាដើម/ភិក្ខុអគ្គចិត្តោ យ៉ុន យី​ បរិច្ឆេទទី១","ay"],[168,"១៧០ មគ្គចិត្ត ៤ លះកិលស១០ យ៉ាង","ay"]]},{"i":74,"t":"yon-yi","km":"ព្រះអភិធម្មបរិច្ឆេទទី3 (2024)","en":"Abhidhamma Chapter 3 (2024)","tp":["abhidhamma"],"L":[[1,"បរិច្ឆេទ ទី៣ បកិណ្ណក​សង្គហវិភាគ ០១ រម្លឹកមេរៀនចិត្ត និងចេតសិក","ay"],[2,"បរិច្ឆេទ ទី៣ បកិណ្ណក​សង្គហវិភាគ ០២ វេទនាសង្គហ និយមន័យរបស់វេទនា","ay"],[3,"បរិច្ឆេទ ទី៣ បកិណ្ណក​សង្គហវិភាគ ០៣ វេទនាសង្គហ ចែកវេទនា១ វេទនា ២ និង៣","ay"],[4,"បរិច្ឆេទ ទី៣ បកិណ្ណក​សង្គហវិភាគ ០៤ វេទនាសង្គហ វេទនា២ គឺកាយិកសុខ ចេតសិកសុខ","ay"],[5,"បរិច្ឆេទ ទី៣ បកិណ្ណក​សង្គហវិភាគ ០៥ វេទនាសង្គហ ចែកវេទនាជា ១៨","ay"],[6,"បរិច្ឆេទ ទី៣ បកិណ្ណក​សង្គហវិភាគ ០៦ វេទនាសង្គហ ចែកវេទនាជា ៣៦ យ៉ាង","ay"],[7,"បរិច្ឆេទ ទី៣ បកិណ្ណក​សង្គហវិភាគ ០៧ វេទនាសង្គហ ចែកវេទនា ១០៨ និងវេទនា ៩","ay"],[8,"បរិច្ឆេទ ទី៣ បកិណ្ណក​សង្គហវិភាគ ០៨ វេទនាសង្គហ ចែកវេទនាដោយអារម្មណានុភវលក្ខណន័យ","ay"],[9,"បរិច្ឆេទ ទី៣ បកិណ្ណក​សង្គហវិភាគ ០៩ ចែកវេទនា ៣ ដោយអារម្មណ៍ ៣យ៉ាង","ay"],[10,"បរិច្ឆេទ ទី៣ បកិណ្ណក​សង្គហវិភាគ ១០ ចែកវេទនា ៥ យ៉ាងដោយឥន្រ្ទិយ","ay"],[11,"បរិច្ឆេទ ទី៣ បកិណ្ណក​សង្គហវិភាគ ១១ ចែកវេទនា ៥ ប្រកបជាមួយនឹងចេតសិក","ay"],[12,"បរិច្ឆេទ ទី៣ បកិណ្ណក​សង្គហវិភាគ ១២ ចែកចេតសិកប្រកបជាមួយនឹងវេទនា","ay"],[13,"បរិច្ឆេទ ទី៣ បកិណ្ណក​សង្គហវិភាគ ១៣ ចែកចេតសិកនឹងវេទនាភាគបញ្ចប់","ay"],[14,"បរិច្ឆេទ ទី៣ បកិណ្ណក​សង្គហវិភាគ ១៤ ហេតុសង្គហៈ និយមន័យហេតុ","ay"],[15,"បរិច្ឆេទ ទី៣ បកិណ្ណក​សង្គហវិភាគ ១៥ ហេតុសង្គហៈ ពាក្យថា ហេតុមាន ៤ យ៉ាង","ay"],[16,"បរិច្ឆេទ ទី៣ បកិណ្ណក​សង្គហវិភាគ ១៦ ហេតុសង្គហៈ សហេតុកចិត្តចែកជា ៣ ប្រភេទ","ay"],[17,"បរិច្ឆេទ ទី៣ បកិណ្ណក​សង្គហវិភាគ ១៧ ហេតុសង្គហៈ ចែកហេតុដោយន័យផ្សេងៗ","ay"],[18,"បរិច្ឆេទ ទី៣ បកិណ្ណក​សង្គហវិភាគ ១៨ ហេតុសង្គហៈ អគហិតគហនន័យ អគហិតគហនន័យ","ay"],[19,"បរិច្ឆេទ ទី៣ បកិណ្ណក​សង្គ វិថី វិថីពេលជិតស្លាប់","ay"],[58,"បរិច្ឆេទទី៤ វិថីសង្គហវិភាគ 58 បញ្ចទា្វរមរណាសន្នវិថី ភិក្ខុអគ្គចិត្តោ","ay"],[59,"បរិច្ឆេទទី៤ វិថីសង្គហវិភាគ 59 បញ្ចទា្វរមរណាសន្នវិថីប្រភេទទី២ដល់ទី៤","ay"],[60,"បរិច្ឆេទទី៤ វិថីសង្គហវិភាគ 60 មនោទ្វារមរណាសន្នវិថីភាគ១","ay"],[61,"បរិច្ឆេទទី៤ វិថីសង្គហវិភាគ 61 មនោទ្វារមរណាសន្នវិថីភាគ២","ay"],[62,"បរិច្ឆេទទី៤ វិថីសង្គហវិភាគ 62 មនោទ្វារមរណាសន្នវិថីភាគ២","ay"],[63,"បរិច្ឆេទទី៤ វិថីសង្គហវិភាគ 63 អភិញ្ញាសនមន្តរ ជីវិតសមសីសី","ay"],[64,"បរិច្ឆេទទី៤ វិថីសង្គហវិភាគ 64 បញ្ចប់បរិច្ឆេទទី ៤ តទាលម្ពណ ជវន","ay"]]},{"i":76,"t":"yon-yi","km":"ព្រះអភិធម្មបរិច្ឆេទទី4 (2024)","en":"Abhidhamma Chapter 4 (2024)","tp":["abhidhamma"],"L":[[1,"បរិច្ឆេទទី៤ វិថីសង្គហវិភាគ ភាគ០១ ពណ៌នាអំពីឆក្កធម៌មាន ៦ យ៉ាង(ភិក្ខុអគ្គចិត្តោ យ៉ុន យី)","ay"],[2,"បរិច្ឆេទទី៤ វិថីសង្គហវិភាគ ភាគ០២ ចែកវិថីចិត្តក្នុងបុគ្គល ១២​ ពួក(ភិក្ខុអគ្គចិត្តោ យ៉ុន យី)","ay"],[3,"បរិច្ឆេទទី៤ វិថីសង្គហវិភាគ ភាគ០៣ វិថីរបស់បុគ្គល៨ និងបញ្ចទ្វារវិថី ៤ យ៉ាង(ភិក្ខុអគ្គចិត្តោ យ៉ុន យី)","ay"],[4,"បរិច្ឆេទទី៤ វិថីសង្គហវិភាគ ភាគ០៤ ចែកអារម្មណ៍តាមបញ្ចទ្វារ៤​ មនោទ្វារ ៤(ភិក្ខុអគ្គចិត្តោ យ៉ុន យី)","ay"],[5,"បរិច្ឆេទទី៤ វិថីសង្គហវិភាគ ភាគ០៥ មនោទ្វារ ៤ យ៉ាង និងហេតុនាឱ្យកើតមនោទ្វារ(ភិក្ខុអគ្គចិត្តោ យ៉ុន យី)","ay"],[6,"បរិច្ឆេទទី៤ វិថីសង្គហវិភាគ ភាគ០៦ មនោទ្វារ ៤ យ៉ាង និងហេតុនាឱ្យកើតមនោទ្វារជាបន្ត(ភិក្ខុអគ្គចិត្តោ យ៉ុន យី)","ay"],[7,"បរិច្ឆេទទី៤ វិថីសង្គហវិភាគ ភាគ០៧ អាយុរបស់ចិត្ត ១៧ អាយុរបស់រូប១ខណៈ(ភិក្ខុអគ្គចិត្តោ យ៉ុន យី)","ay"],[8,"បរិច្ឆេទទី៤ វិថីសង្គហវិភាគ ភាគ០៨ ពន្យល់វិថីចិត្ត ១៧ ខណៈតាមបញ្វទ្វារ(ភិក្ខុអគ្គចិត្តោ យ៉ុន យី)","ay"],[9,"បរិច្ឆេទទី៤ វិថីសង្គហវិភាគ ភាគ០៩ និយាម ៥ យ៉ាង និងកាករឧបមាវិថីចិត្ត (ភិក្ខុអគ្គចិត្តោ យ៉ុន យី)","ay"],[10,"បរិច្ឆេទទី៤ វិថីសង្គហវិភាគ ភាគ១០ ឧបមាវិថីចិត្ត និងចែកចក្ខុបសាទជា៣(ភិក្ខុអគ្គចិត្តោ យ៉ុន យី)","ay"],[11,"បរិច្ឆេទទី៤ វិថីសង្គហវិភាគ ភាគ១១ អតិមហន្តារម្មណ៍ ប្រភេទទី១(ភិក្ខុអគ្គចិត្តោ យ៉ុន យី)","ay"],[12,"បរិច្ឆេទទី៤ វិថីសង្គហវិភាគ ភាគ១២ អតិមហន្តារម្មណ៍ ប្រភេទទី១និងទី២(ភិក្ខុអគ្គចិត្តោ យ៉ុន យី)","ay"],[13,"បរិច្ឆេទទី៤ វិថីសង្គហវិភាគ ភាគ១៣ អតិមហន្តារម្មណ៍ ប្រភេទទី២ និងទី៣(ភិក្ខុអគ្គចិត្តោ ន យី)","ay"],[70,"បរិច្ឆេទទី៤ វិថីសង្គហវិភាគ ភាគ៧០ រូបវិថី សិក្សាតាមតារាងទី៦និងទី៧(ភិក្ខុអគ្គចិត្តោ យ៉ុន យី)","ay"],[71,"បរិច្ឆេទទី៤ វិថីសង្គហវិភាគ ភាគ៧១ រូបវិថី សិក្សាតាមតារាងទី៨និងទី៩(ភិក្ខុអគ្គចិត្តោ យ៉ុន យី)","ay"]]},{"i":77,"t":"yon-yi","km":"ព្រះអភិធម្មបរិច្ឆេទទី9 (2020)","en":"Abhidhamma Chapter 9 (2020)","tp":["abhidhamma"],"L":[[1,"បរិច្ឆេទ ទី៩ កម្មដ្ឋាន 01 សិក្សាពីកម្មដ្ឋានបរិច្ឆេទទី៩ គួរជម្រះអ្វីខ្លះមុនធ្វើសមាធិ","ay"],[2,"បរិច្ឆេទ ទី៩ កម្មដ្ឋាន 02 ចរិតលាយគ្នា ៦៣ ចរិត","ay"],[3,"បរិច្ឆេទ ទី៩ កម្មដ្ឋាន 03 បលិពោធ គ្រឿងកង្វល់របស់សមាធិ១០","ay"],[4,"បរិច្ឆេទ ទី៩ កម្មដ្ឋាន 04 និមិត្ត ៣ យ៉ាងរបស់សមាធិ","ay"],[5,"បរិច្ឆេទ ទី៩ កម្មដ្ឋាន 05 អធិប្បយកសិណ ១០ យ៉ាង","ay"],[6,"បរិច្ឆេទ ទី៩ កម្មដ្ឋាន 06 សិក្សាពីអសុភ (សាកសពមិនស្អាត) ១០","ay"],[7,"បរិច្ឆេទ ទី៩ កម្មដ្ឋាន 07 វីធីសាស្រ្តចម្រើនអនុស្សតិ ៤ ខាងដើម","ay"],[8,"បរិច្ឆេទ ទី៩ កម្មដ្ឋាន 08 ចាគានុស្សតិ ទេវតានុស្សតិ ឧបសមានុស្សតិ","ay"],[9,"បរិច្ឆេទ ទី៩ កម្មដ្ឋាន 09 មរណានុស្សតិភាគ ១","ay"],[10,"បរិច្ឆេទ ទី៩ កម្មដ្ឋាន 10 វិធីសាស្រ្តចម្រើនមរណានុស្សតិ ៨ ប្រភេទ","ay"],[11,"បរិច្ឆេទ ទី៩ កម្មដ្ឋាន 11 កាយគតាសតិ រលឹកដល់អាការៈ ៣២ ប្រការ","ay"],[12,"បរិច្ឆេទ ទី៩ កម្មដ្ឋាន 12 កាយគតាសតិ​ ត្រូវឈ្លាស ២ យ៉ាង ១.ឧគ្គហកោសល្ល ២.មនសិការកោសល្ល","ay"],[13,"បរិច្ឆេទ ទី៩ កម្មដ្ឋាន 13 កាយគតាសតិ រលឹកកាយ ភាគ ៣","ay"],[14,"បរិច្ឆេទ ទី៩ កម្មដ្ឋាន 14 កាយគតាសតិ ភាគ ៤","ay"],[15,"បរិច្ឆេទ ទី៩ កម្មដ្ឋាន 15 កាយគតាសតិ ភាគ៥ បញ្ចាប់អាការៈ២០","ay"],[16,"បរិច្ឆេទ ទី៩ កម្មដ្ឋាន 16 អានាបានស្សតិភាគ១","ay"],[17,"បរិច្ឆេទ ទី៩ កម្មដ្ឋាន 17 អានាបានស្សតិភាគ ២","ay"],[18,"បរិច្ឆេទ ទី៩ កម្មដ្ឋាន 18 របៀបចម្រើនមេត្តាចិត្តភាគ ១ ភិក្ខុអគ្គចិត្តោ យ៉ុន​ យី","ay"],[19,"បរិច្ឆេទ ទី៩ កម្មដ្ឋាន 19 របៀបចម្រើនមេត្តាចិត្តភាគ ២","ay"],[20,"បរិច្ឆេទ ទី៩ កម្មដ្ឋាន 20 អធិប្បាយករុណា មុទិតា ឧបេក្ខា","ay"],[21,"បរិច្ឆេទ ទី៩ កម្មដ្ឋាន 21 អភិញ្ញាភាគ ២ ត្រចៀកទិព្វ ភ្នែកទិព្វ","ay"],[22,"បរិច្ឆេទ ទី៩ កម្មដ្ឋាន 22 សីលវិសុទ្ធិ សេចក្តីបរិសុទ្ធនៃសីល","ay"],[23,"បរិច្ឆេទ ទី៩ កម្មដ្ឋាន 23 ចិត្តវិសុទ្ធិ សេចក្តីបរិសុទ្ធិនៃចិត្ត","ay"],[24,"បរិច្ឆេទ ទី៩ កម្មដ្ឋាន 24 មេរៀន វិបស្សនា ទិដ្ឋិវិសុទ្ធិ បរិសុទ្ធ ុន យី","ay"],[13,"១៣ មហាសច្ចកសូត្រទី៦ ព្រះអង្គសម្តែងពីទុក្ករកិរិយា/ភិក្ខុអគ្គចិត្តោ យ៉ុន យី បិដកលេខ២២","ay"],[14,"១៤ ចូឡតណ្ហាសង្ខយសូត្រទី៧ ការបង្អោនចិត្តទៅកាន់និព្វាន/ភិក្ខុអគ្គចិត្តោ យ៉ុន យី បិដកលេខ២២","ay"],[15,"១៥ ចូឡតណ្ហាសង្ខយសូត្រទី៧ ព្រះមហាមោគ្គល្លានធ្វើឱ្យព្រះឥន្ទតក់ស្លុត/ភិក្ខុអគ្គចិត្តោ យ៉ុន យី បិដកលេខ២២","ay"],[16,"១៦ មហាតណ្ហាសង្ខយសូត្រទី៨ សាតិភិក្ខុមានទិដ្ឋិអាក្រក់","ay"],[17,"១៧ មហាតណ្ហាសង្ខយសូត្រទី៨ សម្តែងពីបដិច្ចសមុប្បាទធម៌","ay"],[18,"១៨ មហាតណ្ហាសង្ខយសូត្រទី៨ ទឹកដោះម៉ែដូចទឹកឈាមជាដើម","ay"],[19,"១៩ មហាអស្សបុរសូត្រទី៩ កាយ វាចា ចិត្តបរិសុទ្ធ និងមិនបរិសុទ្ធ","ay"],[20,"២០ មហាអស្សបុរសូត្រទី៩ សេចក្តីសុខក្នុងឈាននិងអស់អាសវ","ay"],[21,"២១ ចូឡអស្សបុរសូត្រទី១០ ការបដិបត្តិខុសនិងត្រូវរបស់សមណ","ay"],[22,"២២ សាលេយ្យកសូត្រទី១ ផលនៃការប្រព្រឹត្តស្មើនិងមិនស្មើ","ay"],[23,"២៣ វេរញ្ជកសូត្រទី២ និងមហាវេទល្លសូត្រទី៣ពីការសួរ៥ យ៉ាង/ភិក្ខុអគ្គចិត្តោ យ៉ុន យី បិដកលេខ២២","ay"],[24,"២៤ មហាវេទល្លសូត្រទី៣ សួរអំពីប្រាជ្ញានិងវិញ្ញាណខុសគ្នាឬទេ/ភិក្ខុអគ្គចិត្តោ យ៉ុន យី បិដកលេខ២២","ay"],[25,"២៥ មហាវេទល្លសូត្រទី៣ សួរអំពីវេទនា សញ្ញា វិញ្ញាផ្សេងគ្នាឬទេ/ភិក្ខុអគ្គចិត្តោ យ៉ុន យី បិដកលេខ២២","ay"],[26,"២៦ មហាវេទល្លសូត្រទី៣ សួរអំពីឥន្រ្ទិយ៥ ជាដើម/ភិក្ខុអគ្គចិត្តោ យ៉ុន យី បិដកលេខ២២","ay"],[27,"២៧ មហាវេទល្លសូត្រទី៣ សួរអំពីៈអាយុ ភ្លើងធាតុជាដើម/ភិក្ខុអគ្គចិត្តោ យ៉ុន យី បិដកលេខ២២","ay"],[28,"២៨ ចូឡវេទល្លសូត្រទី៤ វិសាខឧបាសកសួរពីសក្កាយទិដ្ឋិជាដើម/ភិក្ខុអគ្គចិត្តោ យ៉ុន យី បិដកលេខ២២","ay"],[29,"២៩ ចូឡវេទល្លសូត្រទី៤ វិសាខឧបាសកសួរការចូលនិរោធជាដើម/ភិក្ខុអគ្គចិត្តោ យ៉ុន យី បិដកលេខ២២","ay"],[30,"៣០ ចូឡវេទល្លសូត្រទី៤ វិសាខសួរពីការអនុស័យដេកត្រាំក្នុងវេទនា/ភិក្ខុអគ្គចិត្តោ យ៉ុន យី បិដកលេខ២២","ay"],[31,"៣១ ចូឡធម្មសមាទានសូត្រទី៥ ការសមាទានមាន៤យ៉ាង/ភិក្ខុអគ្គចិត្តោ យ៉ុន យី បិដកលេខ២២","ay"],[32,"៣២ មហាធម្មសមាទានសូត្រទី៦ មហាសមាទានមាន៤/ភិក្ខុអគ្គចិត្តោ យ៉ុន យី បិដកលេខ២២","ay"],[33,"៣៣ មហាធម្មសមាទានសូត្រទី៦ ឧបមាមហាធម្មសមាទាន/ភិក្ខុអគ្គចិត្តោ យ៉ុន យី បិដកលេខ២២","ay"],[34,"៣៤ វីមំសកសូត្រទី ៧ ការដឹងព្រះពុទ្ធដោយហេតុ២/ភិក្ខុអគ្គចិត្តោ យ៉ុន យី បិដកលេខ២២","ay"],[35,"៣៥ វីមំសកសូត្រទី ៧ សោតាបត្តិបន្នមានសទ្ធាមិនកម្រើកជាដើម","ay"],      ${cs.length?`<section><div class="sechead"><h2>${L("courses")}</h2></div><ul class="res">${cs.map(c=>`<li><button data-go="course" data-arg="${c.i}">${hl(c.km)}<span class="muted small">${esc(T(c.t)?.km)} · ${num(c.L.length)} ${L("lessons")}</span></button></li>`).join("")}</ul></section>`:""}
     ${ls.length?`<section><div class="sechead"><h2>${L("lessons")}</h2></div><ul class="res">${ls.map(([c,l])=>`<li><button data-go="lesson" data-arg="${c.i}-${l[0]}">${hl(l[1])}<span class="muted small">${esc(c.km)}</span></button></li>`).join("")}</ul></section>`:""}`
     :`<div class="empty stack"><span>${L("nores")}</span><span>${L("trythis")}</span><div class="row" style="justify-content:center"><a class="btn ghost sm" href="https://vacana.84000.digital" target="_blank" rel="noopener">Vacana ↗</a><a class="btn ghost sm" href="https://library.84000.digital" target="_blank" rel="noopener">Library · បណ្ណាល័យ ↗</a></div></div>`}
  return `<h1>${L("search")}</h1><form class="search" id="ss" style="margin:12px 0"><input id="sq" type="search" value="${esc(S.q)}" placeholder="${L("find")}" aria-label="${L("search")}"></form>${body}`}
function vMy(){const tabs=[["inprog",L("inprog")],["saved",L("saved")],["history",L("history")],["notes",L("notes")]];let b="";
  if(S.mtab==="inprog"){const ids=[...new Set(D.hist.map(h=>h.c))].filter(c=>pct(c)<100);b=ids.length?`<div class="cgrid">${ids.map(c=>courseCard(c)).join("")}</div>`:""}
  if(S.mtab==="saved")b=D.saved.length?`<div class="cgrid">${D.saved.map(c=>courseCard(c)).join("")}</div>`:"";
  if(S.mtab==="history")b=D.hist.length?`<ul class="res">${D.hist.map(h=>`<li><button data-go="lesson" data-arg="${h.c}-${h.n}">${L("lesson")} ${num(h.n)} · ${esc(COURSES[h.c].L.find(l=>l[0]===h.n)?.[1])}<span class="muted small">${ctitle(COURSES[h.c])} · ${new Date(h.ts).toLocaleDateString(S.lang==="km"?"km-KH":"en-US")}</span></button></li>`).join("")}</ul>`:"";
  if(S.mtab==="notes")b=D.notes.length?D.notes.map(x=>`<button class="note" data-go="lesson" data-arg="${x.c}-${x.n}" style="width:100%;text-align:left"><span class="ts">${tm(x.t)}</span><span>${esc(x.txt)}<br><span class="muted small">${ctitle(COURSES[x.c])} · ${L("lesson")} ${num(x.n)}</span></span></button>`).join(""):"";
  return `<h1>${L("my")}</h1><div class="tabs" style="margin:12px 0">${tabs.map(([k,n])=>`<button data-mtab="${k}" aria-pressed="${S.mtab===k}">${n}</button>`).join("")}</div><div class="stack">${b||`<div class="empty">${L("nothing")}</div>`}</div>`}
function vMore(){const apps=[["Vacana","https://vacana.84000.digital",S.lang==="km"?"កំពុងសាកល្បង":"In testing"],["DigitalDhurak",null,"Paused"],["Satipatthana Portal",null,"Paused"],["MiniTalkPoint",null,"Paused"]];
  return `<h1>${L("more")}</h1>
  <section style="margin-top:14px"><div class="sechead"><h2>${L("apps")}</h2></div><div class="list">${apps.map(([n,u,s])=>u?`<a href="${u}" target="_blank" rel="noopener"><span>${n}</span><span class="muted small">${s} ↗</span></a>`:`<div><span>${n}</span><span class="muted small">${s}</span></div>`).join("")}</div></section>
  <section><div class="list"><a href="https://84000.digital/about.html" target="_blank" rel="noopener"><span>${L("about")}</span><span>↗</span></a><div><span>${L("feedback")}</span><span class="ph">NEEDED: form URL</span></div>
  <div><span>${L("language")}</span><span class="lang" role="group"><button data-lang="km" aria-pressed="${S.lang==="km"}">ខ្មែរ</button><button data-lang="en" aria-pressed="${S.lang==="en"}">EN</button></span></div>
  <div><span>${L("offline")}</span><span class="ph">DECISION PENDING</span></div></div></section>
  <p class="muted small" style="text-align:center;margin-top:20px">${S.lang==="km"?"© ២០២៦ មូលនិធិប្រយោជន៍":"© 2026 Payojana Foundation"} · v0-mockup</p>`}
function vNF(){return `<div class="empty">404 · <button class="link" data-go="home">${L("home")}</button></div>`}
const ICON={home:'<path d="M3 11l9-7 9 7v9h-6v-6H9v6H3z"/>',search:'<circle cx="11" cy="11" r="6"/><path d="M20 20l-4.5-4.5"/>',my:'<path d="M4 5h11a4 4 0 014 4v11H8a4 4 0 01-4-4z"/><path d="M8 9h7M8 13h5"/>',more:'<circle cx="5" cy="12" r="1.5"/><circle cx="12" cy="12" r="1.5"/><circle cx="19" cy="12" r="1.5"/>'};
function render(){
  document.documentElement.lang=S.lang;document.documentElement.dataset.lang=S.lang;
  $("#bname").textContent=S.lang==="km"?"ថ្នាក់សិក្សា · Learn":"Learn · ថ្នាក់សិក្សា";
  document.querySelectorAll("header .lang button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.lang===S.lang));
  const v=S.view;$("#main").innerHTML=v==="home"?vHome():v==="course"?vCourse(S.arg):v==="lesson"?vLesson(S.arg||""):v==="teacher"?vTeacher(S.arg):v==="teachers"?vTeachers():v==="search"?vSearch():v==="my"?vMy():v==="more"?vMore():vNF();
  const tabOf={course:"home",lesson:"home",teacher:"home",teachers:"home"}[v]||v;
  $("#tabbar").innerHTML=["home","search","my","more"].map(k=>`<button data-go="${k}" ${tabOf===k?'aria-current="page"':""}><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round" stroke-linecap="round">${ICON[k]}</svg>${L(k)}</button>`).join("");
  const nk=v==="teachers"?"teachers":NOTES[v]?v:"home";$("#notes").hidden=!S.notes;
  $("#notes").innerHTML=`<div class="in"><h4>Builder notes — ${v}</h4><ul>${NOTES[nk].map(x=>`<li>${esc(x)}</li>`).join("")}</ul></div>`;
  mini();addr();
}
function mini(){const m=$("#mini");if(!cur||!R2.has(cur.c)||S.view==="lesson"){m.hidden=true;return}
  const co=COURSES[cur.c],l=co.L.find(x=>x[0]===cur.n),pp=P(cur.c,cur.n);m.hidden=false;
  m.innerHTML=`<div class="mp" style="position:absolute;left:0;right:0;margin-top:-9px"><i style="width:${100*pp.pos/SIMLEN}%"></i></div><button class="mt" data-go="lesson" data-arg="${cur.c}-${cur.n}">${esc(l[1])}<small>${tm(pp.pos)} · ${ctitle(co)}</small></button><button class="pp" data-pp>${S.playing?"❚❚":"▶"}</button>`}
function tick(){if(!cur)return;const pp=P(cur.c,cur.n);let pos=pp.pos+S.speed*5;  // 1 s real = 5 s simulated, so the mockup moves visibly
  if(pos>=SIMLEN){setP(cur.c,cur.n,{pos:SIMLEN,done:true});stop();const co=COURSES[cur.c],i=co.L.findIndex(x=>x[0]===cur.n);if(S.auto&&co.L[i+1]){go("lesson",`${cur.c}-${co.L[i+1][0]}`);play()}else render();return}
  setP(cur.c,cur.n,{pos,done:pp.done||pos>=.9*SIMLEN});
  const b=$("#bar"),p=$("#pos");if(b&&S.view==="lesson"){b.style.width=100*pos/SIMLEN+"%";p.textContent=tm(pos)}else mini()}
function play(){if(!cur)return;S.playing=true;clearInterval(timer);timer=setInterval(tick,1000);updPP()}
function stop(){S.playing=false;clearInterval(timer);updPP()}
function updPP(){document.querySelectorAll("[data-pp]").forEach(b=>b.textContent=S.playing?"❚❚":"▶")}
function toast(t){const e=$("#toast");e.textContent=t;e.hidden=false;clearTimeout(e._t);e._t=setTimeout(()=>e.hidden=true,1800)}
document.addEventListener("click",e=>{const b=e.target.closest("button,a");if(!b)return;const d=b.dataset;
  if(d.go){e.preventDefault();if(d.go==="search"&&S.view!=="search")S.q=S.q||"";go(d.go,d.arg);return}
  if(d.lang){S.lang=d.lang;render();return}
  if(d.topic){S.topic=d.topic;render();return}
  if(d.mtab){S.mtab=d.mtab;render();return}
  if(d.save!=null){const i=+d.save;D.saved=D.saved.includes(i)?D.saved.filter(x=>x!==i):[i,...D.saved];store();render();return}
  if(d.share!=null){const u="https://"+$("#addr").textContent;navigator.clipboard?.writeText(u).then(()=>toast(L("linkcopied")),()=>toast(u));return}
  if(d.pp!=null){S.playing?stop():play();return}
  if(d.skip){const pp=P(cur.c,cur.n);setP(cur.c,cur.n,{pos:Math.min(SIMLEN,Math.max(0,pp.pos+ +d.skip))});tickDraw();return}
  if(d.seek){setP(cur.c,cur.n,{pos:+d.seek});tickDraw();return}
  if(d.speed!=null){const sp=[.75,1,1.25,1.5,2];S.speed=sp[(sp.indexOf(S.speed)+1)%sp.length];render();return}
  if(d.sleep!=null){const o=[0,15,30,60];S.sleep=o[(o.indexOf(S.sleep)+1)%o.length];clearTimeout(sleepT);if(S.sleep)sleepT=setTimeout(stop,S.sleep*1000);render();return}  // mockup: minutes shortened to seconds
  if(d.auto!=null){S.auto=!S.auto;render();return}
  if(d.done!=null){const pp=P(cur.c,cur.n);setP(cur.c,cur.n,{done:!pp.done});render();return}
  if(b.id==="mSeed"){seed();render();toast("Sample learner loaded");return}
  if(b.id==="mClear"){D={prog:{},last:null,saved:[],hist:[],notes:[]};cur=null;stop();store();go("home");return}
  if(b.id==="mNotes"){S.notes=!S.notes;render();return}
  const sc=e.target.closest("#scrub");});
document.addEventListener("click",e=>{const s=e.target.closest("#scrub");if(!s||!cur)return;const r=s.getBoundingClientRect();setP(cur.c,cur.n,{pos:SIMLEN*(e.clientX-r.left)/r.width});tickDraw()});
function tickDraw(){const pp=P(cur.c,cur.n),b=$("#bar"),p=$("#pos");if(b){b.style.width=100*pp.pos/SIMLEN+"%";p.textContent=tm(pp.pos)}}
document.addEventListener("submit",e=>{e.preventDefault();const f=e.target.id;
  if(f==="hs"){S.q=$("#hq").value;go("search")}
  if(f==="nf"){const v=$("#nt").value.trim();if(!v)return;D.notes.unshift({c:cur.c,n:cur.n,t:P(cur.c,cur.n).pos,txt:v});store();render()}
  if(f==="cf"||f==="ss")return});
document.addEventListener("input",e=>{if(e.target.id==="sq"){S.q=e.target.value;const pos=e.target.selectionStart;render();const i=$("#sq");i.focus();i.setSelectionRange(pos,pos)}
  if(e.target.id==="cfq"){S.filter=e.target.value;const pos=e.target.selectionStart;render();const i=$("#cfq");i.focus();i.setSelectionRange(pos,pos)}});
addEventListener("hashchange",()=>{fromHash();render()});
load();if(!D.hist.length)seed();fromHash();render();
</script>
