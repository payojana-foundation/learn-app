<title>Learn Mockup</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
/* Layout: website v8 brand (cream page, brand-red ink) as an app shell — slim top bar, one ≤760px column, mini player + 4-tab bar fixed at the bottom. Mockup bar above the app. */
:root{
  --bg:#EDE3C8; --panel:#F6EFDD; --line:#C9B896; --ink:#7F0204; --muted:#6B5D48; --on-ink:#EDE3C8;
  --leaf:#F26000; --ph:#E2D5B4; --done:#2F6B3A; --hl:#F2D7C2;
  --chrome:#2B211B; --chrome-ink:#EDE3C8; --chrome-muted:#B9A88C; --bar:rgba(237,227,200,.95);
  --f-km:"Battambang",system-ui,sans-serif; --f-display:"Moul","Battambang",serif; --f-en:"Lora",Georgia,serif; --f-ui:system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#1C1512; --panel:#261D18; --line:#4A3A2E; --ink:#F0A48C; --muted:#B9A88C; --on-ink:#1C1512; --ph:#33271F; --done:#8FC79A; --hl:#3D2519;
  --chrome:#0F0B09; --chrome-ink:#EDE3C8; --chrome-muted:#9C8C73; --bar:rgba(28,21,18,.95); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#1C1512; --panel:#261D18; --line:#4A3A2E; --ink:#F0A48C; --muted:#B9A88C; --on-ink:#1C1512; --ph:#33271F; --done:#8FC79A; --hl:#3D2519;
  --chrome:#0F0B09; --chrome-ink:#EDE3C8; --chrome-muted:#9C8C73; --bar:rgba(28,21,18,.95); color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-km);line-height:1.75;font-size:16px}
html[data-lang="en"] body{font-family:var(--f-en)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:40;background:var(--chrome)}
button{font:inherit;color:inherit;cursor:pointer}
a{color:var(--ink)}
:focus-visible{outline:2px solid var(--leaf);outline-offset:2px}
.gut{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.mock{background:var(--chrome);color:var(--chrome-ink);font:13px/1.45 var(--f-ui)}
.mock .in{max-width:900px;margin:0 auto;padding-block:8px;display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center}
.mock b{background:var(--leaf);color:#1C1512;padding:1px 7px;border-radius:3px;font-size:11px;letter-spacing:.08em}
.mock button{background:none;border:1px solid var(--chrome-muted);color:var(--chrome-ink);border-radius:4px;padding:2px 8px;font-size:12px}
.mock .addr{font-family:ui-monospace,Consolas,monospace;color:var(--chrome-muted);overflow-wrap:anywhere;min-width:0}
.notes{background:var(--chrome);color:var(--chrome-muted);font:13px/1.55 var(--f-ui);border-top:1px solid #3a2e26}
.notes .in{max-width:900px;margin:0 auto;padding-block:8px 12px}
.notes h4{margin:0 0 4px;color:var(--chrome-ink);font-size:13px}
.notes ul{margin:0;padding-left:18px}
header.app{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bar);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
header.app .in{max-width:760px;margin:0 auto;padding-block:8px;display:flex;align-items:center;gap:10px}
.brand{font-family:var(--f-display);font-size:1rem;line-height:1.4;flex:1;min-width:0;cursor:pointer;background:none;border:0;text-align:left;padding:0}
.brand small{font-family:var(--f-ui);font-size:.72rem;color:var(--muted);display:block;letter-spacing:.06em}
.lang{display:flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;font-size:.8rem}
.lang button{background:none;border:0;padding:3px 10px}
.lang button[aria-pressed="true"]{background:var(--ink);color:var(--on-ink)}
main{max-width:760px;margin:0 auto;padding-block:18px 170px}
h1,h2,h3{font-family:var(--f-display);font-weight:400;line-height:1.55;margin:0;text-wrap:balance}
html[data-lang="en"] h1,html[data-lang="en"] h2{font-family:var(--f-en);font-weight:600}
h1{font-size:1.35rem}h2{font-size:1.05rem}
.muted{color:var(--muted)}.small{font-size:.85rem}
.stack{display:flex;flex-direction:column;gap:12px}
section{display:flex;flex-direction:column;gap:10px}
section+section{margin-top:28px}
.sechead{display:flex;justify-content:space-between;align-items:baseline;gap:10px;border-bottom:1px solid var(--line);padding-bottom:4px}
.link{background:none;border:0;padding:0;text-decoration:underline;font-size:.88rem}
.ph{background:var(--ph);color:var(--muted);border-radius:3px;padding:0 5px;font:600 .72rem var(--f-ui);white-space:nowrap}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--ink);background:var(--ink);color:var(--on-ink);padding:9px 16px;border-radius:6px;font-size:.95rem}
.btn.ghost{background:transparent;color:var(--ink)}
.btn.sm{padding:4px 11px;font-size:.85rem}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.chip{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:2px 12px;font-size:.85rem}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--on-ink);border-color:var(--ink)}
.search{display:flex;border:1px solid var(--line);background:var(--panel);border-radius:8px;overflow:hidden}
.search input{flex:1;min-width:0;border:0;background:transparent;padding:11px 14px;font:inherit;color:var(--ink)}
.search input::placeholder{color:var(--muted)}
.tagline{text-align:center;font-size:.92rem;margin:0}
.hrow{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(210px,72%);gap:10px;overflow-x:auto;padding-bottom:6px;scroll-snap-type:x mandatory}
.hrow>*{scroll-snap-align:start}
@media (min-width:640px){.hrow{grid-auto-columns:230px}}
.hrow.t{grid-auto-columns:118px}
.card{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:12px;display:flex;flex-direction:column;gap:6px;text-align:left;min-width:0}
.card .t{line-height:1.6}
.meta{display:flex;flex-wrap:wrap;gap:4px 12px;font:.78rem var(--f-ui);color:var(--muted)}
.pbar{height:5px;background:var(--ph);border-radius:3px;overflow:hidden}
.pbar i{display:block;height:100%;background:var(--ink)}
.cont{border-left:4px solid var(--ink)}
.tcard{align-items:center;text-align:center;gap:6px}
.av{width:72px;height:72px;border-radius:50%;object-fit:cover;border:2px solid var(--line);background:var(--ph)}
.tcard .nm{font-size:.8rem;line-height:1.5;overflow-wrap:anywhere}
.cgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}
.crumbs{font:.82rem var(--f-ui);color:var(--muted)}
.chead{display:flex;flex-direction:column;gap:8px}
.who{display:flex;align-items:center;gap:10px;background:none;border:0;padding:0;text-align:left}
.who img{width:40px;height:40px;border-radius:50%;object-fit:cover}
.sect{border:1px solid var(--line);border-radius:8px;background:var(--panel);overflow:hidden}
.sect>summary{list-style:none;display:flex;justify-content:space-between;gap:10px;padding:10px 14px;cursor:pointer;font-size:.92rem}
.sect>summary::-webkit-details-marker{display:none}
.sect+.sect{margin-top:8px}
.les{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
.les li+li{border-top:1px solid var(--line)}
.les button{width:100%;display:grid;grid-template-columns:22px 2.2rem minmax(0,1fr) auto;gap:8px;align-items:center;background:none;border:0;padding:9px 14px;text-align:left}
.les .n{font:.8rem var(--f-ui);color:var(--muted);text-align:right;font-variant-numeric:tabular-nums}
.les .tt{min-width:0;overflow-wrap:anywhere;line-height:1.55;font-size:.92rem}
.les .cur{background:var(--hl)}
.tick{width:18px;height:18px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;font-size:11px}
.tick.on{background:var(--done);border-color:var(--done);color:var(--bg)}
.mic{font:.72rem var(--f-ui);color:var(--muted);white-space:nowrap}
.player{background:var(--chrome);color:var(--chrome-ink);border-radius:10px;padding:16px;display:flex;flex-direction:column;gap:12px;font-family:var(--f-ui)}
.player .scrub{height:6px;background:#ffffff2e;border-radius:3px;position:relative;cursor:pointer}
.player .scrub i{position:absolute;inset:0 auto 0 0;background:var(--leaf);border-radius:3px}
.player .times{display:flex;justify-content:space-between;font-size:.78rem;color:var(--chrome-muted);font-variant-numeric:tabular-nums}
.pctl{display:flex;justify-content:center;align-items:center;gap:18px}
.pctl button{background:none;border:0;color:var(--chrome-ink);font-size:.85rem}
.pctl .pp{width:56px;height:56px;border-radius:50%;background:var(--chrome-ink);color:var(--chrome);font-size:1.3rem}
.popts{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.popts button{background:none;border:1px solid var(--chrome-muted);color:var(--chrome-ink);border-radius:999px;padding:2px 10px;font-size:.8rem}
.embed{background:var(--chrome);color:var(--chrome-muted);border-radius:10px;padding:22px 16px;text-align:center;font:.9rem/1.6 var(--f-ui);aspect-ratio:16/9;max-width:100%;display:grid;place-items:center}
.note{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:10px 12px;display:flex;gap:10px}
.note .ts{font:600 .8rem var(--f-ui);color:var(--ink);background:var(--ph);border:0;border-radius:4px;padding:1px 6px;height:fit-content;font-variant-numeric:tabular-nums}
textarea{width:100%;min-height:64px;font:inherit;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:8px 10px}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);overflow-x:auto}
.tabs button{background:none;border:0;border-bottom:2px solid transparent;padding:6px 10px;white-space:nowrap}
.tabs button[aria-pressed="true"]{border-bottom-color:var(--ink);font-weight:700}
.res{list-style:none;margin:0;padding:0}
.res li+li{border-top:1px solid var(--line)}
.res button{width:100%;background:none;border:0;padding:9px 2px;text-align:left;display:flex;flex-direction:column}
mark{background:var(--hl);color:inherit}
.empty{border:1px dashed var(--line);border-radius:8px;padding:18px;text-align:center;color:var(--muted)}
.list{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:8px;background:var(--panel)}
.list>*{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:12px 14px;background:none;border:0;text-align:left}
.list>*+*{border-top:1px solid var(--line)}
.tprof{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.tprof img{width:104px;height:104px;border-radius:50%;object-fit:cover;border:2px solid var(--line)}
.bio{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:14px;white-space:pre-line}
.dock{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--bar);backdrop-filter:blur(8px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.mini{max-width:760px;margin:0 auto;display:flex;align-items:center;gap:10px;padding-block:8px;border-bottom:1px solid var(--line)}
.mini .mt{flex:1;min-width:0;background:none;border:0;text-align:left;padding:0;font-size:.85rem;line-height:1.45;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mini .mt small{display:block;color:var(--muted);font:.72rem var(--f-ui)}
.mini .pp{width:38px;height:38px;border-radius:50%;border:0;background:var(--ink);color:var(--on-ink)}
.mini .mp{position:absolute;left:0;right:0;height:2px;background:var(--ph)}
.mini .mp i{display:block;height:100%;background:var(--leaf)}
nav.tabbar{max-width:760px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
nav.tabbar button{background:none;border:0;padding:7px 2px 6px;display:flex;flex-direction:column;align-items:center;gap:1px;font-size:.72rem;color:var(--muted)}
nav.tabbar button[aria-current="page"]{color:var(--ink);font-weight:700}
nav.tabbar svg{width:22px;height:22px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:140px;background:var(--chrome);color:var(--chrome-ink);padding:8px 14px;border-radius:6px;font:.85rem var(--f-ui);z-index:50}
@media (prefers-reduced-motion:no-preference){.pbar i,.player .scrub i{transition:width .3s}}
</style>

<div class="mock gut"><div class="in">

ះអភិធម្មថ្នាក់ដំបូង ថ្ងៃទី ២០","y"],[21,"២១ លក្ខណាទិចតុករបស់ វិចិកិច្ឆា ព្រះអភិធម្មថ្នាក់ដំបូង ថ្ងៃទី ២១","y"],[22,"២២ សេចក្តីសង្ស័យ ៨ប្រការ ព្រះអភិធម្មថ្នាក់ដំបូង ថ្ងៃទី ២២","y"],[23,"២៣ អធិប្បាយសេចក្តីសង្ស័យ ៨ ប្រការ ព្រះអភិធម្មថ្នាក់ដំបូង ថ្ងៃទី ២៣","y"],[24,"២៤ ហេតុដែលលះវិចិកិច្ឆា និង ឧទ្ធច្ចៈ ព្រះអភិធម្មថ្នាក់ដំបូង ថ្ងៃទី ២៤","y"],[25,"២៥ មោហមូលចិត្តចែកដោយន័យ១៤ន័យ ព្រះអភិធម្មថ្នាក់ដំបូង ថ្ងៃទី ២៥","y"],[26,"២៦ មោហមូលចិត្តចែកដោយន័យ ១៤ ន័យ ព្រះអភិធម្មថ្នាក់ដំបូង ថ្ងៃទី ២៦","y"],[27,"២៧ សេចក្តីស្រវឹង ២៧ ប្រការ ព្រះអភិធម្មថ្នាក់ដំបូង ថ្ងៃទី ២៧","y"],[28,"២៨ មោហមូលចិត្ត ២ ដួង \"ចប់\" ព្រះអភិធម្មថ្នាក់ដំបូង ថ្ងៃទី ២៨","y"],[29,"២៩ សង្គ្រោះអកុសលចិត្ត ១២ ក្នុងអកុសលកម្មបថ ១០ ព្រះអភិធម្មថ្នាក់ដំបូង ថ្ងៃទី ២៩","y"],[31,"៣១ អកុសលកម្មបថ\"អទិន្នាទាន\" ព្រះអភិធម្មថ្នាក់ដំបូង ថ្ងៃទី៣១","y"],[32,"៣២ អកុសលកម្មបថ \"មុសាវាទ-បិសុណាវាទ\" ព្រះអភិធម្មថ្នាក់ដំបូង ថ្ងៃទី៣២","y"],[33,"៣៣ អកុសលកម្មបថ\"ផរុសវាចា\" ព្រះអភិធម្មថ្នាក់ដំបូង ថ្ងៃទី៣៣","y"],[34,"៣៤ អកុសលកម្មបថ\"សម្ផប្បលាប អភិជ្ឈា ព្យាបាទ\" ព្រះអភិធម្មថ្នាក់ដំបូង ថ្ងៃទី៣៤","y"],[35,"៣៥ អកុសលមនោកម្ម\"មិច្ឆាទិដ្ឋិ\" ព្រះអភិធម្មថ្នាក់ដំបូង ថ្ងៃទី៣៥","y"],[36,"៣៦ អកុសលមនោកម្ម មិច្ឆាទិដ្ឋិ\"ចប់\" ព្រះអភិធម្មថ្នាក់ដំបូង ថ្ងៃទី៣៦","y"],[37,"៣៧ វិនិច្ឆ័យអកុសលកម្មបថដោយ អាការ:៥ប្រការផ្សេងទៀត ព្រះអភិធម្មថ្នាក់ដំបូង ថ្ងៃទី៣៧","y"],[38,"៣៨ អកុសលកម្មបថ១០ \"ចប់\" ផ្តើមអហេតុកចិត្ត១៨ដួង ព្រះអភិធម្មថ្នាក់ដំបូង ថ្ងៃទី៣៨","y"],[39,"៣៩ អហេតុកអកុសលវិបាកចិត្ត៧ដួង ព្រះអភិធម្មថ្នាក់ដំបូង ថ្ងៃទី៣៩","y"],[40,"៤០ ទ្វារវិថីចិត្ត ដែលទទួលអារម្មណ៏បរមត្ថ ព្រះអភិធម្មថ្នាក់ដំបូង ថ្ងៃទី៤០","y"],[41,"៤១ អកុសលវិបាកចិត្ត៧ដួង ព្រះអភិធម្មថ្នាក់ដំបូង ថ្ងៃទី៤១","y"],[42,"៤២ វិថីចិត្តកេីត១៧ខណៈតាមបញ្ចទ្វារ ព្រះអភិធម្មថ្នាក់ដំបូង ថ្ងៃទី៤២","y"],[43,"៤៣ អធិប្បាយអហេតុកអកុសលវិបាកចិត្ត ព្រះអភិធម្មថ្នាក់ដំបូង ថ្ងៃទី៤៣","y"],[44,"៤៤ អហេតុកកុសលវិបាកចិត្ត៨ដួង ព្រះអភិធម្មថ្នាក់ដំបូង ថ្ងៃទី៤៤","y"],[45,"៤៥ អហេតុកកុសលវិបាកចិត្ត\"ត\" ព្រះអភិធម្មថ្នាក់ដំបូង ថ្ងៃទី៤៥","y"],[46,"៤៦ អហេតុកកិរិយាចិត្ត ព្រះអភិធម្មថ្នាក់ដំបូង ថ្ងៃទី៤៦","y"],[47,"៤៧ អហេតុកកិរិយាចិត្ត\"ត\" ព្រះអភិធម្មថ្នាក់ដំបូង ថ្ងៃទី៤៧","y"],[48,"៤៨ អធិប្បាយអហេតុកកិរិយាចិត្ត៣ដួង ព្រះអភិធម្មថ្នាក់ដំបូង ថ្ងៃទី៤៨","y"],[49,"៤៩ ហេតុកើត ទ្វិបញ្ចវិញ្ញាណ១០ មនោធាតុ៣ និង មនោវិញ្ញាណធាតុ ព្រះអភិធម្មថ្នាក់ដំបូង ថ្ងៃទី៤៩","y"],[50,"៥០ កិច្ច១៤យ៉ាង របស់អហេតុកចិត្ត១៨ដួង ព្រះអភិធម្មថ្នាក់ដំបូង ថ្ងៃទី៥០","y"],[51,"៥១ កិច្ច១៤យ៉ាងរបស់អហេតុកចិត្ត \"ចប់\" ព្រះអភិធម្មថ្នាក់ដំបូង ថ្ងៃទី៥១","y"],[52,"៥២ អហេតុកចិត្ត១៨ ដោយន័យ១៤ ព្រះអភិធម្មថ្នាក់ដំបូង ថ្ងៃទី៥២","y"],[53,"៥៣ អហេតុកចិត្ត១៨ ដោយន័យ១៤ \"ត\" ព្រះអភិធម្មថ្នាក់ដំបូង ថ្ងៃទី៥៣","y"],[54,"៥៤ អហេតុកចិត្ត១៨ ដោយន័យ១៤ \"ចប់\" ព្រះអភិធម្មថ្នាក់ដំបូង ថ្ងៃទី៥៤","y"],[55,"៥៥ អំពីអត្ថរបស់កុសល ៥ ប្រការ ព្រះអភិធម្មថ្នាក់ដំបូង ថ្ងៃទី៥៥","y"],[56,"៥៦ លក្ខណាទិចតុក្កៈ របស់កុសល ព្រះអភិធម្មថ្នាក់ដំបូង ថ្ងៃទី៥៦","y"],[57,"៥៧ មហាកុសលចិត្ត៨ដួង ព្រះអភិធម្មថ្នាក់ដំបូង ថ្ងៃទី ៥៧","y"],[58,"៥៨ មហាកុសលចិត្ត៨ដួង \"ចប់\" ចូលដល់សេចក្តីអធិប្បាយ ព្រះអភិធម្មថ្នាក់ដំបូង ថ្ងៃទី ៥៨","y"],[59,"៥៩ ហេតុដែលនំាឲ្យកើតមហាកុសលសោមនស្សវេទនា ព្រះអភិធម្មថ្នាក់ដំបូង ថ្ងៃទី ៥៩","y"],[60,"៦០ ហេតុឱ្យកេីតកុសលញាណសម្បយុត្ត និងវិប្បយុត្ត ព្រះអភិធម្មថ្នាក់ដំបូង ថ្ងៃទី ៦០","y"],[61,"៦១ ហេតុឱ្យកេីតមហាកុសលអសង្ខារិកនិងសសង្ខារិក ៦ប្រការ ព្រះអភិធម្មថ្នាក់ដំបូង ថ្ងៃទី ៦១","y"],[62,"៦២ ហេតុឱ្យកេីតបញ្ញា ៣ប្រការ ចេតនាក្នុងមហាកុសល ៨ដួង ព្រះអភិធម្មថ្នាក់ដំបូង ថ្ងៃទី ៦២","y"],[63,"៦៣ មហាកុសលចិត្តប្រព្រឹត្តក្នុងបុញ្ញកិរិយាវត្ថុ១០និងមហាកុសល២ប្រភេទ ព្រះអភិធម្មថ្នាក់ដំបូង ថ្ងៃទី ៦៣","y"],[64,"៦៤ ចំណែកកុសលដោយភាពជាឧក្រិដ្ឋនិងឱមក ៤និង៨ ព្រះអភិធម្មថ្នាក់ដំបូង ថ្ងៃទី ៦៤","y"],[65,"៦៥ អានិសង្ឃរបស់តិហេតុកនិងទុហេតុក ៤ន័យ ព្រះអភិធម្មថ្នាក់ដំបូង ថ្ងៃទី ៦៥","y"],[66,"៦៦ ចែកមហាកុសល៨ ដោយន័យ១៤ ព្រះអភិធម្មថ្នាក់ដំបូង ថ្ងៃទី ៦៦","y"],[67,"៦៧ ផ្តេីមមហាវិបាកចិត្ត៨ដួង ព្រះអភិធម្មថ្នាក់ដំបូង ថ្ងៃទី ៦៧","y"],[68,"៦៨ មហាវិបាក៨ដួង ព្រះអភិធម្មថ្នាក់ដំបូង ថ្ងៃទី ៦៨","y"],[69,"៦៩ មហាវិបាកផ្សេងគ្នា អំពីមហាកុសល ព្រះអភិធម្មថ្នាក់ដំបូង ថ្ងៃទី ៦៩","y"],[70,"៧០ កុសលកម្មឱ្យផលផ្សេងគ្នា ៧យ៉ាង  មហាវិបាក៨ ដោយន័យ១៤ និងដោយកិច្ច៤ ព្រះអភិធម្មថ្នាក់ដំបូងថ្ងៃទី៧០","y"],[71,"៧១  ចែកមហាវិបាកដួង ដោយន័យ១៤ ព្រះអភិធម្មថ្នាក់ដំបូង ថ្ងៃទី ៧១","y"],[72,"៧២ មហាកិរិយាចិត្ត៨ដួង ព្រះអភិធម្មថ្នាក់ដំបូង ថ្ងៃទី ៧២","y"],[73,"៧៣ ចែកមហាកិរិយាចិត្ត៨ដួង ដោយន័យ១៤ ព្រះអភិធម្មថ្នាក់ដំបូង ថ្ងៃទី ៧៣","y"],[74,"៧៤  រូបាវចសោភណចិត្ត ១៥ដួង រូបាវចរកុសល ៥ដួង ព្រះអភិធម្មថ្នាក់ដំបូង ថ្ងៃទី ៧៤","y"],[75,"៧៥  រូបាវចសោភណចិត្ត ១៥ដួង រូបាវចរកុសល ៥ដួង ព្រះអភិធម្មថ្នាក់ដំបូង ថ្ងៃទី ៧៥","y"],[76,"៧៦ រូបាវចសោភណចិត្ត ១៥ដួង អធិប្យាយអង្គឈាន៥ របស់បឋមឈាន ព្រះអភិធម្មថ្នាក់ដំបូង ថ្ងៃទី ៧៦","y"],[77,"៧៧ រូបាវចសោភណចិត្ត ១៥ដួង អធិប្យាយអង្គឈាន៥ ដោយបញ្ចកន័យអង្គឈាន៥ ព្រះអភិធម្មថ្នាក់ដំបូង ថ្ងៃទី ៧៧","y"],[78,"៧៨  រូបាវចសោភណចិត្ត ១៥ដួង ការលះនីវរណធម៌៥យ៉ាង ឈានមាន២យ៉ាង ព្រះអភិធម្មថ្នាក់ដំបូង ថ្ងៃទី ៧៨","y"],[79,"៧៩ អារម្មណ៍កម្មដ្ឋាន៤០ កសិណ១០ អសុភ១០ ព្រះអភិធម្មថ្នាក់ដំបូង ថ្ងៃទី ៧៩","y"],[80,"៨០ អារម្មណ៍កម្មដ្ឋាន៤០ អនុស្សតិ១០ ព្រះអភិធម្មថ្នាក់ដំបូង ថ្ងៃទី ៨០","y"],[81,"៨១ អារម្មណ៍កម្មដ្ឋាន៤០ ព្រហ្មវិហារ៤ អរូបជ្ឈាន៤ អាហារេបដិកូលសញ្ញា១ ព្រះអភិធម្មថ្នាក់ដំបូង ថ្ងៃទី ៨១","y"],[82,"៨២ អារម្មណ៍កម្មដ្ឋាន៤០ ដោយអាការៈ១០ និងសេចក្តីអធិប្បាយ ព្រះអភិធម្មថ្នាក់ដំបូង ថ្ងៃទី ៨២","y"],[83,"៨៣ អារម្មណ៍កម្មដ្ឋាន៤០ ដោយអាការៈ១០ និងសេចក្តីអធិប្បាយ លំដាប់នៃសមាធិ ព្រះអភិធម្មថ្នាក់ដំបូង ថ្ងៃទី៨៣","y"],[84,"៨៤ សេចក្តីអធិប្បាយរូបាវចរឈានកុសល៥ដួង ចែករូបាវចរសោភណចិត្តដោយន័យ១៤ន័យ ព្រះអភិធម្មថ្នាក់ដំបូងថ្ងៃទី៨៤","y"],[85,"៨៥ ការពន្យល់ពីអារម្មណ៍របស់សមថកម្មដ្ឋាន និង វិបស្សនាកម្មដ្ឋាន ព្រះអភិធម្មថ្នាក់ដំបូង ថ្ងៃទី ៨៥","y"],[86,"៨៦ រូបាវចរវិបាកចិត្ត ៥ដួង ព្រះអភិធម្មថ្នាក់ដំបូង ថ្ងៃទី ៨៦","y"],[87,"៨៧ រូបាវចរកុសលចិត្ត ៥ដួង \"ចប់\" ព្រះអភិធម្មថ្នាក់ដំបូង ថ្ងៃទី ៨៧","y"],[88,"៨៨ រូបាវចរកិរិយាចិត្ត ៥ដួង \"ចប់\" ព្រះអភិធម្មថ្នាក់ដំបូង ថ្ងៃទី ៨៨","y"],[89,"៨៩ អរូបាវចរកុសលចិត្ត ៤ដួង ព្រះអភិធម្មថ្នាក់ដំបូង ថ្ងៃទី ៨៩","y"],[90,"៩០ អរូបាវចរកុសលចិត្ត ៤ដួង \"ត\" ព្រះអភិធម្មថ្នាក់ដំបូង ថ្ងៃទី ៩០","y"],[91,"៩១ អំពីការចម្រើននេវសញ្ញានាសញ្ញាយតនៈ ព្រះអភិធម្មថ្នាក់ដំបូង ថ្ងៃទី ៩១","y"],[92,"៩២ លោកុត្តរចិត្ត ៨ដួង ព្រះអភិធម្មថ្នាក់ដំបូង ថ្ងៃទី៩២","y"],[93,"៩៣ លោកុត្តរចិត្ត ៨ដួង \"ត\" ព្រះអភិធម្មថ្នាក់ដំបូង ថ្ងៃទី៩៣","y"],[94,"៩៤ កិលេស៩កង ព្រះអភិធម្មថ្នាក់ដំបូង ថ្ងៃទី៩៤","y"],[95,"៩៥ អកុសល៩កង និង អកុសលចិត្ត១២ដួង លះដោយមគ្គចិត្ត ព្រះអភិធម្មថ្នាក់ដំបូង ថ្ងៃទី៩៥","y"],[96,"៩៦ លោកុត្តរចិត្ត៤០ ប្រកបដោយឈាន ព្រះអភិធម្មថ្នាក់ដំបូង ថ្ងៃទី៩៦","y"],[97,"៩៧ លោកុត្តរចិត្ត៨ដួង ដោយន័យ១៤ ព្រះអភិធម្មថ្នាក់ដំបូង ថ្ងៃទី៩៧","y"],[98,"៩៨ លោកុត្តរចិត្ត៨ដួង ដោយន័យ១៤ និង ព្រះសោតាបន្ន៣ប្រភេទ និង ២៤ពួក ព្រះអភិធម្មថ្នាក់ដំបូង ថ្ងៃទី៩៨","y"],[99,"៩៩ រាប់ព្រះអរិយបុគ្គលដោយពិស្តារ ព្រះអភិធម្មថ្នាក់ដំបូង ថ្ងៃទី៩៩","y"],[100,"១០០ ព្រះអរហន្ត ២ប្រភេទ និង ១២ពួក ព្រះអភិធម្មថ្នាក់ដំបូង ថ្ងៃទី១០០","y"],[101,"១០១ ចិត្ត ១២១ដួង ដោយន័យ ១៤ន័យ \"ចប់បរិច្ឆេទទី១ ចិត្តបរមត្ថ\" ព្រះអភិធម្មថ្នាក់ដំបូង ថ្ងៃទី១០១","y"],[102,"១០២ ការបិទថ្នាក់រៀន ព្រះអភិធម្មបរិច្ឆេទទី១ និងចំណាប់អារម្មណ៍សិស្ស ព្រះអភិធម្មថ្នាក់ដំបូង ថ្ងៃទី១០២","y"]]},{"i":8,"t":"vinh-sovoeurng","km":"Chapter 2 — Cetasikasangaha (2022)","en":"Chapter 2 — Cetasikasangaha (2022)","tp":["abhidhamma"],"L":[[1,"០១ ចេតសិកសង្គហវិភាគនិងសង្គហគាថា ព្រះអភិធម្ម បរិច្ឆេទទី២ ថ្ងៃដំបូង","y"],[2,"០២ លក្ខណាទិចតុកៈរបស់ចេតសិកនិងចេតសិកសង្គហៈ ព្រះអភិធម្ម បរិច្ឆេទទី២ ថ្ងៃទី២","y"],[3,"០៣ សព្វចិត្តសាធារណចេតសិក ព្រះអភិធម្ម បរិច្ឆេទទី២ ថ្ងៃទី៣","y"],[4,"០៤ បកិណ្ណកចេតសិក ៦ មោចតុកចេតសិក ៤ ព្រះអភិធម្ម បរិច្ឆេទទី២ ថ្ងៃទី៤","y"],[5,"០៥ លោតិកៈ ៣ ទោចតុកៈ ៤ ព្រះអភិធម្ម បរិច្ឆេទទី២ ថ្ងៃទី៥","y"],[6,"០៦ ថីទុកៈ ២ វិចិកិច្ឆា ១ ព្រះអភិធម្ម បរិច្ឆេទទី២ ថ្ងៃទី៦","y"],[7,"០៧ សោភណចេតសិក ២៦ សោភណសាធារណចេតសិក ១៩ ព្រះអភិធម្ម បរិច្ឆេទទី២ ថ្ងៃទី៧","y"],[8,"០៨ សោភណចេតសិក ២៦ សោភណសាធារណចេតសិក ១៩ \"ត\" ព្រះអភិធម្ម បរិច្ឆេទទី២ ថ្ងៃទី៨","y"],[9,"០៩ សោភណចេតសិក ២៥ សោភណសាធារណចេតសិក ១៩ \"ចប់\" ព្រះអភិធម្ម បរិច្ឆេទទី២ ថ្ងៃទី៩","y"],[10,"១០ សោភណចេតសិក ២៥ \"ចប់\" ព្រះអភិធម្ម បរិច្ឆេទទី២ ថ្ងៃទី១០","y"],[11,"១១ អធិប្បាយសព្វចិត្តសាធារណចេតសិក ៧ ព្រះអភិធម្ម បរិច្ឆេទទី២ ថ្ងៃទី១១","y"],[12,"១២ អធិប្បាយផស្សនិទ្ទេស លក្ខណាទិចតុកៈរបស់ផស្ស ព្រះអភិធម្ម បរិច្ឆេទទី២ ថ្ងៃទី១២","y"],[13,"១៣ វេទនាចេតសិក និងការអធិប្បាយ ព្រះអភិធម្ម បរិច្ឆេទទី២ ថ្ងៃទី១៣","y"],[14,"១៤ លក្ខណាទិចតុកៈ របស់វេទនា ព្រះអភិធម្ម បរិច្ឆេទទី២ ថ្ងៃទី១៤","y"],[15,"១៥ លក្ខណាទិចតុក្កៈ របស់ទោមនស្សវេទនា ព្រះអភិធម្ម បរិច្ឆេទទី២ ថ្ងៃទី១៥","y"],[16,"១៦ អំពី ឧបេក្ខា ១០យ៉ាង ព្រះអភិធម្ម បរិច្ឆេទទី២ ថ្ងៃទី១៦","y"],[17,"១៧ ពោលអំពី សញ្ញាចេតសិក ព្រះអភិធម្ម បរិច្ឆេទទី២ ថ្ងៃទី១៧","y"],[18,"១៨ អធិប្បាយសញ្ញាចេតសិក ចេតនាចេតសិក ព្រះអភិធម្ម បរិច្ឆេទទី២ ថ្ងៃទី១៨","y"],[19,"១៩ អធិប្បាយ ចេតនាចេតសិក ព្រះអភិធម្ម បរិច្ឆេទទី២ ថ្ងៃទី១៩","y"],[20,"២០ និទ្ទេស និង លក្ខណាទិចតុកៈឯកគ្គតា សមាធិមានសភាពជាប្រធាន ព្រះអភិធម្ម បរិច្ឆេទទី២ ថ្ងៃទី២០","y"],[21,"២១ សមាធិ និង សមថៈ ព្រះអភិធម្ម បរិច្ឆេទទី២ ថ្ងៃទី២១","y"],[22,"២២ ជីវិតិន្ទ្រិយចេតសិក មនសិការចេតសិក និង លក្ខណាទិចតុកៈ ព្រះអភិធម្ម បរិច្ឆេទទី២ ថ្ងៃទី២២","y"],[23,"២៣ មនសិការមាន ៣យ៉ាង អំពីចេតនានិងមនសិការចេតសិក ព្រះអភិធម្ម បរិច្ឆេទទី២ ថ្ងៃទី២៣","y"],[24,"២៤ ការចែកសព្វចិត្តសាធារណចេតសិក៧ ដោយន័យផ្សេងៗ ព្រះអភិធម្ម បរិច្ឆេទទី២ ថ្ងៃទី២៤","y"],[25,"២៥ ការចែកសព្វចិត្តសាធារណចេតសិក៧ ដោយន័យផ្សេងៗ \"ចប់\" ព្រះអភិធម្ម បរិច្ឆេទទី២ ថ្ងៃទី២៥","y"],[26,"២៦ បកិណ្ណកចេតសិក៦\"វិត្តកចេតសិក\" ព្រះអភិធម្ម បរិច្ឆេទទី២ ថ្ងៃទី២៦","y"],[29,"២៩ បកិណ្ណកចេតសិក \"វីរិយៈចេតសិក\" ព្រះអភិធម្ម បរិច្ឆេទទី២ ថ្ងៃទី២៩","y"],[30,"៣០ បកិណ្ណកចេតសិក \"វីរិយៈ-បីតិ\" ព្រះអភិធម្ម បរិច្ឆេទទី២ ថ្ងៃទី៣០","y"],[31,"៣១ បកិណ្ណកចេតសិក \"បីតិ និង ឆន្ទៈ\" ព្រះអភិធម្ម បរិច្ឆេទទី២ ថ្ងៃទី៣១","y"],[32,"៣២ សង្គ្រោះអញ្ញសមានាចេតសិក១៣ ដោយខន្ធអាយតន ដោយធាតុនិងដោយឥន្ទ្រីយ ព្រះអភិធម្ម បរិច្ឆេទទី២ថ្ងៃទី៣២","y"],[33,"៣៣ សង្គ្រោះអញ្ញសមានាចេតសិក១៣ ដោយសច្ចៈ និងដោយអាហារ ព្រះអភិធម្ម បរិច្ឆេទទី២ ថ្ងៃទី៣៣","y"],[34,"៣៤ ផ្តេីមអកុសលចេតសិក១៤\"មោចតុកៈ\" ព្រះអភិធម្ម បរិច្ឆេទទី២ ថ្ងៃទី៣៤","y"],[35,"៣៥ អធិប្បាយមោហៈ ព្រះអភិធម្ម បរិច្ឆេទទី២ ថ្ងៃទី៣៥","y"],[36,"៣៦ អធិប្បាយមោហៈ\"ចប់\" ព្រះអភិធម្ម បរិច្ឆេទទី២ ថ្ងៃទី៣៦","y"],[37,"៣៧ អធិប្បាយអកុសលចេតសិក ព្រះអភិធម្ម បរិច្ឆេទទី២ ថ្ងៃទី៣៧","y"],[38,"៣៨ ការមិនដឹងនៅធម៌៨ប្រការ ព្រះអភិធម្ម បរិច្ឆេទទី២ ថ្ងៃទី៣៨","y"],[39,"៣៩ លក្ខណាទិចតុក្កៈរបស់អវិជ្ជា ព្រះអភិធម្ម បរិច្ឆេទទី២ ថ្ងៃទី៣៩","y"],[40,"៤០ អហិរិកចេតសិក និងលក្ខណាទិចតុក្កៈ ព្រះអភិធម្ម បរិច្ឆេទទី២ ថ្ងៃទី៤០","y"],[41,"៤១ អនោត្តប្បចេតសិក និងលក្ខណាទិចតុក្កៈ ព្រះអភិធម្ម បរិច្ឆេទទី២ ថ្ងៃទី៤១","y"],[42,"៤២ ឧទ្ធច្ចចេតសិក និងលក្ខណាទិចតុក្កៈ ព្រះអភិធម្ម បរិច្ឆេទទី២ ថ្ងៃទី៤២","y"],[43,"៤៣ លក្ខណាទិចតុក្កៈរបស់ឧទ្ធច្ចៈ ព្រះអភិធម្ម បរិច្ឆេទទី២ ថ្ងៃទី៤៣","y"],[44,"៤៤ លោភចេតសិក និងលក្ខណាទិចតុកៈ ព្រះអភិធម្ម បរិច្ឆេទទី២ ថ្ងៃទី៤៤","y"],[45,"៤៥ វេវចនៈរបស់លោភៈចេតសិក ទិដ្ឋិចេតសិក ព្រះអភិធម្ម បរិច្ឆេទទី២ ថ្ងៃទី៤៥","y"],[46,"៤៦ អធិប្បាយទិដ្ឋិចេតសិក ព្រះអភិធម្ម បរិច្ឆេទទី២ ថ្ងៃទី៤៦","y"],[47,"៤៧ អធិប្បាយទិដ្ឋិ \"ចប់\" លក្ខណាទិចតុករបស់ទិដ្ឋិចេតសិក ព្រះអភិធម្ម បរិច្ឆេទទី២ ថ្ងៃទី៤៧","y"],[48,"៤៨ សក្កាយទិដ្ឋិ២០ ព្រះអភិធម្ម បរិច្ឆេទទី២ ថ្ងៃទី៤៨","y"],[49,"៤៩ សក្កាយទិដ្ឋិ២០\"ត\" ព្រះអភិធម្ម បរិច្ឆេទទី២ ថ្ងៃទី៤៩","y"],[50,"៥០ សក្កាយទិដ្ឋិ២០\"ត\" ព្រះអភិធម្ម បរិច្ឆេទទី២ ថ្ងៃទី៥០","y"],[51,"៥១ សក្កាយទិដ្ឋិ២០\"ចប់\" ព្រះអភិធម្ម បរិច្ឆេទទី២ ថ្ងៃទី៥១","y"],[52,"៥២ មិច្ឆាទិដ្ឋិមានវត្ថុ១០មានៈចេតសិក និងលក្ខណាទិចតុកៈ ព្រះអភិធម្ម បរិច្ឆេទទី២ ថ្ងៃទី៥២","y"],[53,"៥៣ មានៈចេតសិក \"ចប់\" ព្រះអភិធម្ម បរិច្ឆេទទី២ ថ្ងៃទី៥៣","y"],[54,"៥៤ ទោសចេតសិក និងលក្ខណាទិចតុកៈ ព្រះអភិធម្ម បរិច្ឆេទទី២ ថ្ងៃទី៥៤","y"],[55,"៥៥ អាឃាតវត្ថ១០(ហេតុនៃគំនុំ)ទោសចេតសិក ព្រះអភិធម្ម បរិច្ឆេទទី២ ថ្ងៃទី៥៥","y"],[56,"៥៦ លក្ខណាទិចតុកៈរបស់ឥស្សា មច្ឆរិយចេតសិក ព្រះអភិធម្ម បរិច្ឆេទទី២ ថ្ងៃទី៥៦","y"],[57,"៥៧ មច្ឆរិយចេតសិក និងលក្ខណាទិចតុកៈ ព្រះអភិធម្ម បរិច្ឆេទទី២ ថ្ងៃទី៥៧","y"],[58,"៥៨ កុក្កុច្ចចេតសិក និងលក្ខណាទិចតុកៈ ព្រះអភិធម្ម បរិច្ឆេទទី២ ថ្ងៃទី៥៨","y"],[59,"៥៩ ថីនៈចេតសិក និងលក្ខណាទិចតុកៈ មិទ្ធ:ចេតសិក ព្រះអភិធម្ម បរិច្ឆេទទី២ ថ្ងៃទី៥៩","y"],[60,"៦០ មិទ្ធៈចេតសិក និងលក្ខណាទិចតុក្កៈ ព្រះអភិធម្ម បរិច្ឆេទទី២ ថ្ងៃទី៦០","y"],[61,"៦១ ថីនៈចេតសិក និងលក្ខណាទិចតុកៈ មិទ្ធ:ចេតសិក ព្រះអភិធម្ម បរិច្ឆេទទី២ ថ្ងៃទី៦១","y"],[62,"៦២ សង្គ្រោះអកុសលចចេតសិក១៤ ក្នុង អកុសលធម៌៩កងសោភណចេតសិក២៥ដួង ព្រះអភិធម្ម បរិច្ឆេទទី២ ថ្ងៃទី៦២","y"],[63,"៦៣ អធិប្បាយសោភណចេតសិក ១៩ សទ្ធាចេតសិក និងលក្ខណាទិចតុក្កៈ ព្រះអភិធម្ម បរិច្ឆេទទី២ ថ្ងៃទី៦៣","y"],[64,"៦៤ សោតាបត្តិយង្គធម៌៤ និងគុណរបស់សោតាបន្ន ៤ ប្រការ សតិចេតសិក ព្រះអភិធម្ម បរិច្ឆេទទី២ ថ្ងៃទី៦៤","y"],[65,"៦៥ សតិចេតសិក និងលក្ខណាទិចតុក្កៈ ព្រះអភិធម្ម បរិច្ឆេទទី២ ថ្ងៃទី៦៥","y"],[66,"៦៦ អធិប្បាយសតិចេតសិក ព្រះអភិធម្ម បរិច្ឆេទទី២ ថ្ងៃទី៦៦","y"],[67,"៦៧ ហិរិ ឱត្តប្បៈចេតសិក និង លក្ខណាទិចតុក្កៈ ព្រះអភិធម្ម បរិច្ឆេទទី២ ថ្ងៃទី៦៧","y"],[69,"៦៩ អទោសៈចេតសិក និង លក្ខណាទិចតុក្កៈ ព្រះអភិធម្ម បរិច្ឆេទទី២ ថ្ងៃទី៦៩","y"],[70,"៧០ អធិប្បាយអទោសៈចេតសិក ព្រះអភិធម្ម បរិច្ឆេទទី២ ថ្ងៃទី៧០","y"],[71,"៧១ តត្រមជ្ឈត្តតាចេតសិក និងលក្ខណាទិចតុក្កៈ ព្រះអភិធម្ម បរិច្ឆេទទី២ ថ្ងៃទី៧១","y"],[72,"៧២ យុគលធម៌ ៦គូ (យុគលធម៌ ទី១ និងលក្ខណាទិចតុក្កៈ) ព្រះអភិធម្ម បរិច្ឆេទទី២ ថ្ងៃទី៧២","y"],[73,"៧៣ យុគលធម៌ ៦គូ (យុគលធម៌ ទី២ និងលក្ខណាទិចតុក្កៈ) ព្រះអភិធម្ម បរិច្ឆេទទី២ ថ្ងៃទី៧៣","y"],[74,"៧៤ កាយមុទុតា ចិត្តមុទុតា កាយកម្មញ្ញតា ចិត្តកម្មញ្ញតា ព្រះអភិធម្ម បរិច្ឆេទទី២ ថ្ងៃទី៧៤","y"],[75,"៧៥ កាយបាគុញ្ញតា ចិត្តបាគុញ្ញតា(យុគលធម៌ទី៥ និងលក្ខណាទិចតុក្កៈ ) ព្រះអភិធម្ម បរិច្ឆេទទី២ ថ្ងៃទី៧៥","y"],[76,"៧៦ កាយុជុកតា ចិត្តុជុកតា យុគលធម៌ទី៦និងលក្ខណាទិចតុក្កៈ ព្រះអភិធម្ម បរិច្ឆេទទី២ ថ្ងៃទី៧៦","y"],[77,"៧៧ អធិប្បាយវិរតិចេតសិក៣ សម្មាវាចាចេតសិក និង លក្ខណាទិចតុក្កៈ ព្រះអភិធម្ម បរិច្ឆេទទី២ ថ្ងៃទី៧៧","y"],[78,"៧៨ អធិប្បាយវិរតិចេតសិក៣ \"សម្មាកម្មន្តចេតសិក សម្មាអាជីវចេតសិក\" ព្រះអភិធម្ម បរិច្ឆេទទី២ ថ្ងៃទី៧៨","y"],[79,"៧៩ វិរតិមាន៣ប្រភេទ អធិប្បាយអប្បមញ្ញចេតសិក ករុណាចេតសិក ព្រះអភិធម្ម បរិច្ឆេទទី២ ថ្ងៃទី៧៩","y"],[80,"៨០ អប្បមញ្ញាចេតសិក២ ១-ករុណាចេតសិក ២-មុទិតាចេតសិក ព្រះអភិធម្ម បរិច្ឆេទទី២ ថ្ងៃទី៨០","y"],[81,"៨១ លក្ខណាទិចតុក្កៈ របស់មេត្តា និង ឧបេក្ខា ព្រះអភិធម្ម បរិច្ឆេទទី២ ថ្ងៃទី៨១","y"],[82,"៨២ អធិប្បាយបញ្ញាចេតសិក ព្រះអភិធម្ម បរិច្ឆេទទី២ ថ្ងៃទី៨២","y"],[83,"៨៣ លក្ខណាទិចតុក្កៈរបស់បញ្ញាចេតសិកកម្មស្សកតាបញ្ញា១០យ៉ាង ព្រះអភិធម្ម បរិច្ឆេទទី២ ថ្ងៃទី៨៣","y"],[84,"៨៤ បញ្ញាចេតសិក\"ចប់\" ព្រះអភិធម្ម បរិច្ឆេទទី២ ថ្ងៃទី៨៤","y"],[85,"៨៥ សម្បយោគន័យ ព្រះអភិធម្ម បរិច្ឆេទទី២ ថ្ងៃទី៨៥","y"],[86,"៨៦ សម្បយោគន័យ បកិណ្ណកចេតសិក ព្រះអភិធម្ម បរិច្ឆេទទី២ ថ្ងៃទី៨៦","y"],[87,"៨៧ សម្បយោគន័យ បកិណ្ណក\"ឆន្ទៈចេតសិក\" អកុសលចេតសិក ព្រះអភិធម្ម បរិច្ឆេទទី២ ថ្ងៃទី៨៧","y"],[88,"៨៨ សម្បយោគន័យ“សោភណចេតសិក” អនិយតយោគីចេតសិក ព្រះអភិធម្ម បរិច្ឆេទទី២ ថ្ងៃទី៨៨","y"],[89,"៨៩ អនិយតយោគីចេតសិក១១ចែកជា ៣ប្រភេទ និយតយោគីចេតសិក ៤១ ព្រះអភិធម្ម បរិច្ឆេទទី២ ថ្ងៃទី៨៩","y"],[90,"៩០ អធិប្បាយសង្គហន័យ ព្រះអភិធម្ម បរិច្ឆេទទី២ ថ្ងៃទី៩០","y"],[91,"៩១ អធិប្បាយសង្គហន័យ \"កាមាវចរសោភណចិត្ត មាន១២ន័យ\" ព្រះអភិធម្ម បរិច្ឆេទទី២ ថ្ងៃទី៩១","y"],[92,"៩២ សង្គហន័យកាមាវចរសោភណចិត្ត មាន១២ន័យ\"ចប់\" អកុសលចិត្តមាន៧ន័យ ព្រះអភិធម្ម បរិច្ឆេទទី២ ថ្ងៃទី៩២","y"],[93,"៩៣ អហេតុកសង្គហន័យ ព្រះអភិធម្ម បរិច្ឆេទទី២ ថ្ងៃទី៩៣","y"],[94,"៩៤ អំពីចេតសិកដែលធ្វើឲ្យចិត្តផ្សេងគ្នា ព្រះអភិធម្ម បរិច្ឆេទទី២ ថ្ងៃទី៩៤","y"],[95,"៩៥ តទុភយមិស្សកន័យ ព្រះអភិធម្ម បរិច្ឆេទទី២ ថ្ងៃទី៩៥","y"],[96,"៩៦ តទុភយមិស្សកន័យ “ សោភណចេតសិក\" ព្រះអភិធម្ម បរិច្ឆេទទី២ ថ្ងៃទី៩៦","y"],[97,"៩៧ អធិប្បាយសង្គហន័យ ព្រះអភិធម្ម បរិច្ឆេទទី២ ថ្ងៃទី៩៧","y"],[98,"៩៨ អធិប្បាយតទុភយមិស្សកន័យ ព្រះអភិធម្ម បរិច្ឆេទទី២ ថ្ងៃទី៩៨","y"],[99,"៩៩ ចប់ បរិច្ឆេទទី២ \"ចេតសិកបរមត្ថ\" ព្រះអភិធម្ម បរិច្ឆេទទី២ ថ្ងៃទី៩៩","y"]]},{"i":9,"t":"vinh-sovoeurng","km":"Chapter 3 — Pakinnakasangaha (2024)","en":"Chapter 3 — Pakinnakasangaha (2024)","tp":["abhidhamma"],"L":[[1,"១ ព្រះអភិធម្មបរិច្ឆេទទី៣ បកិណ្ណកសង្គហវិភាគ មេរៀនថ្ងៃទី ១","y"],[2,"២ ព្រះអភិធម្មបរិច្ឆេទទី៣ បកិណ្ណកសង្គហវិភាគ មេរៀនថ្ងៃទី ២","y"],[3,"៣ ព្រះអភិធម្មបរិច្ឆេទទី៣ បកិណ្ណកសង្គហវិភាគ មេរៀនថ្ងៃទី ៣","y"],[4,"៤ ព្រះអភិធម្មបរិច្ឆេទទី៣ បកិណ្ណកសង្គហវិភាគ មេរៀនថ្ងៃទី ៤","y"],[5,"៥ ព្រះអភិធម្មបរិច្ឆេទទី៣ បកិណ្ណកសង្គហវិភាគ មេរៀនថ្ងៃទី ៥","y"],[6,"៦ ព្រះអភិធម្មបរិច្ឆេទទី៣ បកិណ្ណកសង្គហវិភាគ មេរៀនថ្ងៃទី ៦","y"],[7,"៧ ព្រះអភិធម្មបរិច្ឆេទទី៣ បកិណ្ណកសង្គហវិភាគ មេរៀនថ្ងៃទី ៧","y"],[8,"៨ ព្រះអភិធម្មបរិច្ឆេទទី៣ បកិណ្ណកសង្គហវិភាគ មេរៀនថ្ងៃទី ៨ ទដ្ធព្វសូត្រ","y"],[9,"៩ ព្រះអភិធម្មបរិច្ឆេទទី៣ បកិណ្ណកសង្គហវិភាគ មេរៀនថ្ងៃទី ៩ ២-ហេតុសង្គហៈ","y"],[10,"១០ ព្រះអភិធម្មបរិច្ឆេទទី៣ បកិណ្ណកសង្គហវិភាគ មេរៀនថ្ងៃទី ១០ ២-ហេតុសង្គហៈ \"ត\"","y"],[11,"១១ ព្រះអភិធម្មបរិច្ឆេទទី៣ បកិណ្ណកសង្គហវិភាគ មេរៀនថ្ងៃទី ១១ ២-ហេតុសង្គហៈ \"ត\"","y"],[12,"១២ ព្រះអភិធម្មបរិច្ឆេទទី៣ បកិណ្ណកសង្គហវិភាគ មេរៀនថ្ងៃទី ១២ ២-ហេតុសង្គហៈ \"ត\"","y"],[13,"១៣ ព្រះអភិធម្មបរិច្ឆេទទី៣ បកិណ្ណកសង្គហវិភាគ មេរៀនថ្ងៃទី ១៣ ២-ហេតុសង្គហៈ\"ចប់\"","y"],[14,"១៤ ព្រះអភិធម្មបរិច្ឆេទទី៣ បកិណ្ណកសង្គហវិភាគ មេរៀនថ្ងៃទី ១៤ ៣-កិច្ចសង្គហៈ","y"],[15,"១៥ ព្រះអភិធម្មបរិច្ឆេទទី៣បកិណ្ណកសង្គហវិភាគ មេរៀនថ្ងៃទី១៥ ៣-កិច្ចសង្គហៈ\"ត\"សម្តែងកិច្ចរបស់ចិត្ត១៤","y"],[16,"១៦ ព្រះអភិធម្មបរិច្ឆេទទី៣ មេរៀនថ្ងៃទី១៦ ៣-កិច្ចសង្គហៈ \"ត\" សម្តែងការចែកកិច្ច ១៤ ដោយចិត្ត","y"],[17,"១៧ ព្រះអភិធម្មបរិច្ឆេទទី៣ មេរៀនថ្ងៃទី១៧ ៣-កិច្ចសង្គហៈ \"ត\" សម្តែងការចែកកិច្ច ១៤ ដោយចិត្ត","y"],[18,"១៨ ព្រះអភិធម្មបរិច្ឆេទទី៣ មេរៀនថ្ងៃទី១៨ ៣-កិច្ចសង្គហៈ \"ត\" សម្តែងការចែកចិត្ត៨៩ ឫ ១២១ដោយកិច្ច១៤","y"],[19,"១៩ ព្រះអភិធម្មបរិច្ឆេទទី៣មេរៀនថ្ងៃទី១៩ ៣-កិច្ចសង្គហៈ\"ត\"សម្តែងការចែកចិត្ត៨៩ឫ១២១ដោយកិច្ច១៤\"ចប់\"","y"],[20,"២០ ព្រះអភិធម្មបរិច្ឆេទទី៣មេរៀនថ្ងៃទី២០ ៣-កិច្ចសង្គហៈ\"ត\" អំពីកិច្ច១៤","y"],[21,"២១ព្រះអភិធម្មបរិច្ឆេទទី៣មេរៀនថ្ងៃទី២០ អំពីស្ថាន១០ ៣-កិច្ចសង្គហៈ\"ត\"សម្តែងការចែកចេតសិក៥២ដោយកិច្ច១៤","y"],[22,"២២ ព្រះអភិធម្មបរិច្ឆេទទី៣ មេរៀនថ្ងៃទី ២២ អំពីស្ថាន១០ ៣-កិច្ចសង្គហៈ\"ត\" ការចែកនូវស្ថាន១០ដោយចិត្ត","y"],[23,"២៣ ព្រះអភិធម្មបរិច្ឆេទទី៣ អំពីស្ថាន១០ ៣-កិច្ចសង្គហៈ\"ត\" សម្តែងការចែកចិត្តដោយកិច្ចនិងស្ថាន","y"],[24,"២៤ ព្រះអភិធម្មបរិច្ឆេទទី៣ អំពីស្ថាន១០ ៣-កិច្ចសង្គហៈ\"ត\" សម្តែងការចែកស្ថាន ២៥ ដោយន័យនៃវិថីចិត្ត","y"],[25,"២៥ ព្រះអភិធម្មបរិច្ឆេទទី៣ មេរៀនថ្ងៃទី២៥ សម្តែងការចែកស្ថាន ២៥ ដោយន័យនៃវិថីចិត្ត \"តចប់\" ចប់កិច្ច១៤","y"],[26,"២៦ ព្រះអភិធម្មបរិច្ឆេទទី ៣ បកិណ្ណកសង្គហវិភាគ មេរៀនថ្ងៃទី ២៦ ៤-ទ្វារសង្គហៈ","y"],[27,"២៧ ព្រះអភិធម្មបរិច្ឆេទទី ៣ បកិណ្ណកសង្គហវិភាគ មេរៀនថ្ងៃទី ២៧ ៤-ទ្វារសង្គហៈ ”ត\"","y"],[28,"២៨ ព្រះអភិធម្មបរិច្ឆេទទី ៣ បកិណ្ណកសង្គហវិភាគ មេរៀនថ្ងៃទី ២៨ ៤-ទ្វារសង្គហៈ ”ត\"","y"],[29,"២៩ ព្រះអភិធម្មបរិច្ឆេទទី ៣ បកិណ្ណកសង្គហវិភាគ មេរៀនថ្ងៃទី ២៨ ៤-ទ្វារសង្គហៈ ”ត\"","y"],[30,"៣០ ព្រះអភិធម្មបរិច្ឆេទទី ៣ បកិណ្ណកសង្គហវិភាគ មេរៀនថ្ងៃទី ៣០ ៤-ទ្វារសង្គហៈ ”ត\"","y"],[31,"៣១ ព្រះអភិធម្មបរិច្ឆេទទី ៣ មេរៀនថ្ងៃទី ៣១ ៤-ទ្វារសង្គហៈ ”ត\" សង្គ្រោះចេតសិកដែលកើតក្នុងទ្វារ","y"],[32,"៣២ ព្រះអភិធម្មបរិច្ឆេទទី៣ ៤-ទ្វារសង្គហៈ ”ត\" ការចែកចេតសិកដែលកើតក្នុងទ្វារជាឯកន្តៈ និង អនេកន្តៈ","y"],[33,"៣៣ ព្រះអភិធម្មបរិច្ឆេទទី ៣ បកិណ្ណកសង្គហវិភាគ មេរៀនថ្ងៃទី ៣៣ ៤-ទ្វារសង្គហៈ ”ត\"","y"],[34,"៣៤ ព្រះអភិធម្មបរិច្ឆេទទី ៣ បកិណ្ណកសង្គហវិភាគ មេរៀនថ្ងៃទី ៣៤ ៦-អារម្មណសង្គហៈ","y"],[35,"៣៥ ព្រះអភិធម្មបរិច្ឆេទទី ៣ បកិណ្ណកសង្គហវិភាគ មេរៀនថ្ងៃទី ៣៥ ៦-អារម្មណសង្គហៈ","y"],[36,"៣៦ ព្រះអភិធម្មបរិច្ឆេទទី៣បកិណ្ណកសង្គហវិភាគ មេរៀនថ្ងៃទី ៣៦ ៦-អារម្មណសង្គហៈ \"អំណាចរបស់អារម្មណ៏ ៦\"","y"],[37,"៣៧ ព្រះអភិធម្មបរិច្ឆេទទី៣ ៦-អារម្មណសង្គហៈ \"ការចែកទ្វារិក និង ទ្វារវិមុត្តិចិត្ត ដោយអារម្មណ៏៦\"","y"],[38,"៣៨ ព្រះអភិធម្មបរិច្ឆេទទី៣ ៦-អារម្មណសង្គហៈ \"ការចែកទ្វារិក និង ទ្វារវិមុត្តិចិត្ត ដោយអារម្មណ៏៦\"","y"],[39,"៣៩ ព្រះអភិធម្មបរិច្ឆេទទី៣ ៦-អារម្មណសង្គហៈ \"ការចែកទ្វារិក និង ទ្វារវិមុត្តិចិត្ត ដោយអារម្មណ៏៦\"","y"],[40,"៤០ ព្រះអភិធម្មបរិច្ឆេទទី៣ ៦-អារម្មណសង្គហៈ \"ការចែកទ្វារិក និង ទ្វារវិមុត្តិចិត្ត ដោយអារម្មណ៏៦\"","y"],[41,"៤១ ព្រះអភិធម្មបរិច្ឆេទទី៣ ៦-អារម្មណសង្គហៈ \"ការចែកទ្វារិក និង ទ្វារវិមុត្តិចិត្ត ដោយអារម្មណ៏៦\"","y"],[42,"៤២ មេរៀនថ្ងៃទី៤២ ៦-អារម្មណសង្គហៈ សម្តៃងចិត្តដែលទទួលអារម្មណ៏ដោយឯកន្តៈ៤ប្រភេទ និងដោយអនេកន្តៈ៣ប្រភេទ","y"],[43,"៤៣ ព្រះអភិធម្មបរិច្ឆេទទី៣បកិណ្ណកសង្គហវិភាគ មេរៀនថ្ងៃទី៤៣ ៦-អារម្មណសង្គហៈ ការចែកចិត្ត៦០ ឫ ៩២ដួង","y"],[44,"៤៤ ព្រះអភិធម្មបរិច្ឆេទទី៣បកិណ្ណកសង្គហវិភាគ មេរៀនថ្ងៃទី ៤៤ ៦-អារម្មណសង្គហៈ ការចែកចិត្ត៦០ឫ ៩២ដួង","y"],[45,"៤៥ ព្រះអភិធម្មបរិច្ឆេទទី៣បកិណ្ណកសង្គហវិភាគ មេរៀនថ្ងៃទី ៤៥ ៦-អារម្មណសង្គហៈ ការចែកចិត្ត៦០ឬ ៩២ដួង","y"],[46,"៤៦ ព្រះអភិធម្មបរិច្ឆេទទី៣បកិណ្ណកសង្គហវិភាគ មេរៀនថ្ងៃទី ៤៦ ៦-អារម្មណសង្គហៈ ការចែកចិត្ត៦០ឬ ៩២ដួង","y"],[47,"៤៧ ព្រះអភិធម្មបរិច្ឆេទទី៣បកិណ្ណកសង្គហវិភាគមេរៀនថ្ងៃទី៤៧ ៦-អារម្មណសង្គហៈ ការអធិប្បាយក្នុងគាថាទី១១","y"],[48,"៤៨ ព្រះអភិធម្មបរិច្ឆេទទី៣បកិណ្ណកសង្គហវិភាគមេរៀនថ្ងៃទី៤៨ ៦-អារម្មណសង្គហៈ ការអធិប្បាយក្នុងគាថាទី១១","y"],[49,"៤៩ ព្រះអភិធម្មបរិច្ឆេទទី៣បកិណ្ណកសង្គហវិភាគមេរៀនថ្ងៃទី៤៩ ៦-អារម្មណសង្គហៈ ការអធិប្បាយក្នុងគាថាទី១១","y"],[50,"៥០ ព្រះអភិធម្មបរិច្ឆេទទី៣បកិណ្ណកសង្គហវិភាគមេរៀនថ្ងៃទី៥០ ៦-អារម្មណសង្គហៈ ការអធិប្បាយក្នុងគាថាទី១១","y"],[51,"៥១ ព្រះអភិធម្មបរិច្ឆេទទី ៣ មេរៀនថ្ងៃទី ៥១ ៦-អារម្មណសង្គហៈ អារម្មណ៍របស់ទ្វារវិមុត្តិចិត្ត","y"],[52,"៥២ ព្រះអភិធម្មបរិច្ឆេទទី៣ មេរៀនថ្ងៃទី ៥២ ៦-អារម្មណសង្គហៈ អារម្មណ៍របស់ទ្វារវិមុត្តិចិត្ត ៣ប្រភេទ","y"],[53,"៥៣ ព្រះអភិធម្មបរិច្ឆេទទី៣ មេរៀនថ្ងៃទី ៥៣ ៦-អារម្មណសង្គហៈ អារម្មណ៏របស់ទ្វារវិមុត្តិចិត្ត ៣ប្រភេទ","y"],[54,"៥៤ ព្រះអភិធម្មបរិច្ឆេទទី៣ មេរៀនថ្ងៃទី ៥៤ ៦-អារម្មណសង្គហៈ អារម្មណ៏របស់ទ្វារវិមុត្តិចិត្ត ៣ប្រភេទ","y"],[55,"៥៥ ព្រះអភិធម្មបរិច្ឆេទទី ៣ បកិណ្ណកសង្គហវិភាគ មេរៀនថ្ងៃទី ៥៥ ៦-អារម្មណសង្គហៈ អារម្មណ៏ពិស្តារ ២១","y"],[56,"៥៦ ព្រះអភិធម្មបរិច្ឆេទទី ៣ បកិណ្ណកសង្គហវិភាគ មេរៀនថ្ងៃទី ៥៦ ៦-អារម្មណសង្គហៈ អារម្មណ៍ពិស្តារ ២១","y"],[57,"៥៧ ព្រះអភិធម្មបរិច្ឆេទទី ៣ បកិណ្ណកសង្គហវិភាគ មេរៀនថ្ងៃទី ៥៧ ៦-អារម្មណសង្គហៈ អារម្មណ៍ពិស្តារ ២១","y"],[58,"៥៨ ព្រះអភិធម្មបរិច្ឆេទទី ៣ បកិណ្ណកសង្គហវិភាគ មេរៀនថ្ងៃទី ៥៨ ៦-អារម្មណសង្គហៈ អារម្មណ៍ពិស្តារ ២១","y"],[59,"៥៩ ព្រះអភិធម្មបរិច្ឆេទទី ៣ បកិណ្ណកសង្គហវិភាគ មេរៀនថ្ងៃទី ៥៩ ៦-អារម្មណសង្គហៈ អារម្មណ៍ពិស្តារ ២១","y"],[60,"៦០ ព្រះអភិធម្មបរិច្ឆេទទី៣បកិណ្ណកសង្គហវិភាគមេរៀនថ្ងៃទី៦០ ៦-អារម្មណសង្គហៈការសម្តែងអារម្មណ៏របស់ចិត្ត","y"],[61,"៦១ ព្រះអភិធម្មបរិច្ឆេទទី៣បកិណ្ណកសង្គហវិភាគមេរៀនថ្ងៃទី៦១ ៦-អារម្មណសង្គហៈការសម្តែងអារម្មណ៍របស់ចិត្ត","y"],[62,"៦២ ព្រះអភិធម្មបរិច្ឆេទទី៣បកិណ្ណកសង្គហវិភាគមេរៀនថ្ងៃទី៦២ ៦-អារម្មណសង្គហៈការសម្តែងអារម្មណ៍របស់ចិត្ត","y"],[63,"៦៣ ព្រះអភិធម្មបរិច្ឆេទទី៣ ៦-អារម្មណសង្គហៈការចែកចេតិក ដែលទទួលអារម្មណ៍ ២១ដោយឯកន្តៈ និងអនេកន្តៈ","y"],[64,"៦៤ ព្រះអភិធម្មបរិច្ឆេទទី៤ ៦-អារម្មណសង្គហៈការចែកចេតិក ដែលទទួលអារម្មណ៍ ២១ដោយឯកន្តៈ និងអនេកន្តៈ","y"],[65,"៦៥ ព្រះអភិធម្មបរិច្ឆេទទី ៣ បកិណ្ណកសង្គហវិភាគ មេរៀនថ្ងៃទី ៦៥ ៦-វត្ថុសង្គហៈ","y"],[66,"៦៦ ព្រះអភិធម្មបរិច្ឆេទទី ៣ បកិណ្ណកសង្គហវិភាគ មេរៀនថ្ងៃទី ៦៦ ៦-វត្ថុសង្គហៈ ចិត្ត ជាមួយនឹង វត្ថុ","y"],[67,"៦៧ ព្រះអភិធម្មបរិច្ឆេទទី៣ បកិណ្ណកសង្គហវិភាគមេរៀនថ្ងៃទី៦៧ ៦-វត្ថុសង្គហៈចេតសិក ជាមួយនឹង វត្ថុរូប","y"],[68,"៦៨ ព្រះអភិធម្មបរិច្ឆេទទី ៣ បកិណ្ណកសង្គហវិភាគមេរៀនថ្ងៃទី ៦៨ ៦-វត្ថុសង្គហៈ វត្ថុ ជាមួយនឹង ទ្វារ","y"],[69,"៦៩ ព្រះអភិធម្មបរិច្ឆេទទី ៣ បកិណ្ណកសង្គហវិភាគមេរៀនថ្ងៃទី ៦៩ ៦-វត្ថុសង្គហៈ វត្ថុ ជាមួយនឹង ទ្វារ","y"]]},{"i":10,"t":"vinh-sovoeurng","km":"Chapter 4 — Vithisangaha (2024)","en":"Chapter 4 — Vithisangaha (2024)","tp":["abhidhamma"],"L":[[1,"១ ផ្តើមវិថីសង្គហវិភាគ មេរៀនថ្ងៃទី ៤ ព្រះអភិធម្មបរិច្ឆេទទី ៤ វិថីសង្គហវិភាគ","y"],[2,"២ សង្គហគាថា មេរៀនថ្ងៃទី ២ ព្រះអភិធម្មបរិច្ឆេទទី ៤ វិថីសង្គហវិភាគ","y"],[3,"៣ អារម្មណ៏របស់វិថីមុត្តចិត្តមាន ៣ យ៉ាង មេរៀនថ្ងៃទី ៣ ព្រះអភិធម្មបរិច្ឆេទទី ៤ វិថីសង្គហវិភាគ","y"],[4,"៤ វិសយប្បវត្តិឆក្កៈទី ៦ មេរៀនថ្ងៃទី ៤ ព្រះអភិធម្មបរិច្ឆេទទី ៤ វិថីសង្គហវិភាគ","y"],[5,"៥ អាយុរបស់រូបធម៌ មេរៀនថ្ងៃទី ៥ ព្រះអភិធម្មបរិច្ឆេទទី ៤ វិថីសង្គហវិភាគ","y"],[6,"៦ អធិប្បាយវិថីចិត្ត ២ យ៉ាង មេរៀនថ្ងៃទី ៦ ព្រះអភិធម្មបរិច្ឆេទទី ៤ វិថីសង្គហវិភាគ","y"],[7,"៧ អធិប្បាយវិថីចិត្ត ២ យ៉ាង ១-កាមវិថីចិត្ត មេរៀនថ្ងៃទី ៧ ព្រះអភិធម្មបរិច្ឆេទទី ៤ វិថីសង្គហវិភាគ","y"],[8,"៨ អធិប្បាយវិថីចិត្ត២យ៉ាង ១-កាមវិថីចិត្ត\"អធិប្បាយសង្គហគាថា\" មេរៀនថ្ងៃទី៨ ព្រះអភិធម្មបរិច្ឆេទទី ៤","y"],[10,"១០ អធិប្បាយវិថីចិត្ត ២ យ៉ាង ១-កាមវិថីចិត្តអធិប្បាយវិសយប្បវត្តិ ៤ ន័យ មេរៀនថ្ងៃទី១០ បរិច្ឆេទទី ៤","y"],[11,"១១ អធិប្បាយវិថីចិត្ត២យ៉ាង ១-កាមវិថីចិត្ត មេរៀនថ្ងៃទី ១១ ព្រះអភិធម្មបរិច្ឆេទទី ៤ វិថីសង្គហវិភាគ","y"],[12,"១២ អធិប្បាយវិថីចិត្ត២យ៉ាង ១-កាមវិថីចិត្ត មេរៀនថ្ងៃទី ១២ ព្រះអភិធម្មបរិច្ឆេទទី ៤ វិថីសង្គហវិភាគ","y"],[13,"១៣ អធិប្បាយវិថីចិត្ត ២ យ៉ាង ១-កាមវិថីចិត្តអតិមហន្តារម្មណ៍ ៥ ប្រភេទ ព្រះអភិធម្មបរិច្ឆេទទី៤","y"],[14,"១៤ អធិប្បាយវិថីចិត្ត ២យ៉ាង ១-កាមវិថីចិត្ត អតិមហន្តារម្មណ៏ ៥ ប្រភេទ\"ចប់\" ព្រះអភិធម្មបរិច្ឆេទទី ៤","y"],[15,"១៥ អធិប្បាយវិថីចិត្ត ២ យ៉ាង ១-កាមវិថីចិត្តមហន្តារម្មណ៏ ដោយសង្ខេបមាន២ន័យ ព្រះអភិធម្មបរិច្ឆេទទី ៤","y"],[16,"១៦ អធិប្បាយវិថីចិត្ត២យ៉ាង ១-កាមវិថីចិត្តរូបវិថីមហន្តារម្មណ៏ដោយសង្ខេប២វិថី អភិធម្មបរិច្ឆេទទី៤","y"],[17,"១៧ អធិប្បាយវិថីចិត្ត២យ៉ាង ១-កាមវិថីចិត្តរូបវិថីមហន្តារម្មណ៏ដោយសង្ខេប២វិថី អភិធម្មបរិច្ឆេទទី៤","y"],[18,"១៨ អធិប្បាយវិថីចិត្ត២យ៉ាង ១-កាមវិថីចិត្ត មហន្តារម្មណ៍ មេរៀនថ្ងៃទី ១៨ ព្រះអភិធម្មបរិច្ឆេទទី៤","y"],[19,"១៩ អធិប្បាយវិថីចិត្ត ២ យ៉ាង ១-កាមវិថីចិត្ត អធិប្បាយមហន្តារម្មណ៏វិថី ព្រះអភិធម្មបរិច្ឆេទទី ៤","y"],[20,"២០ អធិប្បាយវិថីចិត្ត ២ យ៉ាង ១-កាមវិថីចិត្ត អធិប្បាយមហន្តារម្មណ៍វិថី ព្រះអភិធម្មបរិច្ឆេទទី ៤","y"],[21,"២១ អធិប្បាយវិថីចិត្ត ២ យ៉ាង ១-កាមវិថីចិត្ត អធិប្បាយមហន្តារម្មណ៍វិថី ព្រះអភិធម្មបរិច្ឆេទទី ៤","y"],[22,"២២ អធិប្បាយវិថីចិត្ត២យ៉ាង ១-កាមវិថីចិត្ត បរិត្តារម្មណ៏វិថី មាន៦វិថី ព្រះអភិធម្មបរិច្ឆេទទី ៤","y"],[23,"២៣ អធិប្បាយវិថីចិត្ត២យ៉ាង ១-កាមវិថីចិត្ត អតិបរិត្តារម្មណ៏វិថី មាន៦វិថី ព្រះអភិធម្មបរិច្ឆេទទី ៤","y"],[24,"២៤ អធិប្បាយវិថីចិត្ត២យ៉ាង  ១-កាមវិថីចិត្ត អធិប្បាយអារម្មណ៍៤ប្រភេទ  មានអតិមហន្តារម្មណ៍ជាដេីម","y"],[25,"២៥ អធិប្បាយវិថីចិត្ត២យ៉ាង ១-កាមវិថីចិត្ត អធិប្បាយបញ្ចទ្វារ ព្រះអភិធម្មបរិច្ឆេទទី ៤ មេរៀនថ្ងៃទី២៥","y"],[26,"២៦ អធិប្បាយវិថីចិត្ត២យ៉ាង ១-កាមវិថីចិត្ត អធិប្ប នាជវនមនោទ្វារវិថី ៧ វិថី\"ត\" មេរៀនថ្ងៃទី៦៧ ព្រះអភិធម្មបរិច្ឆេទទី ៤ វិថីសង្គហវិភាគ","y"],[68,"៦៨ អប្បនាវិថី \"អប្បនាជវនវារ:មានវេទនា២\" មេរៀនថ្ងៃទី៦៨ ព្រះអភិធម្មបរិច្ឆេទទី ៤ វិថីសង្គហវិភាគ","y"],[69,"៦៩ អប្បនាជវនវារៈមានវេទនា២ មេរៀនថ្ងៃទី៦៩ ព្រះអភិធម្មបរិច្ឆេទទី ៤ វិថីសង្គហវិភាគ","y"],[70,"៧០ អប្បនាជវនវារៈមានវេទនា២អធិប្បាយសង្គហគាថាទី\"៥\" មេរៀនថ្ងៃទី៧០ ព្រះអភិធម្មបរិច្ឆេទទី៤វិថីសង្គហវិភាគ","y"],[71,"៧១ អប្បនាជវនវារៈមានវេទនា២អធិប្បាយសង្គហគាថាទី\"៦\" មេរៀនថ្ងៃទី៧១ ព្រះអភិធម្មបរិច្ឆេទទី ៤","y"],[72,"៧២ ចប់\"អប្បនាជវនវិថី\" មេរៀនថ្ងៃទី៧២ ព្រះអភិធម្មបរិច្ឆេទទី ៤ វិថីសង្គហវិភាគ","y"],[73,"៧៣ ការប្រៀបធៀបគ្នារវាងកាមវិថី និង អប្បនាវិថី មេរៀនថ្ងៃទី៧៣ ព្រះអភិធម្មបរិច្ឆេទទី៤ វិថីសង្គហវិភាគ","y"],[74,"៧៤ ការប្រៀបធៀបគ្នារវាងកាមវិថី និង អប្បនាវិថី មេរៀនថ្ងៃទី៧៤ ព្រះអភិធម្មបរិច្ឆេទទី៤ វិថីសង្គហវិភាគ","y"],[75,"៧៥ បរិវសរវិថី ២ប្រភេទ មេរៀនថ្ងៃទី៧៥ ព្រះអភិធម្មបរិច្ឆេទទី៤ វិថីសង្គហវិភាគ","y"],[76,"៧៦ បរិវារវិថី ២ប្រភេទ មេរៀនថ្ងៃទី៧៦ ព្រះអភិធម្មបរិច្ឆេទទី៤ វិថីសង្គហវិភាគ","y"],[77,"៧៧ មរណាសន្នវិថី មេរៀនថ្ងៃទី៧៧ ព្រះអភិធម្មបរិច្ឆេទទី៤ វិថីសង្គហវិភាគ","y"],[78,"៧៨ មរណាសន្នវិថី\"ត\" មេរៀនថ្ងៃទី៧៨ ព្រះអភិធម្មបរិច្ឆេទទី៤ វិថីសង្គហវិភាគ","y"],[79,"៧៩ មរណាសន្នវិថី ៩ប្រភេទ មេរៀនថ្ងៃទី ៧៩ ព្រះអភិធម្មបរិច្ឆេទទី៤ វិថីសង្គហវិភាគ","y"],[80,"៨០ មរណាសន្នវិថី ៩ប្រភេទកាមចុតិមាន ២យ៉ាង មេរៀនថ្ងៃទី ៨០ ព្រះអភិធម្មបរិច្ឆេទទី៤ វិថីសង្គហវិភាគ","y"],[81,"៨១ កាមភពចុតិ និង បដិសន្ធិក្នុងកាមភពថ្មី ទី១ មេរៀនថ្ងៃទី៨១ព្រះអភិធម្មបរិច្ឆេទទី៤ វិថីសង្គហវិភាគ","y"],[82,"៨២ អធិប្បាយបញ្ចទ្វារមរណាសន្នវិថី ៤ប្រភេទ មេរៀនថ្ងៃទី ៨២ ព្រះអភិធម្មបរិច្ឆេទទី៤ វិថីសង្គហវិភាគ","y"],[83,"៨៣ អធិប្បាយបញ្ចទ្វារមរណាសន្នវិថី ៤ប្រភេទ មេរៀនថ្ងៃទី ៨៣ ព្រះអភិធម្មបរិច្ឆេទទី៤ វិថីសង្គហវិភាគ","y"],[84,"៨៤ អធិប្បាយបញ្ចទ្វារមរណាសន្នវិថី ៤ប្រភេទ មេរៀនថ្ងៃទី ៨៤ ព្រះអភិធម្មបរិច្ឆេទទី៤ វិថីសង្គហវិភាគ","y"],[85,"៨៥ អធិប្បាយបញ្ចទ្វារមរណាសន្នវិថី ៤ប្រភេទ\"ចប់\" មេរៀនថ្ងៃទី៨៥ ព្រះអភិធម្មបរិច្ឆេទទី៤ វិថីសង្គហវិភាគ","y"],[86,"៨៦ អធិប្បាយមនោទ្វារមរណាសន្នវិថី មេរៀនថ្ងៃទី ៨៦ ព្រះអភិធម្មបរិច្ឆេទទី៤ វិថីសង្គហវិភាគ","y"],[87,"៨៧ អធិប្បាយកាមជវនមនោទ្វារមរណាសន្នវិថី ៤វិថី-វិថីប្រភេទទី១ និងទី២ ព្រះអភិធម្មបរិច្ឆេទទី៤","y"],[88,"៨៨ អធិប្បាយកាមជវនមនោទ្វារមរណាសន្នវិថី ៤វិថី -វិថីប្រភេទទី៣ និងទី៤ ព្រះអភិធម្មបរិច្ឆេទទី៤","y"],[89,"៨៩ អធិប្បាយកាមជវនមនោទ្វារមរណាសន្នវិថី ៤វិថី -វិថីប្រភេទទី៣ និងទី៤\"ចប់\" ព្រះអភិធម្មបរិច្ឆេទទី៤","y"],[90,"៩០ អធិប្បាយកាមជវនមនោទ្វារមរណាសន្នវិថីកាមចុតិ-ទៅបដិសន្ធិក្នុងរូបព្រហ្ម១៦ ព្រះអភិធម្មបរិច្ឆេទទី៤","y"],[91,"៩១ អធិប្បាយកាមជវនមនោទ្វារមរណាសន្នវិថី ព្រះអរហន្តចុតិតអំពីកាមចិត្ត ព្រះអភិធម្មបរិច្ឆេទទី៤វិថីសង្គហ","y"],[92,"៩២ អធិប្បាយកាមជវនមនោទ្វារមរណាសន្នវិថី \"ចប់ដោយសង្ខេប\" ព្រះអភិធម្មបរិច្ឆេទទី៤ វិថីសង្គហវិភាគ","y"],[93,"៩៣ តទាលម្ពននិយម មេរៀនថ្ងៃទី ៩៣ ព្រះអភិធម្មបរិច្ឆេទទី៤ វិថីសង្គហវិភាគ","y"],[94,"៩៤ តទាលម្ពននិយម\"ចប់\" មេរៀនថ្ងៃទី ៩៤ ព្រះអភិធម្មបរិច្ឆេទទី៤ វិថីសង្គហវិភាគ","y"],[95,"៩៥ ជវននិយម មេរៀនថ្ងៃទី ៩៥ ព្រះអភិធម្មបរិច្ឆេទទី៤ វិថីសង្គហវិភាគ","y"],[96,"៩៦ ជវននិយម មេរៀនថ្ងៃទី ៩៦ ព្រះអភិធម្មបរិច្ឆេទទី៤ វិថីសង្គហវិភាគ","y"],[97,"៩៧ ចែកវិថីចិត្តតាមប្រភេទបុគ្គល មេរៀនថ្ងៃទី ៩៧ ព្រះអភិធម្មបរិច្ឆេទទី៤ វិថីសង្គហវិភាគ","y"],[98,"៩៨ ចែកវិថីចិត្តតាមប្រភេទបុគ្គល មេរៀនថ្ងៃទី ៩៨ ព្រះអភិធម្មបរិច្ឆេទទី៤ វិថីសង្គហវិភាគ","y"],[99,"៩៩ ចែកវិថីចិត្តតាមប្រភេទបុគ្គល មេរៀនថ្ងៃទី ៩៩ ព្រះអភិធម្មបរិច្ឆេទទី៤ វិថីសង្គហវិភាគ","y"],[100,"១០០ ចែកវិថីចិត្តតាមប្រភេទបុគ្គល មេរៀនថ្ងៃទី ១០០ ព្រះអភិធម្មបរិច្ឆេទទី៤ វិថីសង្គហវិភាគ","y"],[101,"១០១ ចែកវិថីចិត្តតាមប្រភេទបុគ្គល មេរៀនថ្ងៃទី ១០១ ព្រះអភិធម្មបរិច្ឆេទទី៤ វិថីសង្គហវិភាគ","y"],[102,"១០២ ចែកវិថីចិត្តតាមប្រភេទបុគ្គល មេរៀនថ្ងៃទី ១០២ ព្រះអភិធម្មបរិច្ឆេទទី៤ វិថីសង្គហវិភាគ","y"],[103,"១០៣ ចែកវិថីចិត្តតាមប្រភេទបុគ្គលកាមបុគ្គល\"ចប់\" មេរៀនថ្ងៃទី១០៣ព្រះអភិធម្មបរិច្ឆេទទី៤ វិថីសង្គហវិភាគ","y"],[104,"១០៤ ចែកវិថីចិត្តតាមប្រភេទបុគ្គលព្រហ្មបុគ្គល មេរៀនថ្ងៃទី ១០៤ ព្រះអភិធម្មបរិច្ឆេទទី៤ វិថីសង្គហវិភាគ","y"],[105,"១០៥ ចែកវិថីចិត្តតាមប្រភេទបុគ្គលព្រហ្មបុគ្គល មេរៀនថ្ងៃទី ១០៥ ព្រះអភិធម្មបរិច្ឆេទទី៤ វិថីសង្គហវិភាគ","y"],[106,"១០៦ ចែកវិថីចិត្តតាមប្រភេទបុគ្គលព្រហ្មបុគ្គល មេរៀនថ្ងៃទី ១០៦ ព្រះអភិធម្មបរិច្ឆេទទី៤ វិថីសង្គហវិភាគ","y"],[107,"១០៧ ចែកវិថីចិត្តតាមប្រភេទបុគ្គលព្រហ្មបុគ្គលដែលជាបុថុជ្ជន ចប់ ព្រះអភិធម្មបរិច្ឆេទទី៤","y"],[108,"១០៨ ចែកវិថីចិត្តតាមប្រភេទបុគ្គលព្រហ្មបុគ្គលដែលជាព្រះអរិយៈ មេរៀនថ្ងៃទី ១០៨ ព្រះអភិធម្មបរិច្ឆេទទី៤","y"],[109,"១០៩ ចែកវិថីចិត្តតាមប្រភេទបុគ្គល ព្រហ្មដែលជាអនាគាមីក្នុងសុទ្វាវាសភូមិ៥ ព្រះអភិធម្មបរិច្ឆេទទី៤","y"],[110,"១១០ ចែកវិថីចិត្តតាមប្រភេទបុគ្គលព្រហ្មដែលជាព្រះអរហន្តក្នុងបឋមជ្ឈានភូមិ៣ ព្រះអភិធម្មបរិច្ឆេទទី៤","y"],[111,"១១១ ចែកវិថីចិត្តតាមប្រភេទបុគ្គលអរូបព្រហ្មដែលជា សោតា សកទាគាមី អនាគាមី ក្នុងអរូបភូមិ៤ \"ចប់\"","y"],[112,"១១២ចែកវិថីចិត្តតាមប្រភេទបុគ្គលអរូបព្រហ្មដែលជា ព្រះអរហន្តក្នុងអរូបភូមិទី១ និងអរូបភូមិទី២","y"],[113,"១១៣ ចែកវិថីចិត្តតាមប្រភេទបុគ្គលអរូបព្រហ្មដែលជា ព្រះអរហន្តក្នុងអរូបភូមិទី៣","y"],[114,"១១៤ ចែកវិថីចិត្តតាមប្រភេទបុគ្គលអរូបព្រហ្មដែលជា ព្រះអរហន្ត ក្នុងអរូបភូមិទី៤","y"],[115,"១១៥ ការចែកវិថីចិត្តក្នុងភូមិផ្សេងៗ មេរៀនថ្ងៃទី ១១៥ ព្រះអភិធម្មបរិច្ឆេទទី៤ វិថីសង្គហវិភាគ","y"],[116,"១១៦ រូបវិថី មេរៀនថ្ងៃទី ១១៦ ព្រះអភិធម្មបរិច្ឆេទទី៤ វិថីសង្គហវិភាគ","y"],[117,"១១៧ រូបវិថី មេរៀនថ្ងៃទី ១១៧ ព្រះអភិធម្មបរិច្ឆេទទី៤ វិថីសង្គហវិភាគ","y"],[118,"១១៨ រូបវិថី មេរៀនថ្ងៃទី ១១៨ ព្រះអភិធម្មបរិច្ឆេទទី៤ វិថីសង្គហវិភាគ","y"],[119,"១១៩ រូបវិថី១ មេរៀនថ្ងៃទី ១១៩ ព្រះអភិធម្មបរិច្ឆេទទី៤ វិថីសង្គហវិភាគ","y"],[120,"១២០ រូបវិថី១ មេរៀនថ្ងៃទី ១២០ ព្រះអភិធម្មបរិច្ឆេទទី៤ វិថីសង្គហវិភាគ","y"],[121,"១២១ រូបវិថី១ មេរៀនថ្ងៃទី ១២១ ព្រះអភិធម្មបរិច្ឆេទទី៤ វិថីសង្គហវិភាគ","y"],[123,"១២៣ រូបវិថី១ មេរៀនថ្ងៃទី ១២៣ ព្រះអភិធម្មបរិច្ឆេទទី៤ វិថីសង្គហវិភាគ","y"],[124,"១២៤ រូបវិថី១ មេរៀនថ្ងៃទី ១២៤ ព្រះអភិធម្មបរិច្ឆេទទី៤ វិថីសង្គហវិភាគ","y"],[125,"១២៥ រូបវិថីទី២ មេរៀនថ្ងៃទី ១២៥ ព្រះអភិធម្មបរិច្ឆេទទី៤ វិថីសង្គហវិភាគ","y"],[126,"១២៦ រូបវិថីទី២ មេរៀនថ្ងៃទី ១២៦ ព្រះអភិធម្មបរិច្ឆេទទី៤ វិថីសង្គហវិភាគ","y"],[127,"១២៧ រូបវិថីទី៣ មេរៀនថ្ងៃទី ១២៧ ព្រះអភិធម្មបរិច្ឆេទទី៤ វិថីសង្គហវិភាគ","y"],[128,"១២៨ អធិប្បាយរូបវិថីទី៣ មេរៀនថ្ងៃទី ១២៨ ព្រះអភិធម្មបរិច្ឆេទទី៤ វិថីសង្គហវិភាគ","y"],[129,"១២៩ រូបវិថីទី៤ និងសេចក្តីអធិប្បាយ មេរៀនថ្ងៃទី ១២៩ ព្រះអភិធម្មបរិច្ឆេទទី៤ វិថីសង្គហវិភាគ","y"],[130,"១៣០ រូបវិថីទី៥ និងសេចក្តីអធិប្បាយ មេរៀនថ្ងៃទី ១៣០ ព្រះអភិធម្មបរិច្ឆេទទី៤ វិថីសង្គហវិភាគ","y"],[131,"១៣១ រូបវិថីទី៥ និងសេចក្ត ],"L":[[1,"ព្រះអភិធម្មបរិច្ឆេទទី៨ បច្ចយសង្គហ បដិច្ចសមុប្បាទទីបនី(ម៉ោងទី ០១) និយមន័យបដិច្ចសមុប្បាទ និងលក្ខណាទិចតុក្កៈ","a"],[2,"ព្រះអភិធម្មបរិច្ឆេទទី៨ បច្ចយសង្គហ បដិច្ចសមុប្បាទទីបនី(ម៉ោងទី ០២) និយមន័យបដ្ឋាន មាន ៣","a"],[3,"ព្រះអភិធម្មបរិច្ឆេទទី៨ បច្ចយសង្គហ បដិច្ចសមុប្បាទទីបនី(ម៉ោងទី ០៣) ហេតុប្បច្ច័យ អារម្មណប្បច្ច័យ អធិបតិប្បច្ច័យ","a"],[4,"ព្រះអភិធម្មបរិច្ឆេទទី៨ បច្ចយសង្គហ បដិច្ចសមុប្បាទទីបនី(ម៉ោងទី ០៤) អង្គធម៌របស់អនន្តរ សមនន្តរ សហជាត និស្សយប្បច្ច័យ","a"],[5,"ព្រះអភិធម្មបរិច្ឆេទទី៨ បច្ចយសង្គហ បដិច្ចសមុប្បាទទីបនី(ម៉ោងទី ០៥) អង្គធម៌របស់ឧបនិស្សយប្បច្ច័យ ទីអាស្រ័យដ៏មានកម្លាំង","a"],[6,"ព្រះអភិធម្មបរិច្ឆេទទី៨ បច្ចយសង្គហ បដិច្ចសមុប្បាទទីបនី(ម៉ោងទី ០៦) អង្គធម៌របស់ឧបនិស្សយប្បច្ច័យ បកតូបនិស្ស័យ","a"],[7,"ព្រះអភិធម្មបរិច្ឆេទទី៨ បច្ចយសង្គហ បដិច្ចសមុប្បាទទីបនី(ម៉ោងទី ០៧)ពន្យល់បកតូបនិស្សយប្បច្ច័យ អព្យាកតជាបច្ច័យដល់កុសលធម៌","a"],[8,"ព្រះអភិធម្មបរិច្ឆេទទី៨ បច្ចយសង្គហ បដិច្ចសមុប្បាទទីបនី(ម៉ោងទី ០៨)ពន្យល់បកតូបនិស្សយប្បច្ច័យ និងបុរេជាតប្បច្ច័យ","a"],[9,"ព្រះអភិធម្មបរិច្ឆេទទី៨ បច្ចយសង្គហ បដិច្ចសមុប្បាទទីបនី(ម៉ោងទី ០៩)ពន្យល់បុរេជាតប្បច្ច័យ និងបច្ឆាជាតប្បច្ច័យ","a"],[10,"ព្រះអភិធម្មបរិច្ឆេទទី៨ បច្ចយសង្គហ បដិច្ចសមុប្បាទទីបនី(ម៉ោងទី ១០)ពន្យល់អាសេវនប្បច្ច័យ ការសេពរឿយៗ","a"],[11,"ព្រះអភិធម្មបរិច្ឆេទទី៨ បច្ចយសង្គហ បដិច្ចសមុប្បាទទីបនី(ម៉ោងទី ១១)ពន្យល់កម្មប្បច្ច័យ កម្មជាបច្ច័យ","a"],[12,"ព្រះអភិធម្មបរិច្ឆេទទី៨ បច្ចយសង្គហ បដិច្ចសមុប្បាទទីបនី(ម៉ោងទី ១២)ពន្យល់កម្មប្បច្ច័យ កុសលជាបច្ច័យកុសល និងអព្យាកត","a"],[13,"ព្រះអភិធម្មបរិច្ឆេទទី៨ បច្ចយសង្គហ បដិច្ចសមុប្បាទទីបនី(ម៉ោងទី ១៣)ពន្យល់នានក្ខណិកកម្មប្បច្ច័យ បច្ច័យក្នុងខណៈផ្សេងៗ","a"],[14,"ព្រះអភិធម្មបរិច្ឆេទទី៨ បច្ចយសង្គហ បដិច្ចសមុប្បាទទីបនី(ម៉ោងទី ១៤)ពន្យល់នានក្ខណិកកម្មប្បច្ច័យ និងវិបាកប្បច្ច័យ","a"],[15,"ព្រះអភិធម្មបរិច្ឆេទទី៨ បច្ចយសង្គហ បដិច្ចសមុប្បាទទីបនី(ម៉ោងទី ១៥)អាហារប្បច្ច័យ រូបអាហារប្បច្ច័យ","a"],[16,"ព្រះអភិធម្មបរិច្ឆេទទី៨ បច្ចយសង្គហ បដិច្ចសមុប្បាទទីបនី(ម៉ោងទី ១៦)អាហារប្បច្ច័យ រូបអាហារប្បច្ច័យចែកតាមសមុដ្ឋាន៤","a"],[17,"ព្រះអភិធម្មបរិច្ឆេទទី៨ បច្ចយសង្គហ បដិច្ចសមុប្បាទទីបនី(ម៉ោងទី ១៧)ចែកបញ្ហាវារៈរបស់នាមអារប្បច្ច័យ","a"],[18,"ព្រះអភិធម្មបរិច្ឆេទទី៨ បច្ចយសង្គហ បដិច្ចសមុប្បាទទីបនី(ម៉ោងទី ១៨)ចែកបញ្ហាវារៈរបស់នាមអាហារប្បច្ច័យបញ្ចប់","a"],[19,"ព្រះអភិធម្មបរិច្ឆេទទី៨ បច្ចយសង្គហ បដិច្ចសមុប្បាទទីបនី(ម៉ោងទី ១៩)ឥន្រ្ទិយប្បច្ច័យ បច្ច័យដោយសភាពជាធំ","a"],[20,"ព្រះអភិធម្មបរិច្ឆេទទី៨ បច្ចយសង្គហ បដិច្ចសមុប្បាទទីបនី(ម៉ោងទី ២០)ឥន្រ្ទិយប្បច្ច័យ សហជាតិន្រ្ទិយប្បច្ច័យ បញ្ហាវារៈ","a"],[21,"ព្រះអភិធម្មបរិច្ឆេទទី៨ បច្ចយសង្គហ បដិច្ចសមុប្បាទទីបនី(ម៉ោងទី ២១)ឥន្រ្ទិយប្បច្ច័យ សហជាតិន្រ្ទិយប្បច្ច័យ បញ្ហាវារៈទី៣ដល់ទី៧","a"],[22,"ព្រះអភិធម្មបរិច្ឆេទទី៨ បច្ចយសង្គហ បដិច្ចសមុប្បាទទីបនី(ម៉ោងទី ២២)ឈានប្បច្ច័យ កុសលជាបច្ច័យដល់កុសល","a"],[23,"ព្រះអភិធម្មបរិច្ឆេទទី៨ បច្ចយសង្គហ បដិច្ចសមុប្បាទទីបនី(ម៉ោងទី ២៣)ឈានប្បច្ច័យ បញ្ហាវារៈទី១ ដល់ទី៦","a"],[24,"ព្រះអភិធម្មបរិច្ឆេទទី៨ បច្ចយសង្គហ បដិច្ចសមុប្បាទទីបនី(ម៉ោងទី ២៤)ឈានប្បច្ច័យ ចែកបញ្ហាវារទី៧ និងបដិសន្ធិកាល បវត្តិកាល","a"],[25,"ព្រះអភិធម្មបរិច្ឆេទទី៨ បច្ចយសង្គហ បដិច្ចសមុប្បាទទីបនី(ម៉ោងទី ២៥)មគ្គប្បច្ច័យ ផ្លូវទៅកាន់ទុគ្គតិ សុគតិ និព្វាន","a"],[26,"ព្រះអភិធម្មបរិច្ឆេទទី៨ បច្ចយសង្គហ បដិច្ចសមុប្បាទទីបនី(ម៉ោងទី ២៦)មគ្គប្បច្ច័យ បញ្ហាវារៈទី១ដល់ទី៤ អកុសលជាបច្ច័យដល់អកុសល","a"],[27,"ព្រះអភិធម្មបរិច្ឆេទទី៨ បច្ចយសង្គហ បដិច្ចសមុប្បាទទីបនី(ម៉ោងទី ២៧)មគ្គប្បច្ច័យ បញ្ហាវារៈទី៤ដល់ទី៧ អព្យាកតជាបច្ច័យដល់អព្យាកត","a"],[28,"ព្រះអភិធម្មបរិច្ឆេទទី៨ បច្ចយសង្គហ បដិច្ចសមុប្បាទទីបនី(ម៉ោងទី ២៨)សម្បយុត្តប្បច្ច័យ ការប្រកបព្រមគ្នា","a"],[29,"ព្រះអភិធម្មបរិច្ឆេទទី៨ បច្ចយសង្គហ បដិច្ចសមុប្បាទទីបនី(ម៉ោងទី ២៩)វិប្បយុត្តប្បច្ច័យ ចែកបញ្ហាវារៈសហជាតវិប្បយុត្តប្បច្ច័យ","a"],[30,"ព្រះអភិធម្មបរិច្ឆេទទី៨ បច្ចយសង្គហ បដិច្ចសមុប្បាទទីបនី(ម៉ោងទី ៣០)វិប្បយុត្តប្បច្ច័យ បញ្ហាវារៈវត្ថុបុរេជាតវិប្បយុត្តប្បច្ច័យ","a"],[31,"ព្រះអភិធម្មបរិច្ឆេទទី៨ បច្ចយសង្គហ បដិច្ចសមុប្បាទទីបនី(ម៉ោងទី ៣១)បញ្ហាវារៈក្នុងវត្ថារម្មណបុរេជាតវិប្បយុត្តប្បច្ច័យ","a"],[32,"ព្រះអភិធម្មបរិច្ឆេទទី៨ បច្ចយសង្គហ បដិច្ចសមុប្បាទទីបនី(ម៉ោងទី ៣២)ចែកបញ្ហាវារៈរបស់បច្ឆាជាតវិប្បយុត្តប្បច្ច័យ","a"],[33,"ព្រះអភិធម្មបរិច្ឆេទទី៨ បច្ចយសង្គហ បដិច្ចសមុប្បាទទីបនី(ម៉ោងទី ៣៣)អត្ថិប្បច្ច័យ បាលីនិទ្ទេសរបស់អត្ថិប្បច្ច័យ","a"],[34,"ព្រះអភិធម្មបរិច្ឆេទទី៨ បច្ចយសង្គហ បដិច្ចសមុប្បាទទីបនី(ម៉ោងទី ៣៤)អត្ថិប្បច្ច័យ អធិប្បាយបញ្ហាវារៈបញ្ចប់","a"],[35,"ព្រះអភិធម្មបរិច្ឆេទទី៨ បច្ចយសង្គហ បដិច្ចសមុប្បាទទីបនី(ម៉ោងទី ៣៥)សហជាតត្ថិប្បច្ច័យ វត្ថុបុរេជាតត្ថិប្បច្ច័យ","a"],[36,"ព្រះអភិធម្មបរិច្ឆេទទី៨ បច្ចយសង្គហ បដិច្ចសមុប្បាទទីបនី(ម៉ោងទី ៣៦)វត្ថុបុរេជាតត្ថិប្បច្ច័យ វត្ថារម្មណបុរេជាតត្ថិប្បច្ច័យ","a"],[37,"ព្រះអភិធម្មបរិច្ឆេទទី៨ បច្ចយសង្គហ បដិច្ចសមុប្បាទទីបនី(ម៉ោងទី ៣៧)បច្ឆាជាតត្ថិប្បច្ច័យ រូបអាហារត្ថិប្បច្ច័យ","a"],[38,"ព្រះអភិធម្មបរិច្ឆេទទី៨ បច្ចយសង្គហ បដិច្ចសមុប្បាទទីបនី(ម៉ោងទី ៣៨)នត្ថិប្បច្ច័យ ការមិនមានក្នុងអនុខណៈទាំង៣","a"],[39,"ព្រះអភិធម្មបរិច្ឆេទទី៨ បច្ចយសង្គហ បដិច្ចសមុប្បាទទីបនី(ម៉ោងទី ៣៩)នត្ថិប្បច្ច័យ បញ្ហាវារៈទី៤ និងទី៥","a"],[40,"ព្រះអភិធម្មបរិច្ឆេទទី៨ បច្ចយសង្គហ បដិច្ចសមុប្បាទទីបនី (ម៉ោងទី ៤០) វិគតប្បច្ច័យ បញ្ហាវារៈទី១ដល់ទី៣","a"],[41,"ព្រះអភិធម្មបរិច្ឆេទទី៨ បច្ចយសង្គហ បដិច្ចសមុប្បាទទីបនី (ម៉ោងទី ៤១) អវិគតប្បច្ច័យ បច្ច័យដែលមិនទាន់ប្រាស់ទៅ","a"],[42,"ព្រះអភិធម្មបរិច្ឆេទទី៨ បច្ចយសង្គហ បដិច្ចសមុប្បាទទីបនី (ម៉ោងទី ៤២) រម្លឹកមេរៀនហេតុប្បច្ច័យ ហេតុ ៦","a"],[43,"ព្រះអភិធម្មបរិច្ឆេទទី៨ បច្ចយសង្គហ បដិច្ចសមុប្បាទទីបនី (ម៉ោងទី ៤៣) រម្លឹកអារម្មណប្បច្ច័យ​និងចែកដោយកាលជាដើម","a"],[44,"ព្រះអភិធម្មបរិច្ឆេទទី៨ បច្ចយសង្គហ បដិច្ចសមុប្បាទទីបនី (ម៉ោងទី ៤៤) រម្លឹកអធិប្បច្ច័យ និងចែកដោយលក្ខណៈជាដើម","a"],[45,"ព្រះអភិធម្មបរិច្ឆេទទី៨ បច្ចយសង្គហ បដិច្ចសមុប្បាទទីបនី (ម៉ោងទី ៤៥) រម្លឹកអារម្មណាធិបតិប្បច្ច័យ និងឥដ្ឋារម្មណ៍២ យ៉ាង","a"],[46,"ព្រះអភិធម្មបរិច្ឆេទទី៨ បច្ចយសង្គហ បដិច្ចសមុប្បាទទីបនី (ម៉ោងទី ៤៦) រម្លឹកអនន្តរប្បច្ច័យ សមនន្តរ សហជាតប្បច្ច័យ","a"],[47,"ព្រះអភិធម្មបរិច្ឆេទទី៨ បច្ចយសង្គហ បដិច្ចសមុប្បាទទីបនី (ម៉ោងទី ៤៧) រម្លឹកសហជាតប្បច្ច័យ បច្ច័យកើតព្រមគ្នា","a"],[48,"ព្រះអភិធម្មបរិច្ឆេទទី៨ បច្ចយសង្គហ បដិច្ចសមុប្បាទទីបនី (ម៉ោងទី ៤៨) រម្លឹកសហជាតប្បច្ច័យ បច្ច័យកើតព្រមគ្នាភាគបញ្ចប់","a"],[49,"ព្រះអភិធម្មបរិច្ឆេទទី៨ បច្ចយសង្គហ បដិច្ចសមុប្បាទទីបនី (ម៉ោងទី ៤៩) រម្លឹកសហជាតប្បច្ច័យភាគបញ្ចប់","a"],[50,"ព្រះអភិធម្មបរិច្ឆេទទី៨ បច្ចយសង្គហ បដិច្ចសមុប្បាទទីបនី (ម៉ោងទី ៥០) រម្លឹកអញ្ញមញ្ញប្បច្ច័យ បច្ច័យដល់គ្នានិងគ្នា","a"],[51,"ព្រះអភិធម្មបរិច្ឆេទទី៨ បច្ចយសង្គហ បដិច្ចសមុប្បាទទីបនី (ម៉ោងទី ៥១) រម្លឹកនិស្សយប្បច្ច័យ វត្ថុបុរេជាតនិស្សយប្បច្ច័យ","a"],[52,"ព្រះអភិធម្មបរិច្ឆេទទី៨ បច្ចយសង្គហ បដិច្ចសមុប្បាទទីបនី (ម៉ោងទី ៥២) រម្លឹកនិស្សយប្បច្ច័យ វត្ថារម្មណបុរេជាតនិស្សយប្បច្ច័យ","a"],[53,"ព្រះអភិធម្មបរិច្ឆេទទី៨ បច្ចយសង្គហ បដិច្ចសមុប្បាទទីបនី (ម៉ោងទី ៥៣) រម្លឹកឧបនិស្សយប្បច្ច័យ ទីអាស្រ័យដ៏មានកម្លាំង","a"],[54,"ព្រះអភិធម្មបរិច្ឆេទទី៨ បច្ចយសង្គហ បដិច្ចសមុប្បាទទីបនី (ម៉ោងទី ៥៤) រម្លឹកឧបនិស្សយប្បច្ច័យ កុសលជាបច្ច័យដល់កុសល","a"],[55,"ព្រះអភិធម្មបរិច្ឆេទទី៨ បច្ចយសង្គហ បដិច្ចសមុប្បាទទីបនី (ម៉ោងទី ៥៥) រម្លឹកបកតូបនិស្សយប្បច្ច័យ កុសលជាបច្ច័យដល់កុសល","a"],[56,"ព្រះអភិធម្មបរិច្ឆេទទី៨ បច្ចយសង្គហ បដិច្ចសមុប្បាទទីបនី (ម៉ោងទី ៥៦) រម្លឹកបកតូបនិស្សយប្បច្ច័យ សីល សុត ចាគបញ្ញាជាបច្ច័យ","a"],[57,"ព្រះអភិធម្មបរិច្ឆេទទី៨ បច្ចយសង្គហ បដិច្ចសមុប្បាទទីបនី (ម៉ោងទី ៥៧) រម្លឹកបកតូបនិស្សយប្បច្ច័យ កុសលជាបច្ច័យដល់កុសល","a"],[58,"ព្រះអភិធម្មបរិច្ឆេទទី៨ បច្ចយសង្គហ បដិច្ចសមុប្បាទទីបនី (ម៉ោងទី ៥៨) រម្លឹកបកតូបនិស្សយប្បច្ច័យ អភិញ្ញាជាបច្ច័យដល់អភិញ្ញា","a"],[59,"ព្រះអភិធម្មបរិច្ឆេទទី៨ បច្ចយសង្គហ បដិច្ចសមុប្បាទទីបនី (ម៉ោងទី ៥៩) រម្លឹកបកតូបនិស្សយប្បច្ច័យ មគ្គជាបច្ច័យដល់មគ្គ","a"],[60,"ព្រះអភិធម្មបរិច្ឆេទទី៨ បច្ចយសង្គហ បដិច្ចសមុប្បាទទីបនី (ម៉ោងទី ៦០) បកតូបនិស្សយប្បច្ច័យ មគ្គ៣ជាបច្ច័យដល់បដិសម្ភិទា៤","a"],[61,"ព្រះអភិធម្មបរិច្ឆេទទី៨ បច្ចយសង្គហ បដិច្ចសមុប្បាទទីបនី (ម៉ោងទី ៦១) បកតូបនិស្សយប្បច្ច័យ បញ្ហាវារៈទី២ទី៣","a"],[62,"ព្រះអភិធម្មបរិច្ឆេទទី៨ បច្ចយសង្គហ បដិច្ចសមុប្បាទទីបនី (ម៉ោងទី ៦២) បកតូបនិស្សយប្បច្ច័យ បញ្ហាវារៈទី៣កុសលដល់អព្យាកត","a"],[63,"ព្រះអភិធម្មបរិច្ឆេទទី៨ បច្ចយសង្គហ បដិច្ចសមុប្បាទទីបនី (ម៉ោងទី ៦៣) បកតូបនិស្សយប្បច្ច័យ បញ្ហាវារៈ៤","a"],[64,"ព្រះអភិធម្មបរិច្ឆេទទី៨ បច្ចយសង្គហ បដិច្ចសមុប្បាទទីបនី (ម៉ោងទី ៦៤) បកតូបនិស្សយប្បច្ច័យ អកុសលកម្មបថជាបច្ច័យដល់កម្មបថ","a"],[65,"ព្រះអភិធម្មបរិច្ឆេទទី៨ បច្ចយសង្គហ បដិច្ចសមុប្បាទទីបនី (ម៉ោងទី ៦៥) បកតូបនិស្សយប្បច្ច័យ និយតមិច្ឆាទិដ្ឋិជាបច្ច័យដល់អនន្តរិយកម្ម","a"],[66,"ព្រះអភិធម្មបរិច្ឆេទទី៨ បច្ចយសង្គហ បដិច្ចសមុប្បាទទីបនី (ម៉ោងទី ៦៦) កតូបនិស្សយប្បច្ច័យ អកុសលជាបច្ច័យដល់កុសល","a"],[67,"ព្រះអភិធម្មបរិច្ឆេទទី៨ បច្ចយសង្គហ បដិច្ចសមុប្បាទទីបនី (ម៉ោងទី ៦៧) បកតូបនិស្សយប្បច្ច័យ អកុសលជាបច្ច័យដល់អព្យាកត","a"],[68,"ព្រះអភិ
